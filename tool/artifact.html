:atoi(s.substr(0, k).c_str()), std::atof(s.substr(k + 1).c_str())});\n    } else if (a == \"--state-rondje\") rondje = true;\n    else if (a == \"--automatie\" && i + 1 < argc) {\n      std::ifstream f(argv[++i]); if (!f) fout(\"--automatie: bestand niet te lezen\");\n      Auto x; while (f >> x.sample >> x.id >> x.waarde) automatie.push_back(x);\n    }\n    else fout(\"onbekende optie \" + a);\n  }\n\n  std::string lib = pad;\n#ifdef __APPLE__\n  {  // een .clap is op macOS een bundle: de code staat in Contents/MacOS/<naam zonder .clap>\n    std::string naam = pad.substr(pad.find_last_of('/') + 1);\n    if (naam.size() > 5 && naam.substr(naam.size() - 5) == \".clap\") naam.resize(naam.size() - 5);\n    lib = pad + \"/Contents/MacOS/\" + naam;\n  }\n#endif\n  void* h = dlopen(lib.c_str(), RTLD_NOW | RTLD_LOCAL);\n  if (!h) fout(std::string(\"dlopen: \") + dlerror());\n  auto* entry = static_cast<const clap_plugin_entry_t*>(dlsym(h, \"clap_entry\"));\n  if (!entry || !entry->init(pad.c_str())) fout(\"geen clap_entry\");\n  auto* fab = static_cast<const clap_plugin_factory_t*>(entry->get_factory(CLAP_PLUGIN_FACTORY_ID));\n  if (!fab || fab->get_plugin_count(fab) < 1) fout(\"geen plugin in de factory\");\n  const char* id = fab->get_plugin_descriptor(fab, 0)->id;\n\n  Wav in = leesWav(argv[2]);\n  if (sr <= 0) sr = in.sr;\n  uint32_t maxBlok = 1; for (auto b : blokken) if (b > maxBlok) maxBlok = b;\n\n  auto maak = [&]() {\n    const clap_plugin_t* pl = fab->create_plugin(fab, &HOST, id);\n    if (!pl || !pl->init(pl)) fout(\"plugin start niet\");\n    return pl;\n  };\n  const clap_plugin_t* pl = maak();\n  auto* pp = static_cast<const clap_plugin_params_t*>(pl->get_extension(pl, CLAP_EXT_PARAMS));\n\n  // parameters vóór activate, via flush (zoals een host die een project opent)\n  Events ev;\n  for (auto& [pid, v] : params) {\n    clap_event_param_value_t e{};\n    e.header = {sizeof(e), 0, CLAP_CORE_EVENT_SPACE_ID, CLAP_EVENT_PARAM_VALUE, 0};\n    e.param_id = pid; e.note_id = -1; e.port_index = -1; e.channel = -1; e.key = -1; e.value = v;\n    ev.ev.push_back(e);\n  }\n  clap_input_events_t inEv = {&ev, evSize, evGet};\n  clap_output_events_t uitEv = {nullptr, evPush};\n  if (pp && !ev.ev.empty()) pp->flush(pl, &inEv, &uitEv);\n\n  if (rondje) {\n    auto* st = static_cast<const clap_plugin_state_t*>(pl->get_extension(pl, CLAP_EXT_STATE));\n    if (!st) fout(\"geen state-extensie\");\n    Buf b; clap_ostream_t os = {&b, ostWrite};\n    if (!st->save(pl, &os)) fout(\"state save mislukt\");\n    pl->destroy(pl);\n    pl = maak();\n    st = static_cast<const clap_plugin_state_t*>(pl->get_extension(pl, CLAP_EXT_STATE));\n    clap_istream_t is = {&b, istRead};\n    if (!st->load(pl, &is)) fout(\"state load mislukt\");\n  }\n\n  if (!pl->activate(pl, sr, 1, maxBlok)) fout(\"activate mislukt\");\n  if (!pl->start_processing(pl)) fout(\"start_processing mislukt\");\n\n  const uint32_t kan = (uint32_t)in.k.size() > 2 ? 2 : (uint32_t)in.k.size();\n  const size_t n = in.k[0].size();\n  Wav uit; uit.sr = (uint32_t)sr; uit.k.assign(kan, std::vector<float>(n));\n  std::vector<std::vector<float>> bi(kan, std::vector<float>(maxBlok)), bu(kan, std::vector<float>(maxBlok));\n  std::vector<float*> pi(kan), pu(kan);\n  for (uint32_t c = 0; c < kan; ++c) { pi[c] = bi[c].data(); pu[c] = bu[c].data(); }\n  Events blokEv; blokEv.ev.reserve(automatie.size());\n  clap_input_events_t blokIn = {&blokEv, evSize, evGet};\n  size_t volgende = 0;\n\n  size_t pos = 0, bnr = 0; int64_t steady = 0;\n  while (pos < n) {\n    uint32_t m = blokken[bnr++ % blokken.size()];\n    if (pos + m > n) m = (uint32_t)(n - pos);\n    for (uint32_t c = 0; c < kan; ++c) std::memcpy(pi[c], &in.k[c][pos], m * 4);\n    clap_audio_buffer_t ai = {pi.data(), nullptr, kan, 0, 0}, au = {pu.data(), nullptr, kan, 0, 0};\n    // de events van dit blok, met hun tijd binnen het blok (buiten doeProcess opgebouwd: geen allocatie in RT)\n    blokEv.ev.clear();\n    while (volgende < automatie.size() && automatie[volgende].sample < pos + m) {\n      const auto& x = automatie[volgende++];\n      clap_event_param_value_t e{};\n      e.header = {sizeof(e), (uint32_t)(x.sample < pos ? 0 : x.sample - pos), CLAP_CORE_EVENT_SPACE_ID, CLAP_EVENT_PARAM_VALUE, 0};\n      e.param_id = x.id; e.note_id = -1; e.port_index = -1; e.channel = -1; e.key = -1; e.value = x.waarde;\n      blokEv.ev.push_back(e);\n    }\n    clap_process_t pr = {steady, m, nullptr, &ai, &au, 1, 1, &blokIn, &uitEv};\n    if (doeProcess(pl, &pr) == CLAP_PROCESS_ERROR) fout(\"process gaf een fout\");\n    for (uint32_t c = 0; c < kan; ++c) std::memcpy(&uit.k[c][pos], pu[c], m * 4);\n    pos += m; steady += m;\n  }\n  pl->stop_processing(pl);\n  pl->deactivate(pl);\n  pl->destroy(pl);\n  entry->deinit();\n  schrijfWav(argv[3], uit);\n  return 0;\n}\n","gereedschap/ci-null.sh":"#!/bin/sh\n# ci-null.sh — de null-test van het bouwpakket in CI (en lokaal).\n#   sh gereedschap/ci-null.sh clap <build-dir>                          pb-render door het .clap (blok 512, wisselend, state-rondje,\n#                                                                       en automatisering met events midden in blokken)\n#   sh gereedschap/ci-null.sh pluginval <plugin> \"<pluginval>\" <label>  pluginval test (VST3/AU): render opnemen, meten, poort\n# Verwacht <build-dir>/pb-render (uit gereedschap/pb-render.cpp) en <build-dir>/plugins/*.clap; of zet CLAP=… en PB_RENDER=….\nset -e\nPAKKET=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"\nT=\"$PAKKET/testsignalen\"\nSOORT=\"$1\"; shift\nsom() { if [ -n \"$GITHUB_STEP_SUMMARY\" ]; then cat >> \"$GITHUB_STEP_SUMMARY\"; else cat > /dev/null; fi; }\nif [ \"$SOORT\" = clap ]; then\n  BUILD=\"$1\"\n  CLAPPAD=\"${CLAP:-$(ls -d \"$BUILD\"/plugins/*.clap 2>/dev/null | head -1)}\"\n  RENDER=\"${PB_RENDER:-$BUILD/pb-render}\"\n  [ -n \"$CLAPPAD\" ] || { echo \"geen .clap gevonden (zet CLAP=…)\" >&2; exit 2; }\n  for variant in \"blok512|--blok 512\" \"wisselend|--blok 3,128,1,4096,77\" \"state|--blok 512 --state-rondje\"; do\n    naam=\"${variant%%|*}\"; opties=\"${variant#*|}\"; UIT=\"$PAKKET/uit/clap-$naam\"; mkdir -p \"$UIT\"\n    node -e \"for (const g of require('$T/gevallen.json')) console.log(g.naam + ' ' + g.pbRender.map(p => '--p ' + p).join(' '))\" |\n    while read -r geval params; do\n      # shellcheck disable=SC2086\n      \"$RENDER\" \"$CLAPPAD\" \"$T/$geval.in.wav\" \"$UIT/$geval.wav\" $opties $params\n    done\n    { echo \"### Null-test CLAP ($naam, $(uname -m))\"; echo; node \"$PAKKET/gereedschap/vergelijk.mjs\" \"$UIT\" || true; echo; } | tee /dev/stderr | som\n    node \"$PAKKET/gereedschap/vergelijk.mjs\" \"$UIT\" > /dev/null\n  done\n  # automatisering: parameter-events op willekeurige samples, ook midden in een blok (bewijst het splitsen, op de bits)\n  if [ -f \"$T/automatie/events.txt\" ]; then\n    UIT=\"$PAKKET/uit/clap-automatie\"; mkdir -p \"$UIT\"\n    for blok in 512 3,128,1,4096,77; do\n      \"$RENDER\" \"$CLAPPAD\" \"$T/automatie/in.wav\" \"$UIT/blok-$blok.wav\" --blok \"$blok\" --automatie \"$T/automatie/events.txt\"\n      { echo \"### Null-test CLAP automatisering, blok $blok ($(uname -m))\"; echo; node \"$PAKKET/gereedschap/vergelijk.mjs\" --automatie \"$UIT/blok-$blok.wav\" || true; echo; } | tee /dev/stderr | som\n      node \"$PAKKET/gereedschap/vergelijk.mjs\" --automatie \"$UIT/blok-$blok.wav\" > /dev/null\n    done\n  fi\nelif [ \"$SOORT\" = pluginval ]; then\n  PLUGIN=\"$1\"; PV=\"$2\"; LABEL=\"$3\"; UIT=\"$PAKKET/uit/pluginval-$LABEL\"; mkdir -p \"$UIT/cfg\"\n  for cfg in \"$T\"/pluginval/*.json; do\n    geval=\"$(basename \"$cfg\" .json)\"\n    node -e \"const c=require('$cfg'); c.input.audio='$T/'+c.input.audio.replace('../',''); c.reference='$UIT/'+c.name+'.wav'; require('fs').writeFileSync('$UIT/cfg/$geval.json', JSON.stringify(c,null,2));\"\n    rm -f \"${UIT:?}/${geval:?}.wav\" \"${UIT:?}/${geval:?}.wav.json\"\n    $PV test --record-missing --plugin \"$PLUGIN\" \"$UIT/cfg/$geval.json\"\n  done\n  { echo \"### Null-test $LABEL (pluginval test, blok 512)\"; echo; node \"$PAKKET/gereedschap/vergelijk.mjs\" \"$UIT\" || true; echo; } | tee /dev/stderr | som\n  for cfg in \"$T\"/pluginval/*.json; do\n    geval=\"$(basename \"$cfg\" .json)\"\n    if node -e \"process.exit(require('$T/gevallen.json').find(g => g.naam === '$geval').statistisch ? 0 : 1)\"; then continue; fi\n    $PV test --plugin \"$PLUGIN\" \"$cfg\"\n  done\n  node \"$PAKKET/gereedschap/vergelijk.mjs\" \"$UIT\" > /dev/null\nelse\n  echo \"gebruik: ci-null.sh clap|pluginval …\" >&2; exit 2\nfi\n","gereedschap/vergelijk.mjs":"// vergelijk.mjs — de null-test van het bouwpakket: verwachte uitvoer (uit de WASM van de Pluginbouwer) tegen een\n// render door het gebouwde binary. Staat los: alleen Node, geen andere bestanden dan testsignalen/ en wasm/.\n//   node gereedschap/vergelijk.mjs <map met renders>      exit 1 als iets boven de grens komt\n//   node gereedschap/vergelijk.mjs --automatie <render.wav>  de render van pb-render --automatie (events midden in blokken)\n// Grens: piek ≤ −90 dBFS. Gevallen met \"statistisch\" (zelfoscillatie): terts-spectrum en omhullende binnen 1 dB.\nimport { readFileSync, existsSync } from 'node:fs';\nimport { join, dirname } from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst PAKKET = join(dirname(fileURLToPath(import.meta.url)), '..');\nconst GRENS_DB = -90;\n\nfunction leesWav(pad) {\n  const b = readFileSync(pad);\n  let p = 12, fmt = null, data = null;\n  while (p + 8 <= b.length) {\n    const id = b.toString('ascii', p, p + 4), len = b.readUInt32LE(p + 4);\n    if (id === 'fmt ') fmt = { tag: b.readUInt16LE(p + 8), k: b.readUInt16LE(p + 10), sr: b.readUInt32LE(p + 12), bits: b.readUInt16LE(p + 22) };\n    if (id === 'data') data = { off: p + 8, len };\n    p += 8 + len + (len & 1);\n  }\n  const tag = fmt.tag === 0xfffe ? (fmt.bits === 32 ? 3 : 1) : fmt.tag, bps = fmt.bits / 8, n = Math.floor(data.len / (bps * fmt.k));\n  const k = Array.from({ length: fmt.k }, () => new Float32Array(n));\n  for (let i = 0; i < n; i++) for (let c = 0; c < fmt.k; c++) {\n    const o = data.off + (i * fmt.k + c) * bps;\n    k[c][i] = tag === 3 ? b.readFloatLE(o) : (bps === 2 ? b.readInt16LE(o) / 32768 : b.readInt32LE(o) / 2147483648);\n  }\n  return { kanalen: k, sr: fmt.sr };\n}\nfunction nullTest(a, b) {\n  let piek = 0, som = 0, n = 0, eerste = -1;\n  for (let c = 0; c < Math.min(a.length, b.length); c++) for (let i = 0; i < Math.min(a[c].length, b[c].length); i++) {\n    const d = a[c][i] - b[c][i];\n    if (!Number.isFinite(d)) return { piekDb: Infinity, rmsDb: Infinity, eerste: i };\n    if (d !== 0 && eerste < 0) eerste = i;\n    piek = Math.max(piek, Math.abs(d)); som += d * d; n++;\n  }\n  const db = (x) => (x === 0 ? -Infinity : 20 * Math.log10(x));\n  return { piekDb: db(piek), rmsDb: db(Math.sqrt(som / Math.max(1, n))), eerste };\n}\nfunction fft(re, im) {\n  const n = re.length;\n  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }\n  for (let len = 2; len <= n; len <<= 1) {\n    const h = -2 * Math.PI / len, wr = Math.cos(h), wi = Math.sin(h);\n    for (let i = 0; i < n; i += len) {\n      let cr = 1, ci = 0;\n      for (let k = 0; k < len / 2; k++) {\n        const a = i + k, b = a + len / 2, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;\n        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;\n        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;\n      }\n    }\n  }\n}\nfunction spectrum(x) {\n  const n = x.length, re = Float64Array.from(x), im = new Float64Array(n);\n  fft(re, im);\n  const p = new Float64Array(n / 2 + 1);\n  for (let k = 0; k <= n / 2; k++) p[k] = re[k] ** 2 + im[k] ** 2;\n  return p;\n}\nfunction statistisch(a, b, sr) {\n  let band = 0, omh = 0;\n  for (let c = 0; c < Math.min(a.length, b.length); c++) {\n    let n = 1; while (n < a[c].length) n <<= 1; n >>= 1;\n    const pa = spectrum(a[c].subarray(0, n)), pb = spectrum(b[c].subarray(0, n)), tot = pa.reduce((s, v) => s + v, 0);\n    for (let f = 20; f < 20000; f *= Math.pow(2, 1 / 3)) {\n      const lo = Math.floor(f / sr * n), hi = Math.max(lo + 1, Math.floor(f * Math.pow(2, 1 / 3) / sr * n));\n      let ea = 0, eb = 0; for (let k = lo; k < hi; k++) { ea += pa[k]; eb += pb[k]; }\n      if (ea >= tot * 1e-8) band = Math.max(band, Math.abs(10 * Math.log10(ea / eb)));\n    }\n    const v = Math.round(sr / 10);\n    for (let i = 0; i + v <= a[c].length; i += v) {\n      let ea = 0, eb = 0; for (let k = i; k < i + v; k++) { ea += a[c][k] ** 2; eb += b[c][k] ** 2; }\n      if (ea / v >= 1e-6) omh = Math.max(omh, Math.abs(10 * Math.log10(ea / eb)));\n    }\n  }\n  return { band, omh };\n}\n// diagnose: klinkt de render als de STANDAARDwaarden? Op de ketenmotor uit het pakket (wasm/graaf.wasm + keten.json).\nfunction standaardRender(invoer, sr) {\n  const { exports: e } = new WebAssembly.Instance(new WebAssembly.Module(readFileSync(join(PAKKET, 'wasm', 'graaf.wasm'))), {});\n  const { rij } = JSON.parse(readFileSync(join(PAKKET, 'wasm', 'keten.json'), 'utf8'));\n  const h = e.pg_maak(sr);\n  new Float64Array(e.memory.buffer, e.pg_rij(), rij.length).set(rij);\n  e.pg_laad(h, rij.length);\n  const n = invoer[0].length, uit = invoer.map(() => new Float32Array(n));\n  for (let p = 0; p < n; p += 128) {\n    const m = Math.min(128, n - p);\n    for (let c = 0; c < invoer.length; c++) new Float32Array(e.memory.buffer, e.pg_in(h, c), m).set(invoer[c].subarray(p, p + m));\n    e.pg_verwerk(h, invoer.length, m);\n    for (let c = 0; c < invoer.length; c++) uit[c].set(new Float32Array(e.memory.buffer, e.pg_uit(h, c), m), p);\n  }\n  return uit;\n}\n\nif (process.argv[2] === '--automatie') {\n  // node gereedschap/vergelijk.mjs --automatie <render.wav>: pb-render --automatie tegen testsignalen/automatie/verwacht.wav\n  const r = nullTest(leesWav(join(PAKKET, 'testsignalen', 'automatie', 'verwacht.wav')).kanalen, leesWav(process.argv[3]).kanalen);\n  const ok = r.piekDb <= GRENS_DB, f = (x) => (x === -Infinity ? '−∞ (bit voor bit gelijk)' : `${x.toFixed(1)} dBFS`);\n  console.log(`| automatie (events midden in blokken) | ${f(r.piekDb)} | ${f(r.rmsDb)} | ${r.piekDb === -Infinity ? 'ja' : 'nee'} |${ok ? '' : ' **BOVEN DE GRENS** — splitst de plugin het blok bij elk event (header.time)?'}`);\n  process.exit(ok ? 0 : 1);\n}\nconst map = process.argv[2];\nif (!map) { console.error('gebruik: node gereedschap/vergelijk.mjs <map met renders> | --automatie <render.wav>'); process.exit(2); }\nconst gevallen = JSON.parse(readFileSync(join(PAKKET, 'testsignalen', 'gevallen.json'), 'utf8'));\nlet mis = 0;\nconsole.log('| geval | piek | RMS | bit voor bit |\\n|---|---|---|---|');\nfor (const g of gevallen) {\n  const pad = join(map, `${g.naam}.wav`);\n  if (!existsSync(pad)) { console.log(`| ${g.naam} | ontbreekt | | |`); mis++; continue; }\n  const verwacht = leesWav(join(PAKKET, 'testsignalen', `${g.naam}.verwacht.wav`)).kanalen, gekregen = leesWav(pad).kanalen;\n  const r = nullTest(verwacht, gekregen);\n  let ok = r.piekDb <= GRENS_DB, extra = '';\n  if (g.statistisch) {\n    const s = statistisch(verwacht, gekregen, g.sr);\n    ok = s.band <= 1 && s.omh <= 1;\n    extra = ` statistisch: terts ${s.band.toFixed(3)} dB, omhullende ${s.omh.toFixed(3)} dB`;\n  }\n  if (!ok && !g.statistisch) {\n    const inv = leesWav(join(PAKKET, 'testsignalen', `${g.naam}.in.wav`));\n    if (nullTest(standaardRender(inv.kanalen, inv.sr), gekregen).piekDb <= GRENS_DB)\n      extra += ' — gelijk aan de STANDAARDwaarden: de parameters kwamen niet aan (CLAUDE.md valkuil 1)';\n  }\n  if (!ok) mis++;\n  const f = (x) => (x === -Infinity ? '−∞ (bit voor bit gelijk)' : `${x.toFixed(1)} dBFS`);\n  console.log(`| ${g.naam} | ${f(r.piekDb)} | ${f(r.rmsDb)} | ${r.piekDb === -Infinity ? 'ja' : 'nee'} |${extra}${ok ? '' : ' **BOVEN DE GRENS**'}`);\n}\nprocess.exit(mis ? 1 : 0);\n","patches/clap-wrapper-auv2-params-voor-init.patch":"diff --git a/src/detail/auv2/auv2_base_classes.h b/src/detail/auv2/auv2_base_classes.h\nindex 2db27a8..b3a85a8 100644\n--- a/src/detail/auv2/auv2_base_classes.h\n+++ b/src/detail/auv2/auv2_base_classes.h\n@@ -1,4 +1,6 @@\n #pragma once\n+#include <vector>\n+#include <utility>\n \n /*\n  Copyright (c) 2023 Timo Kaluza (defiantnerd)\n@@ -759,6 +761,9 @@ class WrapAsAUV2 : public ausdk::AUBase,\n \n   std::unique_ptr<Clap::AUv2::ProcessAdapter> _processAdapter;\n   std::atomic<bool> _initialized = false;\n+  // parameters set by the host before Initialize(): there is no process adapter yet, so they would only\n+  // live in the AUBase element and never reach the CLAP. They are flushed to the CLAP in activateCLAP().\n+  std::vector<std::pair<clap_id, double>> _paramsBeforeInit;\n \n   // some info about the wrapped clap\n   // audio-port layout captured at PostConstructor. Scanning the CLAP\ndiff --git a/src/wrapasauv2.cpp b/src/wrapasauv2.cpp\nindex ca783d1..8ee03fd 100644\n--- a/src/wrapasauv2.cpp\n+++ b/src/wrapasauv2.cpp\n@@ -585,6 +585,22 @@ OSStatus WrapAsAUV2::SetParameter(AudioUnitParameterID inID, AudioUnitScope inSc\n         _processAdapter->addParameterEvent(param, inValue, inBufferOffsetInFrames);\n       }\n     }\n+    else\n+    {\n+      auto p = _parametertree.find(inID);\n+      if (p != _parametertree.end())\n+      {\n+        const auto id = p->second.get()->info().id;\n+        bool found = false;\n+        for (auto &pv : _paramsBeforeInit)\n+          if (pv.first == id)\n+          {\n+            pv.second = inValue;\n+            found = true;\n+          }\n+        if (!found) _paramsBeforeInit.emplace_back(id, (double)inValue);\n+      }\n+    }\n   }\n   return AUBase::SetParameter(inID, inScope, inElement, inValue, inBufferOffsetInFrames);\n }\n@@ -1124,6 +1140,43 @@ void WrapAsAUV2::activateCLAP()\n                                      &_parametertree, this, maxSampleFrames, _midi_preferred_dialect,\n                                      _midi_supported_dialects, clapAudioInputs, clapAudioOutputs);\n \n+    if (!_paramsBeforeInit.empty() && _plugin->_ext._params)\n+    {\n+      struct PendingEvents\n+      {\n+        std::vector<clap_event_param_value_t> ev;\n+        static uint32_t size(const clap_input_events_t *l)\n+        {\n+          return (uint32_t) static_cast<PendingEvents *>(l->ctx)->ev.size();\n+        }\n+        static const clap_event_header_t *get(const clap_input_events_t *l, uint32_t i)\n+        {\n+          return &static_cast<PendingEvents *>(l->ctx)->ev[i].header;\n+        }\n+        static bool push(const clap_output_events_t *, const clap_event_header_t *)\n+        {\n+          return true;\n+        }\n+      } pending;\n+      for (auto &pv : _paramsBeforeInit)\n+      {\n+        clap_event_param_value_t e{};\n+        e.header = {sizeof(e), 0, CLAP_CORE_EVENT_SPACE_ID, CLAP_EVENT_PARAM_VALUE, 0};\n+        e.param_id = pv.first;\n+        e.cookie = nullptr;\n+        e.note_id = -1;\n+        e.port_index = -1;\n+        e.channel = -1;\n+        e.key = -1;\n+        e.value = pv.second;\n+        pending.ev.push_back(e);\n+      }\n+      clap_input_events_t in = {&pending, PendingEvents::size, PendingEvents::get};\n+      clap_output_events_t out = {&pending, PendingEvents::push};\n+      _plugin->_ext._params->flush(_plugin->_plugin, &in, &out);\n+      _paramsBeforeInit.clear();\n+    }\n+\n     _plugin->activate();\n     _plugin->start_processing();\n     _initialized = true;\n","patches/clap-wrapper-geen-thread-local-in-process.patch":"Herkomst: proef E2 (tak proef/e2, fase 0, 15 okt 2026), door een vers Claude Code-gesprek gevonden en gemaakt;\nE1 en E3 vonden hetzelfde los daarvan. clap-wrapper v0.16.0 houdt in src/clap_proxy.cpp twee static thread_local\ntellers bij; in een dynamisch geladen plugin maakt dyld (macOS) die lui aan met calloc bij de eerste aanraking per\nthread, dus op de audiothread (AlwaysAudioThread in WrapAsAUV2::Render en WrapAsVST3::process). pluginval --rtcheck\nvangt het. Hier: een pthread-key, gemaakt bij het laden; get/setspecific alloceren niet. Windows houdt thread_local.\n\ndiff --git a/src/clap_proxy.cpp b/src/clap_proxy.cpp\nindex 49c94c8..9afdbbf 100644\n--- a/src/clap_proxy.cpp\n+++ b/src/clap_proxy.cpp\n@@ -505,12 +505,42 @@ void Plugin::log(clap_log_severity severity, const char *msg)\n #endif\n }\n \n-static thread_local uint32_t g_main_thread_override = 0;\n-static thread_local uint32_t g_audio_thread_override = 0;\n+#if !defined(_WIN32)\n+ThreadCounter::ThreadCounter()\n+{\n+  pthread_key_create(&_key, nullptr);\n+}\n+uint32_t ThreadCounter::get() const\n+{\n+  return (uint32_t)(uintptr_t)pthread_getspecific(_key);\n+}\n+void ThreadCounter::add(int32_t delta)\n+{\n+  pthread_setspecific(_key, (void *)(uintptr_t)(uint32_t)((int32_t)get() + delta));\n+}\n+#else\n+static thread_local uint32_t g_thread_counters[2] = {0, 0};\n+static uint32_t g_thread_counters_used = 0;\n+ThreadCounter::ThreadCounter() : _slot(g_thread_counters_used++)\n+{\n+}\n+uint32_t ThreadCounter::get() const\n+{\n+  return g_thread_counters[_slot];\n+}\n+void ThreadCounter::add(int32_t delta)\n+{\n+  g_thread_counters[_slot] = (uint32_t)((int32_t)g_thread_counters[_slot] + delta);\n+}\n+#endif\n+\n+// created when the plugin binary is loaded (on the loading thread), never on the audio thread\n+static ThreadCounter g_main_thread_override;\n+static ThreadCounter g_audio_thread_override;\n \n bool Plugin::is_main_thread() const\n {\n-  if (g_main_thread_override > 0)\n+  if (g_main_thread_override.get() > 0)\n   {\n     return true;\n   }\n@@ -519,7 +549,7 @@ bool Plugin::is_main_thread() const\n \n bool Plugin::is_audio_thread() const\n {\n-  if (g_audio_thread_override > 0)\n+  if (g_audio_thread_override.get() > 0)\n   {\n     return true;\n   }\ndiff --git a/src/clap_proxy.h b/src/clap_proxy.h\nindex d1c9830..eeb14c4 100644\n--- a/src/clap_proxy.h\n+++ b/src/clap_proxy.h\n@@ -19,6 +19,9 @@\n #include <memory>\n #include <thread>\n #include <atomic>\n+#if !defined(_WIN32)\n+#include <pthread.h>\n+#endif\n \n #if WIN\n #include <windows.h>\n@@ -125,20 +128,38 @@ struct ClapPluginExtensions\n #endif\n };\n \n+// A per-thread counter. On POSIX it lives in a pthread key created at load time: a C++ thread_local in a\n+// dynamically loaded plugin is allocated lazily by dyld/glibc on its first use in each thread, and that\n+// first use is the audio thread's process call (a real-time violation that pluginval --rtcheck catches).\n+class ThreadCounter\n+{\n+ public:\n+  ThreadCounter();\n+  uint32_t get() const;\n+  void add(int32_t delta);\n+\n+ private:\n+#if !defined(_WIN32)\n+  pthread_key_t _key;\n+#else\n+  uint32_t _slot;\n+#endif\n+};\n+\n class Raise\n {\n  public:\n-  Raise(uint32_t &counter) : ctx(counter)\n+  Raise(ThreadCounter &counter) : ctx(counter)\n   {\n-    ++ctx;\n+    ctx.add(1);\n   }\n   ~Raise()\n   {\n-    ctx--;\n+    ctx.add(-1);\n   }\n \n  private:\n-  uint32_t &ctx;\n+  ThreadCounter &ctx;\n };\n \n /// <summary>\n","patches/clap-wrapper-auv2-tailtime.patch":"Herkomst: Pluginbouwer, 17 okt 2026. auval meldde 'Tail Time: Recommended Property is not supported': clap-wrapper\nv0.16.0 geeft SupportsTail() vast false, dus ausdk biedt kAudioUnitProperty_TailTime nooit aan, terwijl GetTailTime()\nde CLAP-tail al doorgeeft. Een host (Logic: bounce met staart) kreeg de staart nooit te horen. Nu: true als de CLAP\nde tail-extensie heeft.\n\ndiff --git a/src/detail/auv2/auv2_base_classes.h b/src/detail/auv2/auv2_base_classes.h\nindex 2db27a8..0ba23e3 100644\n--- a/src/detail/auv2/auv2_base_classes.h\n+++ b/src/detail/auv2/auv2_base_classes.h\n@@ -369,10 +369,7 @@ class WrapAsAUV2 : public ausdk::AUBase,\n   // latency/tailtime/processing\n   virtual Float64 GetLatency() override;\n   virtual Float64 GetTailTime() override;\n-  virtual bool SupportsTail() override\n-  {\n-    return false;\n-  }\n+  virtual bool SupportsTail() override;\n \n   bool StreamFormatWritable(AudioUnitScope, AudioUnitElement) override\n   {\ndiff --git a/src/wrapasauv2.cpp b/src/wrapasauv2.cpp\nindex ca783d1..636c185 100644\n--- a/src/wrapasauv2.cpp\n+++ b/src/wrapasauv2.cpp\n@@ -693,6 +693,13 @@ Float64 WrapAsAUV2::GetLatency()\n   return 0.0;\n }\n \n+// TailTime alleen aanbieden als de CLAP de tail-extensie heeft; GetTailTime() geeft hem dan door.\n+// (In v0.16.0 vast false: de host, bv. Logic bij een bounce met staart, kreeg de staart nooit te horen.)\n+bool WrapAsAUV2::SupportsTail()\n+{\n+  return _plugin && _plugin->_ext._tail;\n+}\n+\n Float64 WrapAsAUV2::GetTailTime()\n {\n   if (_plugin && _plugin->_ext._tail)\n","patches/clap-wrapper-auv2-setparameter-draadveilig.patch":"Herkomst: proef F1 (tak proef/f1, fase 3, 17 okt 2026), door een vers Claude Code-gesprek gevonden en gemaakt.\nclap-wrapper v0.16.0 (AUv2) zet in ProcessAdapter::addParameterEvent een parameter-event met emplace_back in de\nstd::vectors _events/_eventindices, zonder lock, op de thread die SetParameter aanroept. Een host mag dat vanaf elke\nthread doen terwijl Render loopt; process() sorteert en leest diezelfde vectors en wist ze aan het eind. pluginval\n\"Parameter thread safety\" (AU, macOS) liet de plugin daardoor af en toe crashen in process bij het lezen van een event\n(CI-run 39041820535: \"VALIDATION CRASHED\", process+344 ← ProcessAdapter::process ← WrapAsAUV2::Render).\nHier: SetParameter zet het event onder een spinlock (de bestaande ClapWrapper::detail::shared::SpinLock) in een eigen\nlijst; process() neemt die lijst aan zijn begin over in _events, kort onder dezelfde lock. De lock wordt nooit\nvastgehouden terwijl de plugin rekent, dus een SetParameter vanuit Render zelf kan niet vastlopen.\n\ndiff --git a/src/detail/auv2/process.cpp b/src/detail/auv2/process.cpp\nindex 6e4c315..bb97291 100644\n--- a/src/detail/auv2/process.cpp\n+++ b/src/detail/auv2/process.cpp\n@@ -162,6 +162,11 @@ void ProcessAdapter::setupProcessing(ausdk::AUScope &audioInputs, ausdk::AUScope\n   _eventindices.clear();\n   _eventindices.reserve(_events.capacity());\n   _sysexBuffers.prepare(16);\n+  {\n+    ClapWrapper::detail::shared::SpinLockGuard guard(_pendingLock);\n+    _pendingParams.clear();\n+    _pendingParams.reserve(8192);\n+  }\n \n   _out_events.ctx = this;\n \n@@ -189,6 +194,16 @@ void ProcessAdapter::sortEventIndices()\n \n void ProcessAdapter::process(ProcessData &data)\n {\n+  {\n+    // take over the parameter events queued by SetParameter (possibly from other threads)\n+    ClapWrapper::detail::shared::SpinLockGuard guard(_pendingLock);\n+    for (auto &n : _pendingParams)\n+    {\n+      _eventindices.emplace_back(_events.size());\n+      _events.emplace_back(n);\n+    }\n+    _pendingParams.clear();\n+  }\n   // CLAP requires event times within [0, frames_count); a host stamping\n   // MIDIEventList packets with out-of-range timestamps (e.g. mach host time\n   // instead of sample offsets) would otherwise make plugins that index their\n@@ -802,7 +817,7 @@ void ProcessAdapter::addParameterEvent(const clap_param_info_t &info, double val\n   n.param.channel = -1;\n   n.param.note_id = -1;\n \n-  this->_eventindices.emplace_back(this->_events.size());\n-  this->_events.emplace_back(n);\n+  ClapWrapper::detail::shared::SpinLockGuard guard(_pendingLock);\n+  this->_pendingParams.emplace_back(n);\n }\n }  // namespace Clap::AUv2\ndiff --git a/src/detail/auv2/process.h b/src/detail/auv2/process.h\nindex 30186b1..6135eef 100644\n--- a/src/detail/auv2/process.h\n+++ b/src/detail/auv2/process.h\n@@ -22,6 +22,7 @@\n #endif\n \n #include <AudioUnitSDK/AUBase.h>\n+#include \"detail/shared/spinlock.h\"\n \n // TODO: check if additional AU headers are needed\n #include <AudioToolbox/AudioToolbox.h>\n@@ -174,6 +175,12 @@ class ProcessAdapter\n   std::vector<clap_multi_event_t> _events;\n   std::vector<size_t> _eventindices;\n \n+  // parameter events from SetParameter, which a host may call from any thread while\n+  // process() runs; process() moves them into _events at its start. Only the spin lock\n+  // guards _pendingParams; _events/_eventindices stay with the audio thread.\n+  ClapWrapper::detail::shared::SpinLock _pendingLock;\n+  std::vector<clap_multi_event_t> _pendingParams;\n+\n   // owns the payloads referenced by CLAP_EVENT_MIDI_SYSEX events for the\n   // duration of one process() cycle (clap_event_midi_sysex_t only borrows a\n   // pointer). Reset together with _events at the end of each cycle; buffers\n","gereedschap/pas-patches-toe.sh":"#!/bin/sh\n# pas-patches-toe.sh <map> — elke patch uit <map>, in naamvolgorde, op de huidige map (de bron van clap-wrapper).\n# Een patch die er al op zit wordt overgeslagen, zodat een tweede configure niet faalt.\nset -e\nfor p in \"$1\"/*.patch; do\n  if git apply --reverse --check \"$p\" 2>/dev/null; then echo \"patch zit er al op: $(basename \"$p\")\"; continue; fi\n  git apply \"$p\"\n  echo \"patch toegepast: $(basename \"$p\")\"\ndone\n"}};

  ['granulaire wolk', 'klank', 'instrument', 'granulair'], ['ladderfilter', 'klank', 'effect', 'filters'],

const knop = (type, id) => BIB[type].knoppen.find((k) => k.id === id);

// De uitvoervolgorde: diepte-eerst vanaf de ingang; een kabel naar een knoop die nog op de stapel ligt is een
// terugkoppeling (die leest de vorige sample). Elke terugkoppeling moet door een vertraging lopen.
function volgorde(ontwerp) {
  const fouten = [], ids = ontwerp.knopen.map((k) => k.id), uitKabels = new Map(ids.map((i) => [i, []]));
  for (const k of ontwerp.kabels) uitKabels.get(k.van[0])?.push(k);
  const staat = new Map(), post = [], terug = [];
  const bezoek = (id, pad) => {
    staat.set(id, 1);
    for (const k of uitKabels.get(id) || []) {
      const doel = k.naar[0];
      if (staat.get(doel) === 1) {
        terug.push(k);
        const lus = pad.slice(pad.indexOf(doel));
        if (!lus.some((n) => typeVan(ontwerp, n) === 'vertraging'))
          fouten.push(`terugkoppeling ${k.van[0]} → ${doel} heeft geen vertraging: hij zou in nul tijd rond moeten`);
      } else if (!staat.get(doel)) bezoek(doel, [...pad, doel]);
    }
    staat.set(id, 2); post.push(id);
  };
  const begin = ontwerp.knopen.filter((k) => k.type === 'in' || BIB[k.type].gedeeld).map((k) => k.id);
  for (const b of begin) if (!staat.get(b)) bezoek(b, [b]);
  for (const id of ids) if (!staat.get(id)) bezoek(id, [id]);   // losse knopen achteraan
  const orde = post.reverse();
  // gedeelde knopen vooraan (de motor rekent ze toch eerst), de rest in topologische volgorde
  const gedeeld = orde.filter((id) => BIB[typeVan(ontwerp, id)].gedeeld);
  return { orde: [...gedeeld, ...orde.filter((id) => !gedeeld.includes(id))], terug, fouten };
}
const typeVan = (o, id) => o.knopen.find((k) => k.id === id).type;

// compileer: ontwerp → { rij (Float64Array voor pg_laad / de header), params, orde, fouten }
function compileer(ontwerp) {
  const fouten = [];
  for (const k of ontwerp.knopen) if (!BIB[k.type]) fouten.push(`onbekend blok ${k.type}`);
  if (fouten.length) return { fouten };
  const { orde, fouten: f2 } = volgorde(ontwerp);
  fouten.push(...f2);
  if (!ontwerp.knopen.some((k) => k.type === 'in' || BRONNEN.includes(k.type))) fouten.push('er is geen ingang en geen bron (oscillator, ruis, snaar of trommel)');
  if (!ontwerp.knopen.some((k) => k.type === 'uit')) fouten.push('er is geen uitgang');
  const plek = new Map(orde.map((id, i) => [id, i]));
  const params = ontwerp.parameters.map((p) => {
    const kn = ontwerp.knopen.find((k) => k.id === p.knoop), def = knop(kn.type, p.knop);
    return { naam: p.naam, eenheid: p.eenheid ?? def.eenheid, min: p.min ?? def.min, max: p.max ?? def.max,
      standaard: p.standaard ?? kn.waarden?.[p.knop] ?? def.std, glijMs: p.glijMs ?? def.glijMs, uitleg: p.uitleg ?? '',
      knoop: p.knoop, knop: p.knop, glijden: p.glijden ?? 'glijden', ...(p.ook ? { ook: p.ook } : {}) };
  });
  const rij = [orde.length, params.length];
  for (const id of orde) {
    const kn = ontwerp.knopen.find((k) => k.id === id), bib = BIB[kn.type];
    rij.push(SOORT[kn.type]);
    for (let i = 0; i < 2; i++) {
      const kabel = ontwerp.kabels.find((k) => k.naar[0] === id && k.naar[1] === (bib.in[i] ?? '\u0000'));
      if (kabel) {
        const van = ontwerp.knopen.find((k) => k.id === kabel.van[0]);
        rij.push(plek.get(kabel.van[0]), Math.max(0, BIB[van.type].uit.indexOf(kabel.van[1])));
      } else rij.push(-1, 0);
    }
    for (let j = 0; j < 4; j++) {
      const def = bib.knoppen[j];
      if (!def) { rij.push(-1, 0, -1, 0, 0); continue; }
      // een parameter stuurt zijn eigen knop, en eventueel meer ("ook": [[knoop, knop, schaal]])
      let pi = params.findIndex((p) => p.knoop === id && p.knop === def.id), schaal = 1;
      if (pi < 0) {
        pi = params.findIndex((p) => (p.ook || []).some(([k, kn2]) => k === id && kn2 === def.id));
        if (pi >= 0) schaal = params[pi].ook.find(([k, kn2]) => k === id && kn2 === def.id)[2] ?? 1;
      }
      const mod = (ontwerp.modulaties || []).find((m) => m.doel[0] === id && m.doel[1] === def.id);
      const modKnoop = mod ? plek.get(mod.bron[0]) : -1;
      let modPoort = mod ? Math.max(0, BIB[typeVan(ontwerp, mod.bron[0])].uit.indexOf(mod.bron[1])) : 0;
      // diepte 1 = het hele bereik van de knop. Knoppen op een log-schaal (frequentie, tijd) bewegen in octaven
      // (poort + 8 = exponentieel in pb_graaf.h); lineaire knoppen: een plugin-parameter schaalt de motor zelf
      // met zijn bereik, een vaste knop krijgt het bereik uit de BIB mee.
      let diepte = mod ? mod.diepte : 0;
      if (mod) {
        const p = pi >= 0 ? params[pi] : null, lo = p ? p.min : def.min, hi = p ? p.max : def.max;
        if (def.exp && lo > 0) { modPoort += 8; diepte *= Math.log2(hi / lo); }
        else if (pi < 0) diepte *= hi - lo;
      }
      if (pi >= 0 && schaal !== 1) rij.push(pi + 1000, schaal, modKnoop, modPoort, diepte);
      else rij.push(pi, kn.waarden?.[def.id] ?? def.std, modKnoop, modPoort, diepte);
    }
    let v0 = 0, v1 = 0;
    if (kn.type === 'vertraging') {
      v0 = kn.vast?.max ?? 1200;
      // compensatie: de fractionele latency van wat er vlak vóór de vertraging zit (de tape: ½ sample)
      const voor = ontwerp.kabels.find((k) => k.naar[0] === id && k.naar[1] === 'in');
      v1 = voor ? (BIB[typeVan(ontwerp, voor.van[0])].latency || 0) : 0;
      const pTijd = params.find((p) => p.knoop === id && p.knop === 'tijd');
      if (pTijd && pTijd.max > v0) fouten.push(`de tijd van ${id} gaat tot ${pTijd.max} ms, de lijn maar tot ${v0} ms`);
    }
    else if (kn.type === 'biquad') v0 = kn.vast?.soort ?? 0;
    else if (bib.vasteEig) {
      v0 = kn.vast?.[bib.vasteEig[0].id] ?? bib.vasteEig[0].std;
      if (bib.vasteEig[1]) v1 = kn.vast?.[bib.vasteEig[1].id] ?? bib.vasteEig[1].std;
    }
    rij.push(v0, v1);
  }
  for (const p of params) rij.push(p.min, p.max, p.standaard, p.glijMs);
  for (const p of params) for (const [k, v] of [['min', p.min], ['max', p.max], ['standaard', p.standaard]])
    if (Math.fround(v) !== v) fouten.push(`${p.naam}: ${k} ${v} past niet exact in float32 (een AU geeft float door)`);
  return { rij: Float64Array.from(rij), params, orde, fouten };
}

// Latency van het ontwerp in hele samples (die moet de plugin melden). Fractionele delen worden gecompenseerd.
function latentie(ontwerp) {
  return ontwerp.knopen.some((k) => BIB[k.type].latency >= 1) ? Math.max(...ontwerp.knopen.map((k) => Math.floor(BIB[k.type].latency))) : 0;
}

return { BIB, BIB_LATER, BRONNEN, GOLVEN, PATRONEN, SOORT, compileer, latentie, volgorde };
})();

// ---- tool/src/fft.js
const M_fft = (() => {
// fft.js — radix-2 FFT (in-place, complex) voor de metingen. Gedeeld door de tool en de toetsen (tests/lib/fft.mjs).
function fft(re, im, inverse = false) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const hoek = (inverse ? 2 : -2) * Math.PI / len;
    const wr = Math.cos(hoek), wi = Math.sin(hoek);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
  if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}
const volgendeMacht = (n) => { let m = 1; while (m < n) m <<= 1; return m; };
// vermogensspectrum van een reëel signaal (rechthoekig venster), lengte n = macht van 2
function spectrum(x) {
  const n = x.length, re = Float64Array.from(x), im = new Float64Array(n);
  fft(re, im);
  const p = new Float64Array(n / 2 + 1);
  for (let k = 0; k <= n / 2; k++) p[k] = re[k] * re[k] + im[k] * im[k];
  return p;
}

return { fft, spectrum, volgendeMacht };
})();

// ---- tool/src/meten.js
const M_meten = (() => {
// meten.js — de metingen van de tool, op de echte ketenmotor (WASM). Dezelfde functies gebruiken de CI-toetsen
// (tests/dubecho.test.mjs), dus wat de tool laat zien is wat CI toetst.
const { fft, spectrum, volgendeMacht } = M_fft;
// ---- de motor (pg_*-ABI van dsp/pb_graaf_wasm.cpp) -----------------------------------------------------------------
function motorInstantie(wasmModule) {
  return new WebAssembly.Instance(wasmModule, {}).exports;
}
function laadKeten(e, rij, sr) {
  const h = e.pg_maak(sr);
  if (h < 0) throw new Error('geen vrije instantie in de motor');
  new Float64Array(e.memory.buffer, e.pg_rij(), rij.length).set(rij);
  if (!e.pg_laad(h, rij.length)) { e.pg_weg(h); throw new Error('de motor weigerde de keten (te groot of ongeldig)'); }
  return h;
}
// events: [[sample, index, waarde], …]; elk event geldt vanaf zijn sample (zoals een CLAP-event). gebeurtenissen is
// dezelfde lijst onder de naam van de instrumentkant (een toets indrukken en loslaten: Noot en Poort).
function renderKeten(e, rij, invoer, { sr = 48000, waarden = {}, blok = 128, events = [], gebeurtenissen = [] } = {}) {
  events = [...events, ...gebeurtenissen].sort((a, b) => a[0] - b[0]);
  const h = laadKeten(e, rij, sr);
  try {
    for (const [i, v] of Object.entries(waarden)) e.pg_zet(h, Number(i), v);
    const k = invoer.length, n = invoer[0].length, uit = invoer.map(() => new Float32Array(n));
    for (let pos = 0, ev = 0; pos < n;) {
      while (ev < events.length && events[ev][0] <= pos) { e.pg_zet(h, events[ev][1], events[ev][2]); ev++; }
      const grens = Math.min(n, (Math.floor(pos / blok) + 1) * blok, ev < events.length ? events[ev][0] : n);
      const m = grens - pos;
      for (let c = 0; c < k; c++) new Float32Array(e.memory.buffer, e.pg_in(h, c), m).set(invoer[c].subarray(pos, pos + m));
      e.pg_verwerk(h, k, m);
      for (let c = 0; c < k; c++) uit[c].set(new Float32Array(e.memory.buffer, e.pg_uit(h, c), m), pos);
      pos += m;
    }
    return { uit, staart: e.pg_staart(h) };
  } finally { e.pg_weg(h); }
}

// ---- aliasing: energie buiten de harmonische bins t.o.v. de grondtoon (coherent op bin k0, rechthoekig venster) ----
function aliasing(y, k0) {
  const p = spectrum(y), N = y.length;
  const harm = new Set(); for (let k = 1; k * k0 <= N / 2; k++) harm.add(k * k0);
  let rest = 0;
  for (let b = 1; b <= N / 2; b++) if (!harm.has(b)) rest += p[b];
  return 10 * Math.log10(rest / p[k0]);
}
const N_AL = 1 << 16, EXTRA = 8192;
function sinusBin(k0, amp, sr = 48000) {
  const x = new Float32Array(N_AL + 2 * EXTRA), f0 = sr * k0 / N_AL;
  for (let i = 0; i < x.length; i++) x[i] = amp * Math.sin(2 * Math.PI * f0 * i / sr);
  return x;
}
const midden = (y) => y.subarray(EXTRA, EXTRA + N_AL);

// ---- harmonischen: grondtoon 1 kHz (coherent), H1..H5 in dB t.o.v. H1, en THD ---------------------------------------
function harmonischen(y, k0) {
  const p = spectrum(y), h = [];
  for (let k = 1; k <= 5; k++) h.push(10 * Math.log10((p[k * k0] || 1e-300) / p[k0]));
  let som = 0; for (let k = 2; k * k0 <= y.length / 2; k++) som += p[k * k0];
  return { niveaus: h, thdDb: 10 * Math.log10(som / p[k0] + 1e-300) };
}

// ---- exponential sine sweep (Farina 2000) -----------------------------------------------------------------------------
function ess(y, x, f1, f2, T, sr) {
  const n = x.length, L = T / Math.log(f2 / f1);
  const inv = new Float64Array(n);
  for (let i = 0; i < n; i++) inv[i] = x[n - 1 - i] * Math.exp(-(i / sr) / L);
  const m = volgendeMacht(2 * n);
  const ar = new Float64Array(m), ai = new Float64Array(m), br = new Float64Array(m), bi = new Float64Array(m);
  ar.set(y); br.set(inv);
  fft(ar, ai); fft(br, bi);
  for (let k = 0; k < m; k++) { const r = ar[k] * br[k] - ai[k] * bi[k], i = ar[k] * bi[k] + ai[k] * br[k]; ar[k] = r; ai[k] = i; }
  fft(ar, ai, true);
  return { ir: ar, nul: n - 1, L };
}
function harmonischeNiveausESS(y, x, f1, f2, T, delay, sr) {
  const { ir, nul, L } = ess(y, x, f1, f2, T, sr);
  const uit = {};
  for (const k of [1, 2, 3, 5]) {
    const plek = Math.round(nul + delay - L * Math.log(k) * sr);
    const len = 2048, re = new Float64Array(len), im = new Float64Array(len);
    for (let i = 0; i < len; i++) re[i] = ir[plek - 256 + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (len - 1)));
    fft(re, im);
    let som = 0, nb = 0;
    for (let b = 0; b < len / 2; b++) { const f = b * sr / len / k; if (f >= 300 && f <= 3000) { som += re[b] * re[b] + im[b] * im[b]; nb++; } }
    uit[k] = 10 * Math.log10(som / nb + 1e-300);
  }
  return uit;
}

// ---- frequentierespons (klein signaal: impuls van 1e-3) op log-frequenties ------------------------------------------
function respons(e, rij, { sr = 48000, waarden = {}, punten = 96, n = 1 << 15 } = {}) {

    this.node = sp; this.motorDraait = true;
    this.node.port = { postMessage: (d) => {
      if (d.type === 'keten') {
        const nh = e.pg_maak(this.ctx.sampleRate);
        new Float64Array(e.memory.buffer, e.pg_rij(), d.rij.length).set(d.rij);
        if (e.pg_laad(nh, d.rij.length)) { for (const [i, v] of (d.waarden || []).entries()) e.pg_zet(nh, i, v); if (h >= 0) e.pg_weg(h); h = nh; }
      } else if (d.type === 'param' && h >= 0) e.pg_zet(h, d.i, d.v);
      else if (d.type === 'droog') droog = !!d.aan;
    } };
  }
  laad(rij, waarden, slot = 'A') { this.node?.port.postMessage({ type: 'keten', rij: Float64Array.from(rij), waarden, slot }); }
  zet(i, v, slot = 'A') { this.node?.port.postMessage({ type: 'param', i, v, slot }); }
  kies(slot) { this.node?.port.postMessage({ type: 'kies', slot }); }
  droog(aan) { this.node?.port.postMessage({ type: 'droog', aan }); }

  maakBuffer(naam) {
    const sr = this.ctx.sampleRate, sec = 6;
    if (naam === 'groove' && this.grooveData) {
      const g = this.grooveData, b = this.ctx.createBuffer(2, g[0].length, sr);
      b.copyToChannel(g[0], 0); b.copyToChannel(g[1] || g[0], 1);
      return b;
    }
    const maak = { stukjes: () => stukjes(sr, sec, 0.5), groove: () => stukjes(sr, sec, 0.5), ruis: () => { const x = new Float32Array(sr * sec); x.set(ruis(sr, 0.15, 0.5, 3)); x.set(ruis(sr, 0.15, 0.5, 4), sr * 3); return x; },
      sweep: () => sweep(40, 16000, sr, sec, 0.4), sinus: () => sinus(1000, sr, sec, 0.3) }[naam];
    const x = maak(), b = this.ctx.createBuffer(2, x.length, sr);
    b.copyToChannel(x, 0); b.copyToChannel(x, 1);
    return b;
  }
  async eigenBestand(bestand) {
    await this.start();
    this.buffer = await this.ctx.decodeAudioData(await bestand.arrayBuffer());
    this.bronNaam = 'eigen: ' + bestand.name;
  }
  async speel(naam) {
    await this.start();
    this.stopBron();
    if (naam === 'geen') {
      // een instrument: geen invoer, alleen een stille bron die de motor laat lopen (en "speelt" waar maakt)
      this.bron = this.ctx.createConstantSource(); this.bron.offset.value = 0;
      this.bron.connect(this.node); this.bron.start();
      return;
    }
    const buf = naam === 'eigen' && this.buffer ? this.buffer : this.maakBuffer(naam);
    this.bron = this.ctx.createBufferSource(); this.bron.buffer = buf; this.bron.loop = true;
    this.bron.connect(this.node); this.bron.start();
  }
  stopBron() { if (this.bron) { try { this.bron.stop(); } catch { /* al gestopt */ } this.bron.disconnect(); this.bron = null; } }
  speelt() { return !!this.bron; }
}

return { Speler };
})();

// ---- tool/src/verken.js
const M_verken = (() => {
// verken.js — varianten van een ontwerp (zoals "Verken" in de Stackbouwer). Deterministisch: een zaad geeft altijd
// dezelfde varianten. Wildheid: subtiel (knoppen ±15 %), flink (±40 % en soms een blok erbij of eraf), wild (alles).
const { BIB, compileer } = M_keten;
function toeval(zaad) {
  let s = zaad >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const kloon = (o) => JSON.parse(JSON.stringify(o));
const exact = (v) => Math.fround(v) === v ? v : Math.round(v * 8) / 8;   // terug naar iets dat exact in float32 past

function varianten(ontwerp, { zaad = 1, wildheid = 'subtiel', aantal = 6 } = {}) {
  const r = toeval(zaad), uit = [];
  const mate = { subtiel: 0.15, flink: 0.4, wild: 0.8 }[wildheid] ?? 0.15;
  for (let n = 0; n < aantal && uit.length < aantal * 3; n++) {
    const v = kloon(ontwerp), wat = [];
    v.naam = `${ontwerp.naam} · ${n + 1}`;
    for (const p of v.parameters) {
      const span = p.max - p.min;
      const nieuw = Math.min(p.max, Math.max(p.min, p.standaard + (r() * 2 - 1) * mate * span));
      const ex = exact(Math.round(nieuw * 1000) / 1000);
      if (Math.abs(ex - p.standaard) > span * 0.03) { wat.push(`${p.naam} ${fmt(p.standaard)} → ${fmt(ex)}`); p.standaard = ex; }
      const kn = v.knopen.find((k) => k.id === p.knoop); if (kn) kn.waarden = { ...(kn.waarden || {}), [p.knop]: p.standaard };
    }
    if (wildheid !== 'subtiel' && r() < 0.5) {
      // een blok erbij: bandbeweging op een vertraging zonder beweging, of een tweede filter in de lus
      const lijn = v.knopen.find((k) => k.type === 'vertraging');
      if (lijn && !v.kabels.some((k) => k.naar[0] === lijn.id && k.naar[1] === 'beweging')) {
        v.knopen.push({ id: 'band' + n, type: 'bandbeweging', x: lijn.x, y: lijn.y - 140, waarden: { diepte: 0.5 } });
        v.kabels.push({ van: ['band' + n, 'beweging'], naar: [lijn.id, 'beweging'] });
        wat.push('bandbeweging erbij');
      } else if (lijn && r() < 0.5) {
        const naLijn = v.kabels.find((k) => k.van[0] === lijn.id);
        if (naLijn) {
          const id = 'kleur' + n;
          v.knopen.push({ id, type: 'laagdoor1', x: lijn.x + 70, y: lijn.y + 110, waarden: { freq: exact(Math.round(2000 + r() * 6000)) } });
          v.kabels.push({ van: [id, 'uit'], naar: [...naLijn.naar] });
          naLijn.naar = [id, 'in'];
          wat.push('extra hoog-weg in de lus');
        }
      }
    }
    if (compileer(v).fouten.length === 0 && wat.length) uit.push({ ontwerp: v, wat: wat.join(', ') });
  }
  return uit.slice(0, aantal);
}
const fmt = (x) => (Math.abs(x) >= 100 ? Math.round(x) : Math.round(x * 100) / 100).toString().replace('.', ',');

return { BIB, varianten };
})();

const M_codegen = (() => {
// codegen.js — van een ontwerp naar de C++-header die de plugin bouwt (dsp/ontwerpen/keten_<id>.h).
// Puur: geeft tekst terug. Gebruikt door tools/bouwpakket.mjs (Node) en door de exportknop in de tool.
const { compileer, latentie } = M_keten;
const cstr = (s) => '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
const getal = (x) => {
  if (!Number.isFinite(x)) throw new Error(`geen eindig getal: ${x}`);
  // %.17g: elk double komt bit voor bit terug (de null-test hangt ervan af)
  const s = x.toPrecision(17).replace(/(\.\d*?)0+(e|$)/, '$1$2').replace(/\.(e|$)/, '$1');
  return Number(s) === x ? s : String(x);
};

// vier tekens uit een id, deterministisch (AU-subtype); de maker is altijd "Vrve"
function auSubtype(id) {
  const schoon = id.replace(/[^A-Za-z0-9]/g, '');
  let h = 2166136261;
  for (const c of id) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const abc = 'abcdefghijklmnopqrstuvwxyz';
  return ('P' + (schoon[0] || 'x').toUpperCase() + abc[h % 26] + abc[(h >>> 5) % 26]).slice(0, 4);
}

function ketenHeader(ontwerp, { versie = '0.1.0', maker = 'Varve' } = {}) {
  const c = compileer(ontwerp);
  if (c.fouten.length) throw new Error('het ontwerp heeft fouten: ' + c.fouten.join('; '));
  const id = ontwerp.id, au = auSubtype(id);
  const vlag = (p) => 'AUTOMATEERBAAR' + (p.glijMs > 0 ? ' | pb::GLIJDEN' : '');
  const params = c.params.map((p, i) =>
    `    {${i + 1}, ${cstr(p.naam)}, ${cstr(p.uitleg || '')}, ${cstr(p.eenheid || '')}, ${getal(p.min)}, ${getal(p.max)}, ${getal(p.standaard)}, ${getal(p.glijMs)}, pb::${vlag(p)}}`);
  const rij = [];
  for (let i = 0; i < c.rij.length; i += 9) rij.push('  ' + Array.from(c.rij.slice(i, i + 9), getal).join(', '));
  return `// keten_${id}.h — GEGENEREERD door tools/bouwpakket.mjs uit het ontwerp "${ontwerp.naam}". Niet met de hand wijzigen:
// verander het ontwerp in de tool en exporteer opnieuw. De rij hieronder is wat de ketenmotor (pb_graaf.h) leest,
// in de browser en in de plugin hetzelfde.
#pragma once
#include "../pb_core.h"

#define PB_NAAM ${cstr('PB ' + ontwerp.naam)}
#define PB_CLAP_ID ${cstr('nl.varve.pluginbouwer.' + id.replace(/_/g, '-'))}
#define PB_VERSIE ${cstr(versie)}
#define PB_MAKER ${cstr(maker)}
#define PB_UITLEG ${cstr(ontwerp.uitleg || '')}
#define PB_AU_MAKER "Vrve"
#define PB_AU_SUBTYPE ${cstr(au)}
#define PB_LATENTIE ${latentie(ontwerp)}
#define PB_N_PARAMS ${c.params.length}
#define PB_PARAMS \\
${params.join(', \\\n')}

static constexpr double PB_KETEN[] = {
${rij.join(',\n')}
};
static constexpr int PB_KETEN_N = ${c.rij.length};

#include "../graaf_ontwerp.h"
`;
}

return { auSubtype, ketenHeader };
})();

const M_bouwpakket = (() => {

// Puur: (ontwerp, metingen, bronbestanden, testsignalen) → { pad: inhoud }. Gebruikt door tools/bouwpakket.mjs en de

const fmt = (x, d = 2) => (x === undefined || x === null || Number.isNaN(x) ? '—' : (Math.abs(x) === Infinity ? (x < 0 ? '−∞' : '∞') : Number(x).toFixed(d)).replace('-', '−').replace('.', ','));

// Tekst op het paneel en in de host: dezelfde regels als de tool (app.js waardeTekst), plus % voor eenheidloos.
const nlG = (v, d) => v.toFixed(d).replace('.', ',');
function waardeTekst(v, eenheid) {
  if (eenheid === 'Hz') return v >= 1000 ? nlG(v / 1000, v >= 10000 ? 1 : 2) + ' kHz' : Math.round(v) + ' Hz';
  if (eenheid === 'ms') return v >= 100 ? Math.round(v) + ' ms' : nlG(v, 1) + ' ms';

function architectuur(ontwerp) {
  const c = compileer(ontwerp);
  return `# ARCHITECTUUR — ${ontwerp.naam}

## Lagen
\`\`\`
dsp/                 DE DSP (gegeven, niet herschrijven): pb_*.h + de keten als constante (ontwerpen/keten_${ontwerp.id}.h)
plugin/              de CLAP-schil (fase 0–2), clap-wrapper maakt VST3 en AUv2
gereedschap/         pb-render (CLAP-host), vergelijk.mjs (null-test + statistisch), ci-null.sh
testsignalen/        invoer + verwachte uitvoer (uit de WASM van de tool) + pluginval-configs
\`\`\`

## De keten
${c.orde.length} knopen, uitgevoerd in een vaste volgorde per sample (SPEC.md "Keten"). De ketenmotor
(\`dsp/pb_graaf.h\`) leest de beschrijving \`PB_KETEN\`; \`dsp/graaf_ontwerp.h\` zet die achter het Ontwerp-contract:
\`geheugenNodig\`, \`activeer\`, \`reset\`, \`zetParam\`, \`leesParam\`, \`verwerk\`, \`latentie\`, \`staartSec\`, \`PARAMS\`, \`META\`.
- \`zetParam(i, v)\` en \`leesParam(i)\` nemen de INDEX in \`PARAMS\` (0..n−1), niet het parameter-id; de schil zoekt de
  index bij het id.
- \`staartSec()\` leest de toestand van de smoothers en hoort dus bij de audiothread: reken hem aan het eind van process
  (en in activate) uit en bewaar hem atomisch; \`tail.get\` leest die waarde.

## Threads
- **Audiothread**: alleen \`process\`. Events (parameterwaarden) worden op hun sample toegepast: het blok wordt bij elk
  event gesplitst; de DSP rekent per sample, dus de uitvoer is gelijk aan die zonder splitsen.
- **Mainthread**: \`init\`, \`activate\` (hier wordt geheugen gereserveerd), state, parameters lezen en tekst.
- Geen locks, geen allocatie, geen syscalls in \`process\` (RTSan bewaakt het in CI).
- Parameteroverdracht naar het Ontwerp: alleen via CLAP-events (\`process\` en \`params.flush\`). Wat de mainthread
  moet lezen (\`params.get_value\`, \`state.save\`) komt uit een atomaire kopie per parameter die de audiothread
  bijwerkt; \`state.load\` terwijl de plugin actief is zet de waarden in die kopie plus een atomaire vlag, en
  \`process\`/\`flush\` neemt ze over vóór de events van dat blok. Verder geen gedeelde variabelen.
- \`staartSec()\` geeft −1 voor oneindig (lusversterking ≥ 1): meld dan \`INT32_MAX\` of meer (CLAP: oneindig).
- De null-test \`ci-null.sh clap\` heeft een geval \`testsignalen/automatie/\`: 720 parameter-events, ook midden in een
  blok en twee op dezelfde sample. Bit voor bit gelijk = het splitsen bij events klopt.

## State
Binair, klein en vooruit-compatibel: \`"PBST"\`, versie (u32), aantal (u32), dan per parameter (id u32, waarde f64).
Laden gaat per id: een onbekend id (van een nieuwere versie) wordt overgeslagen, een ontbrekend id houdt zijn
standaard. Parameter-id's veranderen nooit. Versie is nu 1. Laden leest de versie: andere magic, versie 0 of een
blob korter dan zijn \`aantal\` belooft = false (niets veranderd); een hogere versie laadt gewoon per id (een nieuwere
plugin mag er velden bij hebben, nooit een id een andere betekenis geven). Na een geslaagde load: \`host_params->rescan(CLAP_PARAM_RESCAN_VALUES)\`
(clap-validator eist het in state-reproducibility), en als de plugin actief is \`request_flush\`.

## Presets (fase 4)
Een preset is een state-blob plus naam, als JSON naast de plugin (\`presets/<naam>.json\` met de parameterwaarden
per naam). Fabriekspresets komen uit de varianten van de tool.

## Determinisme (waarom browser en plugin gelijk zijn)
- Geen libm in de DSP: \`pb_math.h\` (alleen + − × ÷ sqrt floor). Vlaggen \`-ffp-contract=off\`, geen \`-ffast-math\`.
- Toeval (bandbeweging) uit een geseede xorshift op gehele getallen.
- Denormals: de DSP poetst ze zelf weg; invoer wordt op de bits getest (\`pb::invoer\`).
- Smoothers springen bij de eerste sample na activate/reset: het maakt niet uit of de host parameters vóór of na
  activate zet.
`;
}

function claudeMd(ontwerp) {
  return `# CLAUDE.md — bouwpakket "${ontwerp.naam}" (${ontwerp.id})

Je bouwt een audioplugin uit dit pakket. Lees eerst SPEC.md, ARCHITECTUUR.md, TASKS.md en PROMPTS.md.
Nederlands in docs, commits en comments; code-identifiers Engels. De gebruiker (Clay) programmeert geen C++ en test in
Logic Pro (MacBook Air M1). Wat hij zelf moet doen staat in LEERPAD.md.

## Wat vaststaat (niet veranderen)
- **De DSP in \`dsp/\` is gegeven.** Herschrijf hem niet, "verbeter" hem niet, kopieer hem niet naar een andere vorm.
  De plugin moet bit voor bit klinken als de WASM van de tool; de verwachte uitvoer in \`testsignalen/\` komt daaruit.
- Compileer \`dsp/\` met \`-ffp-contract=off -fno-fast-math -fno-math-errno\` (ook op macOS met Apple clang).
- Stack: CLAP-first (\`clap/clap.h\`), en **clap-wrapper v0.16.0** (MIT) via CMake \`make_clapfirst_plugins\` voor VST3 en
  AUv2 (\`CLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=ON\`). AU-codes: maker \`Vrve\`, subtype \`${auSubtype(ontwerp.id)}\` (staan ook als
  #define in \`dsp/ontwerpen/keten_${ontwerp.id}.h\`).
- Geen betaalde diensten of licenties. Ad-hoc signeren (\`codesign --sign -\`) is genoeg voor Clay's eigen Mac.

## Bekende valkuilen (al eens misgegaan; zo los je ze op)
1. **AU-parameters vóór Initialize bereiken de CLAP niet** (clap-wrapper v0.16.0, \`wrapasauv2.cpp\` SetParameter).
   pluginval zet de state vóór prepareToPlay; de AU-null-test faalt dan met "gelijk aan de standaardwaarden".
   Oplossing: \`patches/clap-wrapper-auv2-params-voor-init.patch\` via \`PATCH_COMMAND\` in FetchContent.
2. **Linux-VST3 crasht na "SUCCESS" in pluginval**: statics in de VST3 SDK draaien bij exit in uitgeladen geheugen.
   Oplossing: \`target_link_options(<vst3-target> PRIVATE -Wl,-z,nodelete)\` op Linux.
3. **macOS: CMAKE_OBJCXX_COMPILE_OBJECT ontbreekt** → \`enable_language(OBJC)\` en \`enable_language(OBJCXX)\` in jouw project.
4. **RTSan vangt niets**: markeer de functie die process aanroept \`[[clang::nonblocking]]\` (achter de parameterlijst) én
   \`noinline\`, en maak een kanarie (malloc in process, pointer naar een globale variabele) die MOET falen.
5. **auval vindt de AU niet**: kopieer naar \`~/Library/Audio/Plug-Ins/Components\`, dan \`killall -9 AudioComponentRegistrar\`.
6. **Denormale invoer**: de DSP regelt het zelf; zet geen eigen FTZ-truc ervoor.
7. **pluginval \`--rtcheck\` op macOS vangt calloc in clap-wrapper** (\`_tlv_get_addr\` ← \`AlwaysAudioThread\` ←
   \`WrapAsAUV2::Render\`): twee \`thread_local\`-tellers die dyld per thread lui aanmaakt. Oplossing:
   \`patches/clap-wrapper-geen-thread-local-in-process.patch\`. Alle patches gaan erop met
   \`PATCH_COMMAND sh <pakket>/gereedschap/pas-patches-toe.sh <pakket>/patches\` (in naamvolgorde, overgeslagen als hij er
   al op zit, anders faalt een tweede configure; een \`;\` direct in PATCH_COMMAND splitst CMake in losse argumenten).
8. **clap-validator kleurt zijn uitvoer altijd** (ook met NO_COLOR): haal de ANSI-codes weg vóór je op "0 failed" grept,
   of vertrouw op de exitcode.
9. **pluginval v2**: \`pluginval validate …\` (de vlag \`--validate\` is verouderd); de null-test gebruikt \`pluginval test\`.
10. **De AU meldt geen TailTime** (auval: "Tail Time: Recommended Property is not supported"): clap-wrapper v0.16.0 geeft
   \`SupportsTail()\` vast false. Logic hoort de staart dan nooit (bounce met staart). Oplossing:
   \`patches/clap-wrapper-auv2-tailtime.patch\`.
11. **Draden**: zolang de plugin actief is, raakt alleen de audiothread het Ontwerp aan. \`params.get_value\` en
   \`state.save\` lezen een atomaire kopie; \`state.load\` zet waarden klaar die process of flush overneemt;
   \`tail.get\` leest een staart die process uitrekende (\`staartSec()\` leest de smoothers).
12. **CLAP-headers** komen van clap-wrapper (\`CLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=ON\` haalt CLAP 1.2.x op; doel \`clap\`);
   het pakket heeft ze niet zelf.
13. **pluginval AU "Parameter thread safety" crasht af en toe in process** (\`VALIDATION CRASHED\`, process ←
   \`ProcessAdapter::process\` ← \`WrapAsAUV2::Render\`): clap-wrapper v0.16.0 zet in \`addParameterEvent\` events in
   dezelfde vectors die process op de audiothread sorteert en wist, zonder lock, vanaf de thread van SetParameter.
   Oplossing: \`patches/clap-wrapper-auv2-setparameter-draadveilig.patch\` (gevonden door een vers gesprek, proef F1).
   Draai pluginval op de AU met \`--repeat 3\`: de race sloeg één op de drie runs toe.
14. **"Knoppen via de host" bij CLAP**: een CLAP-host stuurt een uitvoerevent van de plugin niet terug. Het paneel zet
   een verandering als BEGIN/WAARDE/EIND in een lock-vrije rij en vraagt \`request_flush\`; process of \`params.flush\`
   pusht ze als \`CLAP_EVENT_PARAM_GESTURE_BEGIN\`/\`PARAM_VALUE\`/\`GESTURE_END\` naar de host én past de waarde zelf
   toe, zoals een event van de host. Het paneel raakt het Ontwerp nooit. Onder AUv2 doet \`request_flush\` niets
   (clap-wrapper v0.16.0): de host hoort de verandering pas bij de volgende Render.

## Hoe je weet dat het klopt
De poorten in PROMPTS.md. Een poort is groen als CI groen is, niet als jij denkt dat het goed is. Loopt iets vast:
beschrijf wat je zag en wat je probeerde in \`VERSLAG.md\`; zet een toets nooit uit om groen te worden.
`;
}

// De mockup als SVG: één rij knoppen op hun standaard, maten en kleuren uit design.md.
function frontpaneelSvg(ontwerp) {
  const c = compileer(ontwerp);
  const n = c.params.length, kol = 76, mx = 24, B = Math.max(560, mx * 2 + n * kol), H = 220;
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const pt = (r, a) => [r * Math.sin(a), -r * Math.cos(a)].map((x) => x.toFixed(2));
  const boog = (r, a0, a1) => { const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`; };
  const knoppen = c.params.map((q, i) => {
    const t = (q.standaard - q.min) / (q.max - q.min), a0 = -0.75 * Math.PI, a = a0 + t * 1.5 * Math.PI;
    const [kx, ky] = pt(14, a), x = mx + kol * i + kol / 2;
    return `  <g transform="translate(${x} 130)"><title>${esc(q.naam)}</title>
    <text y="-34" class="l">${esc(kortLabel(ontwerp.parameters[i]))}</text>
    <path d="${boog(22, a0, 0.75 * Math.PI)}" class="spoor0"/><path d="${boog(22, a0, a)}" class="spoor"/>
    <circle r="16" class="knop"/><line x1="0" y1="0" x2="${kx}" y2="${ky}" class="wijzer"/>
    <text y="44" class="w">${esc(waardeTekst(q.standaard, q.eenheid || ''))}</text></g>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${B}" height="${H}" viewBox="0 0 ${B} ${H}">
  <style>text{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#e7e5dd;text-anchor:middle;font-variant-numeric:tabular-nums}
  .n{font-family:Silkscreen,monospace;font-size:14px;fill:#232629;text-anchor:start}.w{fill:#e7e5dd}
  .knop{fill:#232629;stroke:#e7e5dd;stroke-width:2}.wijzer{stroke:#e7e5dd;stroke-width:2}
  .spoor0{fill:none;stroke:#3a3e42;stroke-width:3}.spoor{fill:none;stroke:#40cbda;stroke-width:3}<\/style>
  <rect x="3" y="3" width="${B - 6}" height="${H - 6}" fill="#0d0e0f"/>
  <rect x="0" y="0" width="${B - 6}" height="${H - 6}" fill="#232629" stroke="#e7e5dd" stroke-width="2"/>
  <rect x="${mx}" y="18" width="${12 + 9 * (3 + ontwerp.naam.length)}" height="24" fill="#f2c200"/>
  <text x="${mx + 6}" y="35" class="n">PB ${esc(ontwerp.naam.toUpperCase())}</text>
${knoppen.join('\n')}
</svg>
`;
}

// Alle bestanden van het pakket. bronnen = { 'dsp/pb_math.h': tekst, … } (de tool bakt ze in, Node leest ze);

const slug = (t) => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function presetBestanden(ontwerp) {
  const uit = {};
  for (const p of ontwerp.presets || []) uit[`presets/${slug(p.naam)}.json`] = JSON.stringify(p, null, 2) + '\n';
  return uit;
}
function bouwpakket(ontwerp, { metingen = {}, metingBlokken = null, bronnen = {}, testsignalen = {}, extra = {}, uitslagen = {} } = {}) {
  const c = compileer(ontwerp);
  if (c.fouten.length) throw new Error('het ontwerp heeft fouten: ' + c.fouten.join('; '));
  const pak = {
    'SPEC.md': spec(ontwerp, { metingen, metingBlokken }),
    'ARCHITECTUUR.md': architectuur(ontwerp),
    'CLAUDE.md': claudeMd(ontwerp),
    'TASKS.md': tasksMd(ontwerp),
    'PROMPTS.md': promptsMd(ontwerp, { uitslagen }),

// ---- tool/src/testsignalen.js
const M_testsignalen = (() => {
// testsignalen.js — de toetsgevallen van een ontwerp (invoer + genormaliseerde parameters) en WAV-bytes.
// Eén bron voor tools/null.mjs (Node) en de exportknop van de tool (browser): dezelfde invoer, dezelfde verwachting.
const { sinus, ruis, sweep, stukjes, impuls, stereo } = M_signalen;
const lang = (x, sec, sr) => { const y = new Float32Array(Math.round(sec * sr)); y.set(x.subarray(0, Math.min(x.length, y.length))); return y; };
const MAKERS = {
  stukjes: (sr, sec) => stereo(lang(stukjes(sr, Math.min(sec, 2)), sec, sr)),
  'stukjes-kort': (sr, sec) => stereo(lang(stukjes(sr, 1), sec, sr)),
  'ruis-stukjes': (sr, sec) => stereo(lang(ruis(sr, 0.3, 0.5, 11), sec, sr), lang(stukjes(sr, 2), sec, sr)),
  ruis: (sr, sec) => stereo(ruis(sr, sec, 0.3, 1), ruis(sr, sec, 0.3, 2)),
  sweep: (sr, sec) => stereo(lang(sweep(30, Math.min(18000, 0.45 * sr), sr, Math.min(3, sec), 0.4), sec, sr)),
  'sweep-vol': (sr, sec) => stereo(sweep(20, 20000, sr, sec, 0.5)),
  sinus: (sr, sec) => stereo(sinus(997, sr, sec, 0.7)),
  impuls: (sr) => stereo(impuls(sr)),
};

// Een toetsgeval als data: { naam, signaal, sec, sr, norm: [n per parameter], statistisch? }
function maakInvoer(g) { return MAKERS[g.signaal](g.sr, g.sec); }

// Standaardgevallen voor elk ontwerp zonder eigen lijst. Waarden n·(max−min)+min met n in achtsten: exact in float32.
// Heeft het ontwerp een terugkoppeling, dan komt er een geval "hoog" bij dat statistisch beoordeeld wordt
// (een lus kan dan zelf oscilleren: chaotisch, 1 ULP groeit).
function toetsgevallen(ontwerp, nParams, { terugkoppeling = false } = {}) {
  if (ontwerp?.toetsgevallen) return ontwerp.toetsgevallen;
  const alle = (n) => Array(nParams).fill(n);
  const lijst = [
    { naam: 'ruis-half', signaal: 'ruis', sec: 2, sr: 48000, norm: alle(0.5) },
    { naam: 'sweep-kwart', signaal: 'sweep-vol', sec: 3, sr: 48000, norm: alle(0.25) },
    { naam: 'stukjes-laag', signaal: 'stukjes', sec: 2.5, sr: 48000, norm: Array.from({ length: nParams }, (_, i) => (i === 0 ? 0.0625 : 0.75)) },
    { naam: 'sinus-441', signaal: 'sinus', sec: 1, sr: 44100, norm: alle(0.5) },
    { naam: 'impuls-96k', signaal: 'impuls', sec: 1, sr: 96000, norm: alle(0.25) },
  ];
  if (terugkoppeling) lijst.push({ naam: 'hoog', signaal: 'stukjes-kort', sec: 8, sr: 48000, norm: alle(0.875), statistisch: true });
  return lijst;
}

// Automatisering op willekeurige samples (ook midden in een blok, en twee events op dezelfde sample): elke parameter
// beweegt tussen 1/8 en 6/8 van zijn bereik (exact in float32). Ids in events.txt zijn index + 1, zoals pbRender.
function automatieGeval(params) {
  const sr = 48000, sec = 4, invoer = MAKERS['ruis-stukjes'](sr, sec), n = sr * sec, events = [];
  for (let k = 0; ; k++) {
    const sample = Math.floor(k * 293.37);
    if (sample >= n) break;
    const zet = (j) => { const i = j % params.length, nn = 0.125 + ((j * 3) % 6) * 0.125; events.push([sample, i, params[i].min + nn * (params[i].max - params[i].min)]); };
    zet(k);
    if (k % 10 === 9) zet(k + 3);   // een tweede event op dezelfde sample
  }
  const tekst = events.map(([t, i, v]) => `${t} ${i + 1} ${v}`).join('\n') + '\n';
  return { naam: 'automatie', sr, invoer, events, tekst };
}

function wavBytes(kanalen, sr) {
  const n = kanalen[0].length, k = kanalen.length, data = n * k * 4;
  const b = new ArrayBuffer(44 + data), v = new DataView(b);
  const s = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  s(0, 'RIFF'); v.setUint32(4, 36 + data, true); s(8, 'WAVE'); s(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 3, true); v.setUint16(22, k, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * k * 4, true); v.setUint16(32, k * 4, true); v.setUint16(34, 32, true);
  s(36, 'data'); v.setUint32(40, data, true);
  for (let i = 0; i < n; i++) for (let c = 0; c < k; c++) v.setFloat32(44 + (i * k + c) * 4, kanalen[c][i], true);
  return new Uint8Array(b);
}

// pluginval-config voor één geval (docs/Acceptance testing.md van pluginval); de referentie is de WASM-render
function pluginvalConfig(g, paramNamen, grensDb = -90) {
  return {
    name: g.naam, input: { audio: `../${g.naam}.in.wav` }, reference: `../${g.naam}.verwacht.wav`,
    state: { parameters: Object.fromEntries(paramNamen.map((naam, i) => [naam, g.norm[i]])) },
    sample_rate: g.sr, block_size: 512, comparison: { sample: Number(Math.pow(10, grensDb / 20).toPrecision(6)) },
  };
}

// Alle testsignaalbestanden van een ontwerp, gerekend op de ketenmotor (e = pg_*-exports, rij = compileer().rij).
// Zelfde vorm als tools/null.mjs "maak" schrijft (tests/pakket.test.mjs vergelijkt ze byte voor byte).
function maakTestsignalen(e, rij, params, ontwerp, { terugkoppeling = false, render } = {}) {
  const enc = (o) => JSON.stringify(o, null, 2) + '\n';
  const bestanden = {}, index = [];
  for (const g of toetsgevallen(ontwerp, params.length, { terugkoppeling })) {
    const invoer = maakInvoer(g);
    const waarden = Object.fromEntries(g.norm.map((n, i) => [i, params[i].min + n * (params[i].max - params[i].min)]));
    const uit = render(e, rij, invoer, { sr: g.sr, waarden, blok: 128 }).uit;
    bestanden[`testsignalen/${g.naam}.in.wav`] = wavBytes(invoer, g.sr);
    bestanden[`testsignalen/${g.naam}.verwacht.wav`] = wavBytes(uit, g.sr);
    const norm = Object.fromEntries(g.norm.map((n, i) => [i, n]));
    index.push({ naam: g.naam, sr: g.sr, norm, waarden, pbRender: params.map((p, i) => `${i + 1}=${waarden[i]}`), statistisch: !!g.statistisch });
    bestanden[`testsignalen/pluginval/${g.naam}.json`] = enc(pluginvalConfig(g, params.map((p) => p.naam)));
  }
  bestanden['testsignalen/gevallen.json'] = enc(index);
  const a = automatieGeval(params);
  bestanden['testsignalen/automatie/in.wav'] = wavBytes(a.invoer, a.sr);
  bestanden['testsignalen/automatie/events.txt'] = a.tekst;
  bestanden['testsignalen/automatie/verwacht.wav'] = wavBytes(render(e, rij, a.invoer, { sr: a.sr, blok: 128, events: a.events }).uit, a.sr);
  return bestanden;
}

return { automatieGeval, maakInvoer, maakTestsignalen, pluginvalConfig, toetsgevallen, wavBytes };
})();

// ---- tool/src/zip.js
const M_zip = (() => {
// zip.js — een ZIP zonder compressie (store), voor de export van het bouwpakket in de browser. Eigen code, geen
// afhankelijkheden. Bestanden: { pad: string | Uint8Array }.
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

function zip(bestanden, map = '') {
  const enc = new TextEncoder(), delen = [], centraal = [];
  let offset = 0;
  for (const [pad0, inhoud] of Object.entries(bestanden)) {
    const pad = enc.encode((map ? map + '/' : '') + pad0);
    const data = typeof inhoud === 'string' ? enc.encode(inhoud) : inhoud;
    const crc = crc32(data);
    const kop = new DataView(new ArrayBuffer(30));
    kop.setUint32(0, 0x04034b50, true); kop.setUint16(4, 20, true); kop.setUint16(6, 0x0800, true); kop.setUint16(8, 0, true);
    kop.setUint16(10, 0, true); kop.setUint16(12, 0x21, true); kop.setUint32(14, crc, true);
    kop.setUint32(18, data.length, true); kop.setUint32(22, data.length, true); kop.setUint16(26, pad.length, true); kop.setUint16(28, 0, true);
    delen.push(new Uint8Array(kop.buffer), pad, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, pad.length, true);
    c.setUint32(38, pad0.endsWith('.sh') ? (0o100755 << 16) >>> 0 : (0o100644 << 16) >>> 0, true); c.setUint32(42, offset, true);
    centraal.push(new Uint8Array(c.buffer), pad);
    offset += 30 + pad.length + data.length;
  }
  const grootte = centraal.reduce((s, d) => s + d.length, 0);
  const eind = new DataView(new ArrayBuffer(22));
  eind.setUint32(0, 0x06054b50, true); eind.setUint16(8, centraal.length / 2, true); eind.setUint16(10, centraal.length / 2, true);
  eind.setUint32(12, grootte, true); eind.setUint32(16, offset, true);
  const alles = [...delen, ...centraal, new Uint8Array(eind.buffer)];
  const uit = new Uint8Array(alles.reduce((s, d) => s + d.length, 0));
  let p = 0; for (const d of alles) { uit.set(d, p); p += d.length; }
  return uit;
}

return { zip };
})();

// ABX: A = dit ontwerp, B = een schetsboek-ontwerp of "droog" (of een eigen referentiebestand als bron). X is A of B.
function tabAbx(box) {

          const keuze = $('#abxB').value; await speler.speel(S.bron); speler.laad(C.rij, C.params.map((p) => p.standaard), 'A');
          if (keuze !== 'droog') { const c = compileer(S.schetsboek[+keuze].ontwerp); speler.laad(c.rij, c.params.map((p) => p.standaard), 'B'); }

  const goed = a.pogingen.filter((p) => p.goed).length, n = a.pogingen.length;
  let p = 0; for (let k = goed; k <= n; k++) p += binom(n, k) * Math.pow(0.5, n);
  box.append(el('div', { class: 'rij' }, ...['A', 'B', 'X'].map((w) => el('button', { class: 'knopgroot', onclick: () => hoor(w) }, 'hoor ' + w)),

function binom(n, k) { let r = 1; for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i; return r; }
function bewaarAbx() { const log = opslag.lees('abx', []); log.push({ wanneer: new Date().toISOString(), ontwerp: S.ontwerp.naam, b: S.abx.b, pogingen: S.abx.pogingen }); opslag.schrijf('abx', log.slice(-50)); }

// Taaktoets: "maak vanaf leeg een dub-echo die zelf oscilleert" — tijd tot eerste geluid, waar vastgelopen, klaar.
const TAAK = 'Maak vanaf leeg een dub-echo die zelf oscilleert (blijft doorgaan als je stopt met spelen).';
function taakLog(soort, wat = '') {
  const t = S.taak; if (!t?.bezig) return;
  const nu = Date.now();
  if (soort === 'geluid') { if (!t.eersteGeluid && t.afgespeeld) { t.eersteGeluid = nu - t.start; t.log.push([t.eersteGeluid, 'eerste geluid']); opslag.schrijf('taak', t); } return; }
  if (soort === 'afspelen') t.afgespeeld = true;
  if (t.laatste && nu - t.laatste > 30000) t.log.push([nu - t.start, `${Math.round((nu - t.laatste) / 1000)} s niets gedaan (vastgelopen?)`]);
  t.laatste = nu; t.log.push([nu - t.start, soort + (wat ? ': ' + wat : '')]);
  opslag.schrijf('taak', t);
}
function controleerTaak() {
  const t = S.taak; if (!t?.bezig || C.fouten.length) return;
  // klaar = na een korte toon zonder invoer klinkt er na 3 s nog iets boven −40 dBFS (de lus houdt zichzelf in stand)
  const x = new Float32Array(48000 * 4); for (let i = 0; i < 4800; i++) x[i] = 0.5 * Math.sin(2 * Math.PI * 440 * i / 48000);
  const y = renderKeten(E, C.rij, [x], { waarden: Object.fromEntries(C.params.map((p, i) => [i, p.standaard])) }).uit[0];
  let e = 0; for (let i = 48000 * 3; i < y.length; i++) e += y[i] * y[i];
  const rms = 10 * Math.log10(e / 48000 + 1e-30);
  if (rms > -40) { t.bezig = false; t.klaar = Date.now() - t.start; t.log.push([t.klaar, `klaar: zelfoscillatie (${nl(rms, 0)} dBFS na 3 s)`]); opslag.schrijf('taak', t); melding('Taak gehaald in ' + Math.round(t.klaar / 1000) + ' s'); if (S.tab === 'taak') tekenOnder(); }
}

    t ? el('div', {}, el('p', {}, t.bezig ? 'bezig…' : (t.klaar ? `gehaald in ${Math.round(t.klaar / 1000)} s` : 'gestopt'),
      ` · eerste geluid: ${t.eersteGeluid ? Math.round(t.eersteGeluid / 1000) + ' s' : 'nog niet'}`),
    el('pre', { class: 'log' }, t.log.slice(-14).map(([ms, w]) => `${String(Math.round(ms / 1000)).padStart(4)} s  ${w}`).join('\n'))) : null,
    el('p', { class: 'zacht' }, 'De log blijft in deze browser. Geen oordeel achteraf: hij meet wat je deed.'));
}
// Bewaren: als artifact via de downloads-capability van claude.ai (een gewone downloadlink doet daar niets), als losse
// pagina met een gewone link.
async function download(blob, naam) {
  const d = globalThis.claude?.use ? await globalThis.claude.use('downloads').catch(() => null) : null;
  if (d) {
    try { await d.save({ filename: naam, data: blob }); melding('bewaard: ' + naam); }
    catch (f) { if (f?.code !== 'declined') melding('bewaren lukte niet (' + (f?.code || f) + '); de losse pagina kan het wel'); }
    return;
  }
  const a = el('a', { href: URL.createObjectURL(blob), download: naam }); document.body.append(a); a.click(); a.remove();
}
