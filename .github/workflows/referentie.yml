# referentie.yml — vergelijking met echte bandopnames (Aalto Magnetic Tape Recorder Dataset, CC-BY-4.0,
# Mikkonen e.a., DAFx 2023; Zenodo 8026272). Handmatig: de dataset is groot en verandert niet.
# Stap "catalogus" zet lijst + steekproef op tak referentie/steekproef; "meet" draait ref/referentie/meet.sh.
name: referentie
on:
  workflow_dispatch:
    inputs:
      stap:
        description: 'catalogus of meet'
        default: catalogus
permissions:
  contents: write
jobs:
  referentie:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Catalogus van de dataset (bestanden, groottes, nieuwste versie)
        run: |
          for id in 8026272; do
            curl -fsSL --retry 3 "https://zenodo.org/api/records/$id" -o rec.json
            python3 - <<'PY'
          import json
          d = json.load(open('rec.json'))
          m = d.get('metadata', {})
          print('TITEL', m.get('title'), '| VERSIE', m.get('version'), '| LICENTIE', m.get('license'))
          print('NIEUWSTE', d.get('links', {}).get('latest'))
          for f in d.get('files', []):
              print('BESTAND', f['key'], round(f['size'] / 1e6, 1), 'MB', f['links']['self'])
          PY
            latest=$(python3 -c "import json;print(json.load(open('rec.json'))['links'].get('latest',''))")
            [ -n "$latest" ] && curl -fsSL --retry 3 "$latest" | python3 -c "import json,sys; d=json.load(sys.stdin); print('NIEUWSTE-ID', d.get('id'), d['metadata'].get('version')); [print('NIEUW-BESTAND', f['key'], round(f['size']/1e6,1), 'MB', f['links']['self']) for f in d.get('files',[])]" || true
          done
      - name: Akai-archief downloaden naar /mnt (hervat bij een verbroken verbinding; Zenodo knipt na ~30 min)
        run: |
          df -h / /mnt | tail -2
          sudo mkdir -p /mnt/ref && sudo chown "$USER" /mnt/ref
          URL="https://zenodo.org/api/records/8085482/files/neural-tape-audio_AKAI.tar/content"
          for poging in 1 2 3 4 5 6 7 8; do
            curl -fsSL -C - --retry 3 -o /mnt/ref/akai.tar.gz "$URL" && break
            echo "poging $poging afgebroken bij $(du -h /mnt/ref/akai.tar.gz | cut -f1), hervatten"; sleep 5
          done
          ls -l /mnt/ref/akai.tar.gz
          gzip -t /mnt/ref/akai.tar.gz && echo "archief compleet"
      - name: Lijst en steekproef (één keer door het archief, gestreamd)
        run: |
          python3 -I ref/referentie/steekproef.py /mnt/ref/akai.tar.gz /mnt/ref/steekproef
          du -sh /mnt/ref/steekproef
      - name: Steekproef naar tak referentie/steekproef (CC-BY-4.0, met bronvermelding)
        if: inputs.stap == 'catalogus'
        run: |
          cd /mnt/ref/steekproef
          cat > LEESMIJ.md <<'EOF'
          # Steekproef uit het Akai-archief
          Aalto Magnetic Tape Recorder Dataset (Mikkonen, Wright, Välimäki, DAFx 2023), Zenodo 8085482, CC-BY-4.0.
          Gemaakt door .github/workflows/referentie.yml (ref/referentie/steekproef.py): lijst van alle bestanden,
          kleine bestanden heel, hooguit 2 WAV's per map ingekort tot 10 s. Alleen om de meting op te bouwen.
          EOF
          sed -i 's/^          //' LEESMIJ.md
          git init -q -b referentie/steekproef
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Steekproef Akai-archief (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" referentie/steekproef
      - name: Meten tegen de echte band
        if: inputs.stap == 'meet'
        env: { ARCHIEF: /mnt/ref/akai.tar.gz }
        run: sh ref/referentie/meet.sh
      - uses: actions/upload-artifact@v4
        if: inputs.stap == 'meet'
        with:
          name: referentie
          path: ref/referentie/uit/
