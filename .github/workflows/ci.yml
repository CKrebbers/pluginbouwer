# CI van PB Toetsenpad — het log is het bewijs (SPEC.md "Validators"; PROMPTS.md fase 0).
#   linux:  bouwen met clang, clap-validator 0.4.1 (uit de bron; de state- en param-toetsen moeten PASSED zijn),
#           pluginval strictness 10 op de VST3 onder xvfb, null-test door het .clap (ci-null.sh clap) en door de VST3
#           (ci-null.sh pluginval), state- en teksttoets (pb-statetoets, fase 2), paneelmodel (pb-paneeltoets, fase 3)
#   rtsan:  pb-render met -fsanitize=realtime (clang 20) door het .clap; een kanarie-bouw die MOET falen
#   macos:  arm64, ad-hoc gesigneerd, geïnstalleerd, auval -strict, pluginval 10 --rtcheck op AU en VST3, artefact,
#           null-test door het .clap, de VST3 en de AU, state- en teksttoets (pb-statetoets), het paneel (fase 3):
#           pluginval zonder --skip-gui-tests (de editortoetsen moeten echt een editor openen), pb-paneeltoets, en
#           pb-paneel door het gesigneerde .clap met schermafbeeldingen als artefact macos-frontpaneel
#   fase 4: de fabriekspresets uit presets/: de drie preset-toetsen van clap-validator moeten PASSED zijn,
#           pb-presettoets door het .clap (Linux en macOS), en elke presetnaam staat in de uitvoer van auval -strict -v
#   fase 5: stereo en mono (audio-ports-config, configurable-audio-ports, AU-kanaalindelingen), bypass, 44,1–192 kHz,
#           blok 1..4096: de verwachting per samplerate komt uit wasm/graaf.wasm (wasm-render.mjs, dat eerst
#           testsignalen/ bit voor bit nadoet); null-test-matrix door het .clap (pb-render), de AU (pb-au-render, eigen
#           AU-host) en de VST3/AU (pluginval test); pluginval validate op alle samplerates en blokgroottes; de
#           layout-toetsen van clap-validator moeten PASSED zijn; auval toont de kanaalindelingen [0, 1] en [0, 2]
#   fase 6: het installatiepakket (gereedschap/maak-pkg.sh, artefact macos-pkg); job installatie: op een verse runner
#           die niets bouwt twee keer installeren (install, dan upgrade), plek en handtekening, auval -strict
# Bewijsstappen staan achteraan in elke job: de GitHub-tools geven alleen de laatste 5000 logregels (valkuil 18).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSIE: v2.0.0-beta3
  CLAP_VALIDATOR_VERSIE: 0.4.1
  # fase 5: de samplerates en blokgroottes van de matrix
  SAMPLERATES: 44100,48000,88200,96000,176400,192000
  PV_BLOKKEN: 1,64,512,4096

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang xvfb libasound2-dev libfreetype-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libgl1 libcurl4t64

      - name: clap-validator uit de cache
        id: cv-cache
        uses: actions/cache@v4
        with:
          path: ~/clap-validator
          key: clap-validator-${{ env.CLAP_VALIDATOR_VERSIE }}-ubuntu-24.04

      - name: clap-validator bouwen (cargo, uit de bron)
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSIE" --locked \
            --root ~/clap-validator

      - name: pluginval
        run: |
          mkdir -p ~/pluginval && cd ~/pluginval
          curl -sSfL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_Linux.zip"
          unzip -o -q pv.zip && chmod +x pluginval

      - name: Bouwen (clang)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ls -la build/plugins build/pb-render

      - name: pb-render door het .clap (rookproef)
        run: |
          mkdir -p uit
          build/pb-render "build/plugins/PB Toetsenpad.clap" testsignalen/noten/in.wav uit/noten.wav --blok 512 \
            --noten testsignalen/noten/noten.txt

      - name: clap-validator
        run: |
          set +e
          ~/clap-validator/bin/clap-validator validate "build/plugins/PB Toetsenpad.clap" > cv.log 2>&1
          status=$?
          set -e
          # valkuil 8: de uitvoer is altijd gekleurd; eerst de ANSI-codes weg
          sed 's/\x1b\[[0-9;]*m//g' cv.log > cv.txt
          cat cv.txt
          echo "clap-validator exit: $status"
          test "$status" -eq 0
          grep -E "tests run, [0-9]+ passed, 0 failed" cv.txt
          # fase 2, 4 en 5: de state-, parameter-, preset- en layouttoetsen moeten echt draaien (PASSED; SKIPPED telt niet)
          awk '/┌─ [a-z]/{t=$NF} /└── /{print t, $3}' cv.txt > cv-status.txt
          for t in state-invalid-empty state-invalid-random state-reproducibility-basic state-reproducibility-binary \
                   state-reproducibility-buffered param-conversions param-default-values param-set-events \
                   param-set-no-cookies param-set-wrong-namespace param-fuzz-basic param-fuzz-bounds \
                   param-fuzz-sample-accurate param-fuzz-modulation \
                   preset-discovery-crawl preset-discovery-descriptor-consistency preset-discovery-load \
                   layout-audio-ports-config layout-configurable-audio-ports process-varying-sample-rates \
                   process-varying-block-sizes process-random-block-sizes; do
            grep -qx "$t PASSED" cv-status.txt || { echo "FOUT: clap-validator $t is niet PASSED"; exit 1; }
            echo "clap-validator $t: PASSED"
          done

      - name: pluginval strictness 10 (VST3, xvfb; alle samplerates en blokgroottes 1..4096)
        run: |
          set -o pipefail
          # valkuil 18: het pluginpad vóór de andere opties
          xvfb-run -a ~/pluginval/pluginval validate "build/plugins/PB Toetsenpad.vst3" --strictness-level 10 \
            --sample-rates "$SAMPLERATES" --block-sizes "$PV_BLOKKEN" --timeout-ms 1200000 2>&1 | tee pv-vst3.log
          grep -q "^SUCCESS" pv-vst3.log
          sh gereedschap/pluginval-matrix-bewijs.sh pv-vst3.log

      - name: Null-test VST3 (pluginval test, blok 512)
        run: |
          sh gereedschap/ci-null.sh pluginval "$PWD/build/plugins/PB Toetsenpad.vst3" "xvfb-run -a $HOME/pluginval/pluginval" \
            vst3-linux

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje, automatisering, noten CLAP en MIDI)
        run: sh gereedschap/ci-null.sh clap build

      - name: State- en teksttoets (pb-statetoets door het .clap; fase 2)
        run: build/pb-statetoets "build/plugins/PB Toetsenpad.clap"

      - name: Paneelmodel met de echte rij (pb-paneeltoets; fase 3)
        run: |
          mkdir -p paneel-svg
          build/pb-paneeltoets frontpaneel.svg paneel-svg

      - name: Fabriekspresets door het .clap (pb-presettoets; fase 4)
        run: |
          python3 gereedschap/presets-lijst.py presets > presets.txt
          cat presets.txt
          build/pb-presettoets "build/plugins/PB Toetsenpad.clap" presets.txt

      - name: Verwachting per samplerate uit wasm/graaf.wasm (eerst testsignalen/ bit voor bit na; fase 5)
        run: sh gereedschap/ci-null.sh verwacht build "$SAMPLERATES"

      - name: Null-test VST3 per samplerate (pluginval test, gevallen en noten als MIDI; fase 5)
        run: |
          sh gereedschap/ci-null.sh pluginval-matrix "$PWD/build/plugins/PB Toetsenpad.vst3" \
            "xvfb-run -a $HOME/pluginval/pluginval" vst3-linux

      - name: Null-test CLAP-matrix (pb-render; alle samplerates, stereo en mono, blok 1, 4096 en wisselend; fase 5)
        run: sh gereedschap/ci-null.sh matrix build 1 4096 1,4096,7,512,333

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-paneel-svg
          path: paneel-svg/
          if-no-files-found: ignore

  rtsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: clang 20 (apt.llvm.org)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y libclang-rt-20-dev
          clang++-20 --version

      - name: Bouwen met RTSan (pb-render -fsanitize=realtime)
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -S plugin -B build-rtsan -G Ninja -DCMAKE_BUILD_TYPE=Release -DPB_RTSAN=ON
          cmake --build build-rtsan --target toetsenpad_clap pb-render

      - name: Kanarie bouwen (malloc in process)
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -S plugin -B build-kanarie -G Ninja -DCMAKE_BUILD_TYPE=Release -DPB_RTSAN=ON -DPB_KANARIE=ON
          cmake --build build-kanarie --target toetsenpad_clap pb-render

      - name: RTSan schoon (blok 1, 512 en wisselend; noten CLAP en MIDI, automatisering, sinus, state-rondje, bypass, mono, 44,1 en 192 kHz)
        run: |
          set -e
          R=build-rtsan/pb-render; C="build-rtsan/plugins/PB Toetsenpad.clap"; T=testsignalen; mkdir -p uit/rtsan
          # fase 5: bypass aan en uit (ook midden in een blok), mono via beide extensies, 44,1 en 192 kHz, blok 1
          printf '1000 5 1\n1200 5 0\n30000 5 1\n90000 5 0\n' > uit/rtsan/bypass.txt
          for blok in 1 512 3,128,1,4096,77; do
            for sr in 44100 192000; do
              "$R" "$C" $T/noten/in.wav uit/rtsan/b.wav --blok $blok --sr $sr --noten $T/noten/noten.txt --automatie uit/rtsan/bypass.txt
              "$R" "$C" $T/noten/in.wav uit/rtsan/m.wav --blok $blok --sr $sr --noten $T/noten/noten.txt --kanalen 1 --via config
              "$R" "$C" $T/noten/in.wav uit/rtsan/m.wav --blok $blok --sr $sr --noten $T/noten/noten.txt --kanalen 1 --via configurable --midi
            done
          done
          for blok in 512 3,128,1,4096,77; do
            "$R" "$C" $T/noten/in.wav uit/rtsan/noten.wav --blok $blok --noten $T/noten/noten.txt
            "$R" "$C" $T/noten/in.wav uit/rtsan/midi.wav --blok $blok --noten $T/noten/noten.txt --midi
            "$R" "$C" $T/automatie/in.wav uit/rtsan/auto.wav --blok $blok --automatie $T/automatie/events.txt
            "$R" "$C" $T/sinus-441.in.wav uit/rtsan/sinus.wav --blok $blok
            "$R" "$C" $T/ruis-half.in.wav uit/rtsan/state.wav --blok $blok --state-rondje --p 1=2.125 --p 3=4050
          done
          echo "RTSan: geen schending in process"

      - name: Kanarie moet falen
        run: |
          set +e
          build-kanarie/pb-render "build-kanarie/plugins/PB Toetsenpad.clap" testsignalen/noten/in.wav uit/kanarie.wav \
            --blok 512 > kanarie.log 2>&1
          status=$?
          set -e
          cat kanarie.log
          echo "kanarie exit: $status"
          if [ "$status" -eq 0 ]; then echo "FOUT: de kanarie werd niet gevangen"; exit 1; fi
          grep -q "RealtimeSanitizer" kanarie.log
          grep -q "malloc" kanarie.log
          echo "Kanarie gevangen zoals bedoeld: RTSan werkt."

  macos:
    runs-on: macos-15
    timeout-minutes: 150  # fase 5: pluginval op 6 samplerates × 4 blokgroottes (AU drie keer) en de null-test-matrix
    steps:
      - uses: actions/checkout@v4

      - name: Gereedschap
        run: |
          command -v ninja || brew install ninja
          mkdir -p ~/pluginval && cd ~/pluginval
          curl -sSfL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_macOS.zip"
          unzip -o -q pv.zip
          ls ~/pluginval/pluginval.app/Contents/MacOS/pluginval

      - name: Bouwen (arm64)
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build
          ls -la build/plugins

      - name: Ad-hoc signeren
        run: |
          for b in build/plugins/*.clap build/plugins/*.vst3 build/plugins/*.component; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done

      - name: Installatiepakket (pkgbuild; ongesigneerd, BundleIsRelocatable false, postinstall; fase 6)
        run: |
          mkdir -p pakket
          sh gereedschap/maak-pkg.sh build/plugins "pakket/PB Toetsenpad.pkg"
          ls -la pakket

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: pakket/
          if-no-files-found: error

      - name: Artefact inpakken (ditto bewaart rechten en symlinks)
        run: |
          mkdir -p artefact
          for b in build/plugins/*.clap build/plugins/*.vst3 build/plugins/*.component; do
            ditto -c -k --keepParent "$b" "artefact/$(basename "$b").zip"
          done
          ls -la artefact

      - uses: actions/upload-artifact@v4
        with:
          name: macos-keten_toetsenpad
          path: artefact/

      - name: Installeren in ~/Library/Audio/Plug-Ins
        run: |
          P=~/Library/Audio/Plug-Ins
          mkdir -p "$P/Components" "$P/VST3" "$P/CLAP"
          rm -rf "$P/Components/PB Toetsenpad.component" "$P/VST3/PB Toetsenpad.vst3" "$P/CLAP/PB Toetsenpad.clap"
          cp -R "build/plugins/PB Toetsenpad.component" "$P/Components/"
          cp -R "build/plugins/PB Toetsenpad.vst3" "$P/VST3/"
          cp -R "build/plugins/PB Toetsenpad.clap" "$P/CLAP/"
          # valkuil 5: anders vindt auval de AU niet
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i "Vrve" || true

      - name: pluginval strictness 10 --rtcheck (VST3, via pluginval-rt.sh; valkuil 22; met GUI-toetsen; alle samplerates en blokgroottes)
        run: |
          set -o pipefail
          sh gereedschap/pluginval-rt.sh ~/pluginval/pluginval.app/Contents/MacOS/pluginval \
            "$HOME/Library/Audio/Plug-Ins/VST3/PB Toetsenpad.vst3" --sample-rates "$SAMPLERATES" \
            --block-sizes "$PV_BLOKKEN" --timeout-ms 1200000 2>&1 | tee pv-vst3-mac.log
          sh gereedschap/pluginval-matrix-bewijs.sh pv-vst3-mac.log
          # fase 3: geen --skip-gui-tests, en de editortoetsen openden echt een editor ("Editor stress" logt dit
          # alleen als de plugin een editor heeft)
          grep -q "Testing opening Editor with released processing" pv-vst3-mac.log
          echo "pluginval VST3: editortoetsen draaiden met de editor van de plugin"

      - name: pluginval strictness 10 --rtcheck enabled --repeat 3 (AU; alle samplerates en blokgroottes)
        run: |
          set -o pipefail
          ~/pluginval/pluginval.app/Contents/MacOS/pluginval validate \
            "$HOME/Library/Audio/Plug-Ins/Components/PB Toetsenpad.component" \
            --strictness-level 10 --rtcheck enabled --repeat 3 --sample-rates "$SAMPLERATES" \
            --block-sizes "$PV_BLOKKEN" --timeout-ms 1800000 2>&1 | tee pv-au.log
          grep -q "^SUCCESS" pv-au.log
          sh gereedschap/pluginval-matrix-bewijs.sh pv-au.log
          # fase 3: geen --skip-gui-tests; de editor ging drie keer open (elke herhaling)
          n=$(grep -c "Testing opening Editor with released processing" pv-au.log || true)
          echo "pluginval AU: editor geopend in $n herhalingen"
          test "$n" -ge 3

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje, automatisering, noten CLAP en MIDI)
        run: sh gereedschap/ci-null.sh clap build

      - name: Null-test VST3 (pluginval test, blok 512)
        run: |
          sh gereedschap/ci-null.sh pluginval "$HOME/Library/Audio/Plug-Ins/VST3/PB Toetsenpad.vst3" \
            "$HOME/pluginval/pluginval.app/Contents/MacOS/pluginval" vst3-macos

      - name: Null-test AU (pluginval test, blok 512)
        run: |
          sh gereedschap/ci-null.sh pluginval "$HOME/Library/Audio/Plug-Ins/Components/PB Toetsenpad.component" \
            "$HOME/pluginval/pluginval.app/Contents/MacOS/pluginval" au-macos

      - name: State- en teksttoets (pb-statetoets door het gesigneerde .clap; fase 2)
        run: build/pb-statetoets "$HOME/Library/Audio/Plug-Ins/CLAP/PB Toetsenpad.clap"

      - name: Paneelmodel met de echte rij (pb-paneeltoets; fase 3)
        run: build/pb-paneeltoets frontpaneel.svg

      - name: Paneel door het gesigneerde .clap (pb-paneel; venster, muis, schermafbeeldingen; fase 3)
        run: |
          mkdir -p schermafbeeldingen
          build/pb-paneel "$HOME/Library/Audio/Plug-Ins/CLAP/PB Toetsenpad.clap" "$PWD/schermafbeeldingen" \
            plugin/lettertypen/Silkscreen-Regular.ttf
          ls -la schermafbeeldingen

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-frontpaneel
          path: schermafbeeldingen/
          if-no-files-found: error

      - name: Fabriekspresets door het gesigneerde .clap (pb-presettoets; fase 4)
        run: |
          python3 gereedschap/presets-lijst.py presets > presets.txt
          build/pb-presettoets "$HOME/Library/Audio/Plug-Ins/CLAP/PB Toetsenpad.clap" presets.txt

      - name: auval -strict (aumu PTgg Vrve), met de fabriekspresets
        run: |
          set -o pipefail
          auval -strict -v aumu PTgg Vrve 2>&1 | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          # fase 4: elke presetnaam uit presets/ staat in de uitvoer (de AU geeft ze als factory presets)
          python3 gereedschap/presets-lijst.py presets --namen > presetnamen.txt
          test -s presetnamen.txt
          # auval -v zet ze onder "HAS FACTORY PRESETS" als "ID:   0    Name: <naam>", in de volgorde van presets/
          awk '/HAS FACTORY PRESETS/{f=1; next} f && /^ *ID: /{sub(/^ *ID: *[0-9]+ +Name: /, ""); print; next} f{exit}' \
            auval.log > auval-presets.txt
          echo "--- factory presets volgens auval"
          cat auval-presets.txt
          diff presetnamen.txt auval-presets.txt || { echo "FOUT: de factory presets van auval zijn niet die uit presets/"; exit 1; }
          while IFS= read -r naam; do echo "auval toont preset: $naam"; done < presetnamen.txt
          # fase 5: de AU biedt stereo én mono aan (valkuil 17: de patch maakt audio-ports-config de kanaalindelingen)
          grep -A3 "Reported Channel Capabilities" auval.log | tee auval-kanalen.txt
          grep -q "\[0, 2\]" auval-kanalen.txt && grep -q "\[0, 1\]" auval-kanalen.txt || \
            { echo "FOUT: auval meldt niet de kanaalindelingen [0, 2] en [0, 1]"; exit 1; }
          echo "auval: kanaalindelingen [0, 2] (stereo) en [0, 1] (mono)"

      - name: Verwachting per samplerate uit wasm/graaf.wasm (eerst testsignalen/ bit voor bit na; fase 5)
        run: sh gereedschap/ci-null.sh verwacht build "$SAMPLERATES"

      - name: Null-test VST3 en AU per samplerate (pluginval test, gevallen en noten als MIDI; fase 5)
        run: |
          PV="$HOME/pluginval/pluginval.app/Contents/MacOS/pluginval"
          sh gereedschap/ci-null.sh pluginval-matrix "$HOME/Library/Audio/Plug-Ins/VST3/PB Toetsenpad.vst3" "$PV" vst3-macos
          sh gereedschap/ci-null.sh pluginval-matrix "$HOME/Library/Audio/Plug-Ins/Components/PB Toetsenpad.component" "$PV" au-macos

      - name: Null-test AU-matrix (pb-au-render, eigen AU-host; alle samplerates, stereo en mono, blok 1, 512, 4096; fase 5)
        run: sh gereedschap/ci-null.sh au-matrix build 1 512 4096

      - name: Null-test CLAP-matrix (pb-render; alle samplerates, stereo en mono, blok 1, 4096 en wisselend; fase 5)
        run: sh gereedschap/ci-null.sh matrix build 1 4096 1,4096,7,512,333

  # fase 6: het .pkg op een verse runner die niets bouwt (alleen de scripts uit de checkout)
  installatie:
    needs: macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: pakket

      - name: Installeren (twee keer), plek en handtekening van AU, VST3 en CLAP, auval -strict
        run: sh gereedschap/toets-pkg.sh "$PWD/pakket/PB Toetsenpad.pkg"
