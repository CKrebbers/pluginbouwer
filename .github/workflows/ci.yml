# CI — Dub-echo. Het log is het bewijs (SPEC.md "Validators"); een toets wordt nooit uitgezet om groen te worden.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSIE: v2.0.0-beta3
  CLAP_VALIDATOR_VERSIE: "0.4.1"
  # fase 5: 44,1–192 kHz en blokgrootte 1..4096 (pluginval validate, en de null-test op elke samplerate)
  SAMPLERATES: "44100,48000,88200,96000,176400,192000"
  BLOKGROOTTES: "1,64,512,4096"

jobs:
  linux:
    name: Linux (clang, clap-validator, pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev
      - name: Bouwen (clang)
        run: |
          CC=clang CXX=clang++ cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ls -la build/plugins build/pb-render
      - name: clap-validator ophalen (cache)
        id: cv-cache
        uses: actions/cache@v4
        with:
          path: ~/clap-validator
          key: clap-validator-${{ env.CLAP_VALIDATOR_VERSIE }}-${{ runner.os }}-${{ runner.arch }}
      - name: clap-validator bouwen uit de bron (cargo)
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSIE" --locked --root ~/clap-validator
      - name: clap-validator
        run: |
          set -o pipefail
          ~/clap-validator/bin/clap-validator --version
          # valkuil 8: hij kleurt altijd; de exitcode is de poort, de regel zonder ANSI is het bewijs in het log
          ~/clap-validator/bin/clap-validator validate "build/plugins/PB Dub-echo.clap" 2>&1 | tee cv.log
          sed 's/\x1b\[[0-9;]*m//g' cv.log > cv-kaal.log
          grep -E "tests run, .* 0 failed" cv-kaal.log
          # fase 2 en 4: deze toetsen moeten echt gedraaid en geslaagd zijn (niet overgeslagen)
          for t in state-reproducibility-basic state-reproducibility-binary state-reproducibility-buffered \
                   state-invalid-empty state-invalid-random param-fuzz-basic param-fuzz-bounds param-fuzz-sample-accurate \
                   param-conversions param-set-events param-default-values \
                   preset-discovery-crawl preset-discovery-descriptor-consistency preset-discovery-load \
                   layout-audio-ports-config layout-configurable-audio-ports; do
            uitslag="$(awk -v t="┌─ $t" '$0 ~ t"$" {gevonden=1} gevonden && /└──/ {print; exit}' cv-kaal.log)"
            echo "$t: $uitslag"
            echo "$uitslag" | grep -q PASSED || { echo "FOUT: $t niet PASSED"; exit 1; }
          done
          grep -A6 "┌─ param-conversions$" cv-kaal.log | grep -q "does not support" && { echo "FOUT: geen tekstconversie"; exit 1; } || true
      - name: pluginval ophalen
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_Linux.zip"
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
      - name: pluginval strictness 10 (VST3, xvfb; met de editortests; alle samplerates en blokgroottes)
        run: |
          set -o pipefail
          # diepte 24 (expliciet): dan tekent het X11-paneel echt (op een 8-bit scherm blijft het effen)
          # het pad vóór --sample-rates/--block-sizes: die lijsten slokken anders het pad op
          xvfb-run -a -s "-screen 0 1280x1024x24" ./pluginval/pluginval validate "build/plugins/PB Dub-echo.vst3" \
            --strictness-level 10 --verbose --sample-rates "$SAMPLERATES" --block-sizes "$BLOKGROOTTES" 2>&1 | tee pv-vst3-linux.log
          grep "Time taken to open editor" pv-vst3-linux.log  # fase 3: de editor is echt geopend
          sh gereedschap/ci-formaten.sh pluginval pv-vst3-linux.log
      - name: Frontpaneel (pb-paneel; X11 onder xvfb, muis, schermafbeeldingen)
        run: |
          mkdir -p schermafbeelding/linux
          xvfb-run -a -s "-screen 0 1280x1024x24" ./build/pb-paneel "build/plugins/PB Dub-echo.clap" schermafbeelding/linux
      - name: Schermafbeelding (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeelding-linux
          path: schermafbeelding/linux/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje)
        run: sh gereedschap/ci-null.sh clap build
      - name: Null-test VST3 (pluginval test, xvfb)
        run: xvfb-run -a sh gereedschap/ci-null.sh pluginval "build/plugins/PB Dub-echo.vst3" "$PWD/pluginval/pluginval" vst3-linux
      - name: Matrix maken (verwachte uitvoer per samplerate en indeling, uit wasm/graaf.wasm)
        run: node gereedschap/maak-matrix.mjs uit-matrix/verwacht "$SAMPLERATES"
      - name: Null-test CLAP-matrix (pb-render; 6 samplerates × stereo, mono, mono naar stereo × blok 512, wisselend, in-place)
        run: sh gereedschap/ci-null.sh matrix build uit-matrix/verwacht
      - name: Bypass CLAP (pb-render; aan, aan- en uitzetten met overvloeiing; 48 en 192 kHz, elke indeling)
        run: sh gereedschap/ci-bypass.sh build uit-matrix/verwacht
      - name: Null-test VST3-matrix (pluginval test op elke samplerate, blok 1 en 4096, Bypass)
        run: xvfb-run -a sh gereedschap/ci-null.sh pluginval-matrix "build/plugins/PB Dub-echo.vst3" "$PWD/pluginval/pluginval" vst3-linux uit-matrix/verwacht "$SAMPLERATES"
      - name: Null-test met automatisering (events in process; glijden, blokgrootte verandert niets)
        run: sh gereedschap/ci-automatie.sh build
      - name: State-toets (bouw zonder parameter N → bouw mét, en terug)
        run: |
          for n in 1 2 3 4 5 6 7 8; do
            ./build/pb-state-toets "build/toets/zonder-$n.clap" "build/plugins/PB Dub-echo.clap" "$n" testsignalen/echo-standaard.in.wav
          done
      - name: Fabriekspresets CLAP (pb-preset-toets; discovery, laden, DSP, tegen presets/*.json)
        run: |
          mkdir -p uit
          ./build/pb-preset-toets "build/plugins/PB Dub-echo.clap" uit/presets-clap-linux.tsv testsignalen/echo-standaard.in.wav
          node gereedschap/vergelijk-presets.mjs uit/presets-clap-linux.tsv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Renders (null-test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: null-test-linux
          path: |
            uit/
            uit-matrix/**/uitslag.md

  rtsan:
    name: RTSan (clang 20, pb-render -fsanitize=realtime, kanarie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang 20 via apt.llvm.org
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake lsb-release wget software-properties-common gnupg libx11-dev xvfb
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          clang-20 --version
      - name: Bouwen met RTSan (en een kanariebouw)
        run: |
          for b in rtsan:OFF kanarie:ON; do
            CC=clang-20 CXX=clang++-20 cmake -S plugin -B "build-${b%%:*}" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DPB_RTSAN=ON -DPB_KANARIE="${b#*:}"
            cmake --build "build-${b%%:*}" --target pb-render keten_dub_echo_clap pb-state-toets pb-paneel-toets pb-preset-toets
          done
      - name: RTSan draait schoon (elk testsignaal, blok 512 en wisselend, state-rondje)
        run: |
          set -e
          mkdir -p uit/rtsan
          for f in testsignalen/*.in.wav; do
            n="$(basename "$f" .in.wav)"
            for opt in "--blok 512" "--blok 3,128,1,4096,77" "--blok 512 --state-rondje" "--blok 3,128,1,4096,77 --automatie 100"; do
              echo "== $n $opt"
              # shellcheck disable=SC2086
              ./build-rtsan/pb-render "build-rtsan/plugins/PB Dub-echo.clap" "$f" "uit/rtsan/$n.wav" $opt
            done
          done
          echo "RTSan: schoon"
      - name: RTSan in elke indeling, in-place, met de bypass (44,1 en 192 kHz, blok 1..4096)
        run: |
          set -e
          mkdir -p uit/rtsan-formaten
          p="--p 1=315 --p 2=0.3125 --p 3=3225 --p 4=265 --p 5=1.375 --p 6=6 --p 7=0.25 --p 8=0.25"
          for sr in 44100 192000; do
            for indeling in stereo mono mono-stereo; do
              for opt in "--blok 3,128,1,4096,77" "--blok 512 --in-place" "--blok 3,128,1,4096,77 --automatie 64 --p 9=0 --glij 9=0:1" \
                         "--blok 3,128,1,4096,77 --in-place --automatie 64 --p 9=0 --glij 9=1:0"; do
                echo "== $sr $indeling $opt"
                # shellcheck disable=SC2086
                ./build-rtsan/pb-render "build-rtsan/plugins/PB Dub-echo.clap" testsignalen/echo-standaard.in.wav \
                  "uit/rtsan-formaten/$sr-$indeling.wav" --sr "$sr" --indeling "$indeling" $opt $p
              done
            done
          done
          echo "RTSan (formaten): schoon"
      - name: RTSan met de state-toets (state laden terwijl actief, flush tussen blokken)
        run: |
          set -e
          for n in 1 2 3 4 5 6 7 8; do
            ./build-rtsan/pb-state-toets "build-rtsan/toets/zonder-$n.clap" "build-rtsan/plugins/PB Dub-echo.clap" "$n" testsignalen/echo-standaard.in.wav
          done
          echo "RTSan (state-toets): schoon"
      - name: RTSan met de fabriekspresets (preset laden terwijl actief, dan process)
        run: |
          ./build-rtsan/pb-preset-toets "build-rtsan/plugins/PB Dub-echo.clap" uit/presets-rtsan.tsv testsignalen/echo-standaard.in.wav
          echo "RTSan (presets): schoon"
      - name: RTSan met het frontpaneel (gebaren van het paneel door process op een real-time audiothread)
        run: |
          mkdir -p uit/rtsan-paneel
          xvfb-run -a -s "-screen 0 1280x1024x24" ./build-rtsan/pb-paneel "build-rtsan/plugins/PB Dub-echo.clap" uit/rtsan-paneel
          echo "RTSan (paneel): schoon"
      - name: Kanarie MOET falen (malloc in process)
        run: |
          set +e
          ./build-kanarie/pb-render "build-kanarie/plugins/PB Dub-echo.clap" testsignalen/echo-standaard.in.wav uit/kanarie.wav --blok 512 > kanarie.log 2>&1
          code=$?
          set -e
          cat kanarie.log
          if [ "$code" -eq 0 ]; then echo "FOUT: de kanarie liep schoon; RTSan bewaakt niets"; exit 1; fi
          grep -q "RealtimeSanitizer" kanarie.log || { echo "FOUT: faalde, maar niet door RTSan"; exit 1; }
          grep -q "malloc" kanarie.log || { echo "FOUT: RTSan ving iets anders dan de malloc"; exit 1; }
          echo "Kanarie gevangen door RTSan (exitcode $code), zoals bedoeld"

  tsan:
    name: TSan (paneel en audiothread tegelijk, kanarie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ xvfb libx11-dev
          # TSan van gcc 13 kan niet tegen de adresruimte-randomisatie van de runner-kernel
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Bouwen met -fsanitize=thread (gcc), en een kanariebouw
        run: |
          for b in tsan:OFF tsan-kanarie:ON; do
            CC=gcc CXX=g++ cmake -S plugin -B "build-${b%%:*}" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPB_TOETSEN=OFF \
              -DPB_UI_KANARIE="${b#*:}" -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread \
              -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread
            cmake --build "build-${b%%:*}" --target keten_dub_echo_clap pb-paneel-toets
          done
      - name: TSan draait schoon (paneel op de mainthread, process op een audiothread)
        run: |
          mkdir -p uit/tsan
          TSAN_OPTIONS="halt_on_error=1" xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./build-tsan/pb-paneel "build-tsan/plugins/PB Dub-echo.clap" uit/tsan
          echo "TSan: schoon"
      - name: Kanarie MOET falen (het paneel zet de DSP zelf)
        run: |
          set +e
          mkdir -p uit/tsan-kanarie
          TSAN_OPTIONS="halt_on_error=1" xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./build-tsan/pb-paneel "build-tsan-kanarie/plugins/PB Dub-echo.clap" uit/tsan-kanarie > kanarie.log 2>&1
          code=$?
          set -e
          cat kanarie.log
          if [ "$code" -eq 0 ]; then echo "FOUT: de kanarie liep schoon; TSan bewaakt het paneel niet"; exit 1; fi
          grep -q "ThreadSanitizer: data race" kanarie.log || { echo "FOUT: faalde, maar niet door TSan"; exit 1; }
          grep -q "paneelStuur" kanarie.log || { echo "FOUT: TSan ving iets anders dan het paneel"; exit 1; }
          echo "Kanarie gevangen door TSan (exitcode $code), zoals bedoeld"

  macos:
    name: macOS arm64 (auval, pluginval --rtcheck)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pakketten
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bouwen
        run: |
          uname -m
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build
          ls -la build/plugins
      - name: Ad-hoc signeren
        run: |
          for p in build/plugins/*.clap build/plugins/*.vst3 build/plugins/*.component; do
            codesign --force --deep --sign - "$p"
            codesign --verify --verbose "$p"
          done
      - name: Installatiepakket (pkgbuild; AU, VST3 en CLAP naar /Library/Audio/Plug-Ins)
        run: |
          sh gereedschap/maak-pkg.sh build/plugins "build/pakket/PB Dub-echo.pkg"
          pkgutil --check-signature "build/pakket/PB Dub-echo.pkg" || true  # alleen voor het log: het .pkg zelf is niet gesigneerd
      - name: Installatiepakket (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: build/pakket/
      - name: Installeren
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/CLAP
          cp -R "build/plugins/PB Dub-echo.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/plugins/PB Dub-echo.vst3" ~/Library/Audio/Plug-Ins/VST3/
          cp -R "build/plugins/PB Dub-echo.clap" ~/Library/Audio/Plug-Ins/CLAP/
          killall -9 AudioComponentRegistrar || true
          sleep 2
      - name: auval -strict
        run: |
          set -o pipefail
          auval -a | grep -i "Vrve" || true
          auval -strict -v aufx PDca Vrve 2>&1 | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          # fase 5: de AU biedt mono, mono naar stereo en stereo aan (en auval toetst elke indeling)
          sh gereedschap/ci-formaten.sh auval auval.log
          # fase 4: auval toont de factory presets, elk bij naam
          node -e "for (const f of require('fs').readdirSync('presets').sort()) console.log(require('./presets/' + f).naam)" > preset-namen.txt
          grep -A12 -i "factory preset" auval.log || true  # alleen voor het log; de poort is de lus hieronder
          if grep -q "Preset name is not retained" auval.log; then echo "FOUT: auval: presetnaam niet in de ClassInfo"; exit 1; fi
          while read -r naam; do
            grep -q "$naam" auval.log || { echo "FOUT: auval toont preset '$naam' niet"; exit 1; }
            echo "auval toont preset: $naam"
          done < preset-namen.txt
      - name: Fabriekspresets AU (pb-au-presets; zetten, PresentPreset, ClassInfo, tegen presets/*.json)
        run: |
          mkdir -p uit
          ./build/pb-au-presets uit/presets-au-macos.tsv
          node gereedschap/vergelijk-presets.mjs --au uit/presets-au-macos.tsv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fabriekspresets CLAP (pb-preset-toets; discovery, laden, DSP, tegen presets/*.json)
        run: |
          mkdir -p uit
          ./build/pb-preset-toets "build/plugins/PB Dub-echo.clap" uit/presets-clap-macos.tsv testsignalen/echo-standaard.in.wav
          node gereedschap/vergelijk-presets.mjs uit/presets-clap-macos.tsv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: pluginval ophalen
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
      - name: pluginval strictness 10 --rtcheck enabled (AU; met de editortests)
        run: |
          set -o pipefail
          ./pluginval/pluginval.app/Contents/MacOS/pluginval validate ~/Library/Audio/Plug-Ins/Components/"PB Dub-echo.component" \
            --strictness-level 10 --rtcheck enabled --verbose --sample-rates "$SAMPLERATES" --block-sizes "$BLOKGROOTTES" 2>&1 | tee pv-au.log
          grep "Time taken to open editor" pv-au.log  # fase 3: de editor is echt geopend
          sh gereedschap/ci-formaten.sh pluginval pv-au.log
      - name: pluginval strictness 10 --rtcheck enabled (VST3; met de editortests)
        run: |
          set -o pipefail
          ./pluginval/pluginval.app/Contents/MacOS/pluginval validate ~/Library/Audio/Plug-Ins/VST3/"PB Dub-echo.vst3" \
            --strictness-level 10 --rtcheck enabled --verbose --sample-rates "$SAMPLERATES" --block-sizes "$BLOKGROOTTES" 2>&1 | tee pv-vst3-macos.log
          grep "Time taken to open editor" pv-vst3-macos.log
          sh gereedschap/ci-formaten.sh pluginval pv-vst3-macos.log
      - name: Frontpaneel (pb-paneel; Cocoa, muis, schermafbeeldingen)
        run: |
          mkdir -p schermafbeelding/macos
          ./build/pb-paneel "build/plugins/PB Dub-echo.clap" schermafbeelding/macos
      - name: Schermafbeelding (macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeelding-macos
          path: schermafbeelding/macos/
      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje)
        run: sh gereedschap/ci-null.sh clap build
      - name: Null-test met automatisering (events in process; glijden, blokgrootte verandert niets)
        run: sh gereedschap/ci-automatie.sh build
      - name: State-toets (bouw zonder parameter N → bouw mét, en terug)
        run: |
          for n in 1 2 3 4 5 6 7 8; do
            ./build/pb-state-toets "build/toets/zonder-$n.clap" "build/plugins/PB Dub-echo.clap" "$n" testsignalen/echo-standaard.in.wav
          done
      - name: Null-test VST3 (pluginval test)
        run: |
          sh gereedschap/ci-null.sh pluginval ~/Library/Audio/Plug-Ins/VST3/"PB Dub-echo.vst3" \
            "$PWD/pluginval/pluginval.app/Contents/MacOS/pluginval" vst3-macos
      - name: Null-test AU (pluginval test)
        run: |
          sh gereedschap/ci-null.sh pluginval ~/Library/Audio/Plug-Ins/Components/"PB Dub-echo.component" \
            "$PWD/pluginval/pluginval.app/Contents/MacOS/pluginval" au-macos
      - name: Matrix maken (verwachte uitvoer per samplerate en indeling, uit wasm/graaf.wasm)
        run: node gereedschap/maak-matrix.mjs uit-matrix/verwacht "$SAMPLERATES"
      - name: Null-test CLAP-matrix (pb-render; 6 samplerates × stereo, mono, mono naar stereo × blok 512, wisselend, in-place)
        run: sh gereedschap/ci-null.sh matrix build uit-matrix/verwacht
      - name: Bypass CLAP (pb-render; aan, aan- en uitzetten met overvloeiing; 48 en 192 kHz, elke indeling)
        run: sh gereedschap/ci-bypass.sh build uit-matrix/verwacht
      - name: Null-test AU-matrix (pb-au-render; elke samplerate en indeling, BypassEffect, geweigerde indeling)
        run: sh gereedschap/ci-null.sh au-matrix build/pb-au-render uit-matrix/verwacht
      - name: Null-test VST3-matrix (pluginval test op elke samplerate, blok 1 en 4096, Bypass)
        run: |
          sh gereedschap/ci-null.sh pluginval-matrix ~/Library/Audio/Plug-Ins/VST3/"PB Dub-echo.vst3" \
            "$PWD/pluginval/pluginval.app/Contents/MacOS/pluginval" vst3-macos uit-matrix/verwacht "$SAMPLERATES"
      - name: Null-test AU-matrix via pluginval (pluginval test op elke samplerate, blok 1 en 4096, Bypass)
        run: |
          sh gereedschap/ci-null.sh pluginval-matrix ~/Library/Audio/Plug-Ins/Components/"PB Dub-echo.component" \
            "$PWD/pluginval/pluginval.app/Contents/MacOS/pluginval" au-macos uit-matrix/verwacht "$SAMPLERATES"
      - name: Renders (null-test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: null-test-macos
          path: |
            uit/
            uit-matrix/**/uitslag.md
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: macos-keten_dub_echo
          path: build/plugins/

  pakket:
    # fase 6: het .pkg op een schone runner (niets van de bouw-job, geen eerdere installatie); daarna auval
    name: macOS pakket (installeren op een schone runner, auval)
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: pakket
      - name: Schone runner (nog niets geïnstalleerd)
        run: |
          for f in "/Library/Audio/Plug-Ins/Components/PB Dub-echo.component" "/Library/Audio/Plug-Ins/VST3/PB Dub-echo.vst3" \
                   "/Library/Audio/Plug-Ins/CLAP/PB Dub-echo.clap" ~/Library/Audio/Plug-Ins/Components/"PB Dub-echo.component" \
                   ~/Library/Audio/Plug-Ins/VST3/"PB Dub-echo.vst3" ~/Library/Audio/Plug-Ins/CLAP/"PB Dub-echo.clap"; do
            if [ -e "$f" ]; then echo "FOUT: staat er al: $f"; exit 1; fi
          done
          if auval -a | grep "PDca" | grep -q "Vrve"; then echo "FOUT: auval kent de AU al vóór de installatie"; exit 1; fi
          echo "schoon: geen PB Dub-echo in /Library of ~/Library, auval kent aufx PDca Vrve niet"
      - name: Lokvogel (een uitgepakte kopie in ~/Downloads mag de installatie niet omleiden)
        run: |
          pkgutil --expand-full "pakket/PB Dub-echo.pkg" "$RUNNER_TEMP/uitgepakt"
          mkdir -p ~/Downloads
          ditto "$RUNNER_TEMP/uitgepakt/Payload/Library/Audio/Plug-Ins/Components/PB Dub-echo.component" ~/Downloads/"PB Dub-echo.component"
          ditto "$RUNNER_TEMP/uitgepakt/Payload/Library/Audio/Plug-Ins/VST3/PB Dub-echo.vst3" ~/Downloads/"PB Dub-echo.vst3"
          ditto "$RUNNER_TEMP/uitgepakt/Payload/Library/Audio/Plug-Ins/CLAP/PB Dub-echo.clap" ~/Downloads/"PB Dub-echo.clap"
          find ~/Downloads/"PB Dub-echo".* -exec stat -f "%m %i %N" {} \; | sort | tee "$RUNNER_TEMP/lokvogel-voor.txt"
      - name: Installeren (sudo installer -pkg)
        run: |
          set -o pipefail
          sudo installer -pkg "pakket/PB Dub-echo.pkg" -target / -verboseR 2>&1 | tee installer.log
          grep -q "The install was successful" installer.log
          pkgutil --pkg-info nl.varve.pluginbouwer.dub-echo.pkg
          pkgutil --files nl.varve.pluginbouwer.dub-echo.pkg | grep -E "\.(component|vst3|clap)$"
      - name: Op de juiste plek, gesigneerd, lokvogel onaangeroerd
        run: |
          for f in "/Library/Audio/Plug-Ins/Components/PB Dub-echo.component" "/Library/Audio/Plug-Ins/VST3/PB Dub-echo.vst3" \
                   "/Library/Audio/Plug-Ins/CLAP/PB Dub-echo.clap"; do
            [ -d "$f" ] || { echo "FOUT: niet geïnstalleerd: $f"; exit 1; }
            codesign --verify --strict --verbose "$f"
            codesign -dv "$f" 2>&1 | grep -q "Signature=adhoc" || { echo "FOUT: niet ad-hoc gesigneerd: $f"; exit 1; }
            if xattr -r "$f" | grep -q com.apple.quarantine; then echo "FOUT: quarantaine op $f"; exit 1; fi
            echo "ok: $f ($(stat -f '%Su:%Sg %Sp' "$f"))"
          done
          find ~/Downloads/"PB Dub-echo".* -exec stat -f "%m %i %N" {} \; | sort > "$RUNNER_TEMP/lokvogel-na.txt"
          diff "$RUNNER_TEMP/lokvogel-voor.txt" "$RUNNER_TEMP/lokvogel-na.txt" || { echo "FOUT: de installer schreef in ~/Downloads (relocatable bundel)"; exit 1; }
          echo "lokvogel in ~/Downloads onaangeroerd"
          rm -rf ~/Downloads/"PB Dub-echo".*
      - name: auval -strict (de geïnstalleerde AU)
        run: |
          set -o pipefail
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i "Vrve"
          auval -strict -v aufx PDca Vrve 2>&1 | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          sh gereedschap/ci-formaten.sh auval auval.log
          echo "auval vond de AU in /Library/Audio/Plug-Ins/Components en keurde hem goed"
      - name: pluginval (de geïnstalleerde VST3 en AU, strictness 5)
        run: |
          set -o pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          for f in "/Library/Audio/Plug-Ins/VST3/PB Dub-echo.vst3" "/Library/Audio/Plug-Ins/Components/PB Dub-echo.component"; do
            ./pluginval/pluginval.app/Contents/MacOS/pluginval validate "$f" --strictness-level 5 2>&1 | tee pv.log
          done
