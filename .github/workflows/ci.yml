# CI van Dub-echo: bouwen en alle validators. Het log is het bewijs (PROMPTS.md, poorten per fase).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSIE: v2.0.0-beta3
  CLAP_VALIDATOR_VERSIE: "0.4.1"

jobs:
  linux:
    name: Linux (clang, clap-validator, pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang xvfb libasound2t64 libfreetype6 libfontconfig1

      - name: Bouwen (clang)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ls -la build/plugins

      - name: clap-validator ophalen (cache)
        id: cv-cache
        uses: actions/cache@v4
        with:
          path: ~/clap-validator
          key: clap-validator-${{ env.CLAP_VALIDATOR_VERSIE }}-${{ runner.os }}-ubuntu-24.04

      - name: clap-validator bouwen uit de bron (cargo)
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSIE" --locked --root ~/clap-validator

      - name: clap-validator
        run: |
          ~/clap-validator/bin/clap-validator --version
          set +e
          ~/clap-validator/bin/clap-validator validate build/plugins/PB-Dub-echo.clap 2>&1 | tee cv.log
          status=${PIPESTATUS[0]}
          set -e
          # valkuil 8: clap-validator kleurt altijd; ANSI-codes weg vóór het greppen
          sed 's/\x1b\[[0-9;]*m//g' cv.log > cv-kaal.log
          grep -E "tests run, .* 0 failed" cv-kaal.log
          exit $status

      - name: clap-validator state-reproducibility en param-fuzz (moeten draaien en slagen, niet overgeslagen)
        run: |
          ~/clap-validator/bin/clap-validator validate --json -t 'state-reproducibility|param-fuzz|param-conversions|param-default' \
            build/plugins/PB-Dub-echo.clap > cv-fase2.json || true
          node -e '
            const r = require("./cv-fase2.json").results;
            const moet = ["state-reproducibility-basic", "state-reproducibility-binary", "state-reproducibility-buffered",
                          "param-fuzz-basic", "param-fuzz-bounds", "param-fuzz-sample-accurate", "param-fuzz-modulation",
                          "param-conversions", "param-default-values"];
            let goed = true;
            for (const t of moet) {
              const x = r.find(y => y.test["plugin-instance"] && y.test["plugin-instance"].test === t);
              const code = x ? x.status.code : "ontbreekt";
              console.log(t.padEnd(32), code, x && x.status.details ? x.status.details : "");
              if (code !== "success") goed = false;
            }
            if (!goed) { console.log("FOUT: niet alle fase-2-toetsen van clap-validator geslaagd"); process.exit(1); }
            console.log("alle " + moet.length + " geslaagd");'

      - name: clap-validator preset-tests (fase 4; moeten draaien en slagen, niet overgeslagen)
        run: |
          set +e
          ~/clap-validator/bin/clap-validator validate -t 'preset-discovery' build/plugins/PB-Dub-echo.clap 2>&1 | tee cv-fase4.log
          set -e
          ~/clap-validator/bin/clap-validator validate --json -t 'preset-discovery' build/plugins/PB-Dub-echo.clap > cv-fase4.json || true
          node -e '
            const r = require("./cv-fase4.json").results;
            const moet = ["preset-discovery-crawl", "preset-discovery-descriptor-consistency", "preset-discovery-load"];
            let goed = true;
            for (const t of moet) {
              const x = r.find(y => Object.values(y.test).some(z => z && z.test === t));
              const code = x ? x.status.code : "ontbreekt";
              console.log(t.padEnd(42), code, x && x.status.details ? x.status.details : "");
              if (code !== "success") goed = false;
            }
            if (!goed) { console.log("FOUT: niet alle preset-toetsen van clap-validator geslaagd"); process.exit(1); }
            console.log("alle " + moet.length + " geslaagd");'

      - name: clap-validator indelingen, samplerates en blokgroottes (fase 5; moeten draaien en slagen, niet overgeslagen)
        run: |
          ~/clap-validator/bin/clap-validator validate --json -t 'layout-|process-varying|process-random-block|process-audio-basic' \
            build/plugins/PB-Dub-echo.clap > cv-fase5.json || true
          node -e '
            const r = require("./cv-fase5.json").results;
            const moet = ["layout-audio-ports-config", "layout-configurable-audio-ports", "process-varying-sample-rates",
                          "process-varying-block-sizes", "process-random-block-sizes", "process-audio-basic-in-place",
                          "process-audio-basic-out-of-place"];
            let goed = true;
            for (const t of moet) {
              const x = r.find(y => Object.values(y.test).some(z => z && z.test === t));
              const code = x ? x.status.code : "ontbreekt";
              console.log(t.padEnd(36), code, x && x.status.details ? x.status.details : "");
              if (code !== "success") goed = false;
            }
            if (!goed) { console.log("FOUT: niet alle fase-5-toetsen van clap-validator geslaagd"); process.exit(1); }
            console.log("alle " + moet.length + " geslaagd");'

      - name: clap-validator fuzz (120 s; params, tekst-rondjes, audio)
        run: |
          set +e
          ~/clap-validator/bin/clap-validator fuzz --duration 120s build/plugins/PB-Dub-echo.clap 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          set -e
          sed 's/\x1b\[[0-9;]*m//g' fuzz.log | grep -q "fuzzing finished successfully"
          exit $status

      - name: Eigen toetsen fase 2 (tekst, automatisering, state zonder parameter N -> met)
        run: |
          build/param-toets tekst build/plugins/PB-Dub-echo.clap
          build/param-toets automatisering build/plugins/PB-Dub-echo.clap
          for n in 1 2 3 4 5 6 7 8; do
            build/param-toets state build/plugins/PB-Dub-echo.clap build/toetsen/PB-Dub-echo-zonder-$n.clap $n
          done

      - name: Eigen toets fase 3 (paneel -> host; gui-extensie, gebaren, wachtrij)
        run: build/ui-toets build/toetsen/PB-Dub-echo-ui-stub.clap

      - name: Eigen toets fase 4 (fabriekspresets; preset-discovery en preset-load tegen presets/*.json)
        run: |
          mkdir -p uit
          node gereedschap/presets-plat.mjs presets | tee uit/presets.tsv
          build/preset-toets build/plugins/PB-Dub-echo.clap uit/presets.tsv

      - name: Eigen toets fase 5 (poortindelingen mono/stereo, bypass, samplerates en blokgroottes)
        run: build/formaat-toets build/plugins/PB-Dub-echo.clap

      - name: pluginval ophalen
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_Linux.zip"
          unzip -o pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
          pluginval/pluginval --version

      - name: pluginval strictness 10 (VST3, xvfb)
        run: |
          xvfb-run -a pluginval/pluginval validate --strictness-level 10 --verbose build/plugins/PB-Dub-echo.vst3 2>&1 | tee pv-vst3.log
          test ${PIPESTATUS[0]} -eq 0
          grep -q "SUCCESS" pv-vst3.log

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje)
        run: sh gereedschap/ci-null.sh clap build

      - name: Null-test VST3 (pluginval test, xvfb)
        run: xvfb-run -a sh gereedschap/ci-null.sh pluginval build/plugins/PB-Dub-echo.vst3 "$PWD/pluginval/pluginval" vst3-linux

      - name: Null-matrix CLAP (fase 5; 44,1-192 kHz x stereo/mono/mono-stereo x blok 1..4096, in-place; tegen de WASM)
        run: node gereedschap/null-matrix.mjs clap build/pb-render build/plugins/PB-Dub-echo.clap

      - name: Null-matrix VST3 (fase 5; pluginval test 44,1-192 kHz, blok 1..4096, Bypass aan; xvfb)
        run: xvfb-run -a node gereedschap/null-matrix.mjs pluginval "$PWD/pluginval/pluginval" build/plugins/PB-Dub-echo.vst3 vst3-linux

  rtsan:
    name: RTSan (clang 20, pb-render -fsanitize=realtime, kanarie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: clang 20 via apt.llvm.org
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y libclang-rt-20-dev
          clang++-20 --version

      - name: Bouwen (pb-render met RTSan, plugin en kanarie)
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -S plugin -B build-rtsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPB_RTSAN=ON -DPB_KANARIE=ON
          cmake --build build-rtsan --target pb-render dub_echo_clap dub_echo_kanarie param-toets dub_echo_zonder_8 \
            ui-toets dub_echo_ui_stub preset-toets formaat-toets
          ls -la build-rtsan/plugins build-rtsan/kanarie build-rtsan/toetsen

      - name: RTSan schoon (alle testsignalen, blok 512 en wisselend)
        run: |
          mkdir -p uit/rtsan
          for f in testsignalen/*.in.wav; do
            n=$(basename "$f" .in.wav)
            for blok in 512 3,128,1,4096,77; do
              echo "== $n, blok $blok"
              build-rtsan/pb-render build-rtsan/plugins/PB-Dub-echo.clap "$f" "uit/rtsan/$n.wav" --blok "$blok"
            done
          done
          echo "RTSan: geen overtreding in process"

      - name: RTSan schoon met automatisering (events in process, params.flush op de audiothread, state laden terwijl actief)
        run: |
          build-rtsan/param-toets automatisering build-rtsan/plugins/PB-Dub-echo.clap
          build-rtsan/param-toets state build-rtsan/plugins/PB-Dub-echo.clap build-rtsan/toetsen/PB-Dub-echo-zonder-8.clap 8
          echo "RTSan: geen overtreding in process of flush"

      - name: RTSan schoon met het paneel (UI-berichten in process, gebaren en waarden naar de host)
        run: |
          build-rtsan/ui-toets build-rtsan/toetsen/PB-Dub-echo-ui-stub.clap
          echo "RTSan: geen overtreding in process met UI-berichten"

      - name: RTSan schoon met presets (een preset laden terwijl de plugin draait; overnemen in process)
        run: |
          mkdir -p uit
          node gereedschap/presets-plat.mjs presets > uit/presets.tsv
          build-rtsan/preset-toets build-rtsan/plugins/PB-Dub-echo.clap uit/presets.tsv
          echo "RTSan: geen overtreding in process na een preset"

      - name: RTSan schoon in elke indeling en samplerate (fase 5; mono, mono -> stereo in-place, 44,1 en 192 kHz)
        run: |
          mkdir -p uit/rtsan
          for k in stereo mono mono-stereo; do
            for sr in 44100 192000; do
              echo "== $k, $sr Hz, in-place, blok 3,128,1,4096,77"
              build-rtsan/pb-render build-rtsan/plugins/PB-Dub-echo.clap testsignalen/echo-heet.in.wav "uit/rtsan/$k-$sr.wav" \
                --sr $sr --kanalen $k --in-place --blok 3,128,1,4096,77
            done
          done
          build-rtsan/formaat-toets build-rtsan/plugins/PB-Dub-echo.clap
          echo "RTSan: geen overtreding in process in elke indeling, samplerate, en met bypass"

      - name: Kanarie moet falen (malloc in process)
        run: |
          set +e
          build-rtsan/pb-render build-rtsan/kanarie/PB-Dub-echo-kanarie.clap testsignalen/echo-standaard.in.wav uit/rtsan/kanarie.wav > kanarie.log 2>&1
          status=$?
          set -e
          cat kanarie.log
          if [ $status -eq 0 ]; then echo "FOUT: de kanarie werd niet gevangen; RTSan bewaakt niets"; exit 1; fi
          grep -q "RealtimeSanitizer" kanarie.log
          grep -q "malloc" kanarie.log
          echo "Kanarie gevangen zoals bedoeld (exitcode $status)"

  macos:
    name: macOS arm64 (auval, pluginval --rtcheck)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pakketten
        run: brew install ninja || true

      - name: Bouwen
        run: |
          uname -m
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build
          ls -la build/plugins

      - name: Ad-hoc signeren
        run: |
          for b in build/plugins/PB-Dub-echo.clap build/plugins/PB-Dub-echo.vst3 build/plugins/PB-Dub-echo.component; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done

      - name: Installeren in ~/Library/Audio/Plug-Ins
        run: |
          P=~/Library/Audio/Plug-Ins
          mkdir -p "$P/Components" "$P/VST3" "$P/CLAP"
          rm -rf "$P/Components/PB-Dub-echo.component" "$P/VST3/PB-Dub-echo.vst3" "$P/CLAP/PB-Dub-echo.clap"
          cp -R build/plugins/PB-Dub-echo.component "$P/Components/"
          cp -R build/plugins/PB-Dub-echo.vst3 "$P/VST3/"
          cp -R build/plugins/PB-Dub-echo.clap "$P/CLAP/"
          # valkuil 5: anders vindt auval de nieuwe AU niet
          killall -9 AudioComponentRegistrar || true

      - name: auval -strict
        run: |
          auval -a | grep -i "Vrve" || true
          set +e
          auval -strict -v aufx PDca Vrve 2>&1 | tee auval.log
          status=${PIPESTATUS[0]}
          set -e
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          exit $status

      - name: auval toont de fabriekspresets (fase 4)
        run: |
          mkdir -p uit
          node gereedschap/presets-plat.mjs presets > uit/presets.tsv
          grep -n -i -A14 "factory preset\|FACTORY PRESET" auval.log || true
          cut -f2 uit/presets.tsv | while IFS= read -r naam; do
            if grep -qF "$naam" auval.log; then echo "auval toont: $naam"; else echo "FOUT: auval toont '$naam' niet"; exit 1; fi
          done

      - name: Eigen toets fase 4, AU (factory presets zetten vóór en na Initialize; parameters en ClassInfo)
        run: build/au-preset-toets uit/presets.tsv


      - name: pluginval ophalen
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_macOS.zip"
          unzip -o -q pluginval.zip -d pluginval
          ls pluginval
          echo "PV=$PWD/pluginval/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"

      - name: pluginval strictness 10 --rtcheck (AU)
        run: |
          "$PV" validate --strictness-level 10 --rtcheck enabled --verbose ~/Library/Audio/Plug-Ins/Components/PB-Dub-echo.component 2>&1 | tee pv-au.log
          test ${PIPESTATUS[0]} -eq 0
          grep -q "SUCCESS" pv-au.log

      - name: pluginval strictness 10 --rtcheck (VST3)
        run: |
          "$PV" validate --strictness-level 10 --rtcheck enabled --verbose ~/Library/Audio/Plug-Ins/VST3/PB-Dub-echo.vst3 2>&1 | tee pv-vst3.log
          test ${PIPESTATUS[0]} -eq 0
          grep -q "SUCCESS" pv-vst3.log

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje)
        run: sh gereedschap/ci-null.sh clap build

      - name: Eigen toetsen fase 2 (tekst, automatisering, state zonder parameter N -> met)
        run: |
          build/param-toets tekst build/plugins/PB-Dub-echo.clap
          build/param-toets automatisering build/plugins/PB-Dub-echo.clap
          for n in 1 2 3 4 5 6 7 8; do
            build/param-toets state build/plugins/PB-Dub-echo.clap build/toetsen/PB-Dub-echo-zonder-$n.clap $n
          done

      - name: Eigen toetsen fase 3 (paneel -> host met de stub; het echte paneel met muis, kleuren, maten en schermafbeeldingen)
        run: |
          build/ui-toets build/toetsen/PB-Dub-echo-ui-stub.clap
          mkdir -p uit/gui
          build/gui-toets ~/Library/Audio/Plug-Ins/CLAP/PB-Dub-echo.clap uit/gui
          ls -la uit/gui

      - name: Eigen toets fase 4, CLAP (preset-discovery en preset-load tegen presets/*.json)
        run: build/preset-toets ~/Library/Audio/Plug-Ins/CLAP/PB-Dub-echo.clap uit/presets.tsv

      - name: Eigen toets fase 5, CLAP (poortindelingen mono/stereo, bypass, samplerates en blokgroottes)
        run: build/formaat-toets ~/Library/Audio/Plug-Ins/CLAP/PB-Dub-echo.clap

      - name: Null-matrix CLAP (fase 5; 44,1-192 kHz x stereo/mono/mono-stereo x blok 1..4096, in-place; tegen de WASM)
        run: node gereedschap/null-matrix.mjs clap build/pb-render ~/Library/Audio/Plug-Ins/CLAP/PB-Dub-echo.clap

      - name: Schermafbeeldingen van het paneel als artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-schermafbeelding
          path: uit/gui/*.png
          if-no-files-found: error

      - name: Null-test VST3 (pluginval test)
        run: sh gereedschap/ci-null.sh pluginval ~/Library/Audio/Plug-Ins/VST3/PB-Dub-echo.vst3 "$PV" vst3-macos

      - name: Null-test AU (pluginval test)
        run: sh gereedschap/ci-null.sh pluginval ~/Library/Audio/Plug-Ins/Components/PB-Dub-echo.component "$PV" au-macos

      - name: Null-matrix VST3 (fase 5; pluginval test 44,1-192 kHz, blok 1..4096, Bypass aan)
        run: node gereedschap/null-matrix.mjs pluginval "$PV" ~/Library/Audio/Plug-Ins/VST3/PB-Dub-echo.vst3 vst3-macos

      - name: Null-matrix AU via pluginval (fase 5; 44,1-192 kHz, blok 1..4096, Bypass aan)
        run: node gereedschap/null-matrix.mjs pluginval "$PV" ~/Library/Audio/Plug-Ins/Components/PB-Dub-echo.component au-macos

      # fase 5: achteraan, zodat dit deel van het log in de staart staat (de pluginval-stappen zijn erg lang)
      - name: auval toont de kanaalindelingen (fase 5; 1-1, 1-2 en 2-2)
        run: grep -n -A6 "Channel Handling" auval.log

      - name: Null-matrix AU (fase 5; AudioToolbox, 44,1-192 kHz x mono/mono-stereo/stereo, blokken, BypassEffect)
        run: node gereedschap/null-matrix.mjs au build/au-render

      - name: Plugins als artefact
        uses: actions/upload-artifact@v4
        with:
          name: macos-keten_dub_echo
          path: |
            build/plugins/PB-Dub-echo.clap
            build/plugins/PB-Dub-echo.vst3
            build/plugins/PB-Dub-echo.component
