# CI van Toetsenpad: bouwen, alle validators, de null-test, het paneel, de presets en de formaten (PROMPTS.md fase 0 tot en
# met 6: stereo en mono, bypass, 44,1–192 kHz, blok 1..4096; het installatiepakket op een verse runner). Het log is het
# bewijs; zet hier nooit een toets uit.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSIE: v2.0.0-beta3
  CLAP_VALIDATOR_VERSIE: "0.4.1"
  # fase 5: pluginval validate op alle samplerates en blokgroottes (valkuil 18: het pluginpad staat ervóór)
  PV_SR: "44100,48000,88200,96000,176400,192000"
  PV_BLOK: "1,64,512,1000,4096"

jobs:
  linux:
    name: Linux (clang, clap-validator, pluginval VST3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang xvfb libasound2t64 libfontconfig1 libfreetype6
      - name: Bouwen (clang)
        run: |
          CC=clang CXX=clang++ cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          find build/plugins -maxdepth 3
      - name: clap-validator ${{ env.CLAP_VALIDATOR_VERSIE }} (uit de bron)
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSIE" --root "$HOME/cv" clap-validator
          echo "$HOME/cv/bin" >> "$GITHUB_PATH"
      - name: pluginval ${{ env.PLUGINVAL_VERSIE }}
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_Linux.zip"
          mkdir -p "$HOME/pv" && unzip -o -q pluginval.zip -d "$HOME/pv" && chmod +x "$HOME/pv/pluginval"
      - name: clap-validator
        run: |
          status=0
          clap-validator validate "build/plugins/PB Toetsenpad.clap" > cv.log 2>&1 || status=$?
          # valkuil 8: clap-validator kleurt altijd; eerst de ANSI-codes weg
          sed 's/\x1b\[[0-9;]*m//g' cv.log > cv-schoon.log
          cat cv-schoon.log
          echo "clap-validator exitcode: $status"
          grep -E "tests run, .* 0 failed" cv-schoon.log
          [ "$status" = 0 ] || exit $status
          # fase 2, 4 en 5: de param-, state-, preset- en layout-toetsen moeten echt draaien en slagen (SKIPPED telt niet)
          for t in param-set-events param-fuzz-basic param-fuzz-bounds param-fuzz-sample-accurate param-fuzz-modulation \
                   param-conversions param-default-values state-invalid-empty state-invalid-random \
                   state-reproducibility-basic state-reproducibility-binary state-reproducibility-buffered \
                   preset-discovery-crawl preset-discovery-descriptor-consistency preset-discovery-load \
                   layout-audio-ports-config layout-configurable-audio-ports; do
            uitslag=$(awk -v t="$t" '$0 ~ "┌─ " t "$" {zoek=1} zoek && match($0, /└── (PASSED|FAILED|SKIPPED|WARNING)/) {u = substr($0, RSTART, RLENGTH); sub(/.* /, "", u); print u; exit}' cv-schoon.log)
            echo "clap-validator $t: ${uitslag:-niet gevonden}"
            [ "$uitslag" = PASSED ] || exit 1
          done
      - name: pluginval strictness 10 (VST3, xvfb; 44,1–192 kHz, blok 1..4096)
        run: |
          status=0
          xvfb-run -a "$HOME/pv/pluginval" validate --strictness-level 10 "build/plugins/PB Toetsenpad.vst3" --sample-rates "$PV_SR" --block-sizes "$PV_BLOK" > pv.log 2>&1 || status=$?
          cat pv.log
          echo "pluginval exitcode: $status"
          [ "$status" = 0 ] && grep -q "^SUCCESS" pv.log || exit 1
          # fase 5: de VST3 biedt mono én stereo aan (configurable-audio-ports) en verwerkt ze allebei
          grep -E "Named layouts: .*Mono.*Stereo|Named layouts: .*Stereo.*Mono" pv.log || { echo "FOUT: de VST3 biedt geen mono en stereo aan"; exit 1; }
          grep -E "Layouts tested: [0-9]+, accepted by setBusesLayout: [0-9]+" pv.log
          for sr in $(echo "$PV_SR" | tr , ' '); do grep -q "Testing with sample rate \[$sr\] and block size \[1\]" pv.log || { echo "FOUT: niet getoetst op $sr Hz, blok 1"; exit 1; }; done
          echo "pluginval VST3: $(grep -c "Testing with sample rate" pv.log)× een samplerate/blokgrootte getoetst"
      - name: State-, tekst- en presettoets (pb-statetoets door het .clap)
        run: |
          sh gereedschap/presets-verwacht.sh presets | tee presets-verwacht.tsv
          build/pb-statetoets "build/plugins/PB Toetsenpad.clap" --presets presets-verwacht.tsv
      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje, automatisering, noten CLAP en MIDI)
        run: sh gereedschap/ci-null.sh clap build
      - name: Null-test VST3 (pluginval test, xvfb)
        run: xvfb-run -a sh gereedschap/ci-null.sh pluginval "$PWD/build/plugins/PB Toetsenpad.vst3" "$HOME/pv/pluginval" vst3-linux
      - name: Verwachte uitvoer bij andere samplerates en in mono (wasm/graaf.wasm; eerst testsignalen/ bit voor bit na)
        run: node gereedschap/maak-sr.mjs uit/sr
      - name: Null-test CLAP samplerates (44,1–192 kHz, stereo en mono, blok 1..4096, noten CLAP en MIDI, bypass)
        run: sh gereedschap/ci-null.sh sr build
      - name: Null-test VST3 samplerates (pluginval test met MIDI, xvfb)
        run: xvfb-run -a sh gereedschap/ci-null.sh pluginval-sr "$PWD/build/plugins/PB Toetsenpad.vst3" "$HOME/pv/pluginval" vst3-linux

  rtsan:
    name: RTSan (clang 20, pb-render -fsanitize=realtime, kanarie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang 20 (apt.llvm.org)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          clang++-20 --version
      - name: Bouwen (pb-render met -fsanitize=realtime, plus de kanarie)
        run: |
          CC=clang-20 CXX=clang++-20 cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPB_RTSAN=ON -DPB_KANARIE=ON
          cmake --build build --target pb-render toetsenpad_clap toetsenpad_kanarie
          ls -la build/pb-render "build/plugins/PB Toetsenpad.clap" build/kanarie/kanarie.clap
      - name: RTSan schoon (de plugin door pb-render, ook noten, MIDI en automatisering)
        run: |
          set -e
          R=build/pb-render; P="build/plugins/PB Toetsenpad.clap"; T=testsignalen; U=uit/rtsan; mkdir -p $U
          for g in sinus-441 ruis-half impuls-96k; do
            $R "$P" $T/$g.in.wav $U/$g.wav --blok 512
            $R "$P" $T/$g.in.wav $U/$g-w.wav --blok 3,128,1,4096,77 --p 3=4000
          done
          $R "$P" $T/noten/in.wav $U/noten.wav --blok 3,128,1,4096,77 --noten $T/noten/noten.txt
          $R "$P" $T/noten/in.wav $U/midi.wav --blok 512 --noten $T/noten/noten.txt --midi
          $R "$P" $T/automatie/in.wav $U/auto.wav --blok 3,128,1,4096,77 --automatie $T/automatie/events.txt
          # fase 5: mono en stereo, 44,1 en 192 kHz, blok 1 en 4096, en de bypass (id 5) aan en uit midden in een blok
          printf "40000 5 1\n90000 5 0\n130000 5 1\n" > $U/bypass.txt
          $R "$P" $T/noten/in.wav $U/mono-192k.wav --sr 192000 --kanalen 1 --blok 1 --noten $T/noten/noten.txt --automatie $U/bypass.txt
          $R "$P" $T/noten/in.wav $U/stereo-192k.wav --sr 192000 --kanalen 2 --blok 4096 --noten $T/noten/noten.txt --midi --automatie $U/bypass.txt
          $R "$P" $T/noten/in.wav $U/mono-44k.wav --sr 44100 --kanalen 1 --blok 3,128,1,4096,77 --noten $T/noten/noten.txt --midi --automatie $U/bypass.txt
          echo "RTSan: geen real-time-schending in process"
      - name: RTSan-kanarie (malloc in process; MOET falen)
        run: |
          status=0
          build/pb-render build/kanarie/kanarie.clap testsignalen/sinus-441.in.wav uit/kanarie.wav --blok 512 > kanarie.log 2>&1 || status=$?
          cat kanarie.log
          echo "kanarie exitcode: $status"
          if [ "$status" = 0 ]; then echo "FOUT: de kanarie is niet gevangen; RTSan bewaakt process niet"; exit 1; fi
          grep -q "RealtimeSanitizer" kanarie.log || { echo "FOUT: geen RealtimeSanitizer-melding"; exit 1; }
          grep -q "malloc" kanarie.log || { echo "FOUT: de melding noemt malloc niet"; exit 1; }
          echo "kanarie gevangen zoals bedoeld"

  macos:
    name: macOS arm64 (auval, pluginval AU en VST3)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bouwen
        run: |
          uname -m
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release -j 4
          ls -la build/plugins
      - name: Ad-hoc signeren
        run: |
          for b in "build/plugins/PB Toetsenpad.clap" "build/plugins/PB Toetsenpad.vst3" "build/plugins/PB Toetsenpad.component"; do
            codesign --force --sign - --timestamp=none "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
      - name: Installeren in ~/Library/Audio/Plug-Ins
        run: |
          D="$HOME/Library/Audio/Plug-Ins"
          mkdir -p "$D/Components" "$D/VST3" "$D/CLAP"
          rm -rf "$D/Components/PB Toetsenpad.component" "$D/VST3/PB Toetsenpad.vst3" "$D/CLAP/PB Toetsenpad.clap"
          cp -R "build/plugins/PB Toetsenpad.component" "$D/Components/"
          cp -R "build/plugins/PB Toetsenpad.vst3" "$D/VST3/"
          cp -R "build/plugins/PB Toetsenpad.clap" "$D/CLAP/"
          # valkuil 5
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i "Vrve" || true
      - name: auval -strict
        run: |
          status=0
          auval -strict -v aumu PTgg Vrve > auval.log 2>&1 || status=$?
          cat auval.log
          echo "auval exitcode: $status"
          [ "$status" = 0 ] && grep -q "AU VALIDATION SUCCEEDED" auval.log || exit 1
          # fase 4: elke fabriekspreset uit presets/ staat in de uitvoer van auval
          grep -n -i "preset" auval.log || true
          grep -q "^HAS FACTORY PRESETS" auval.log || { echo "FOUT: auval meldt geen factory presets"; exit 1; }
          for f in presets/*.json; do
            naam=$(jq -r .naam "$f")
            # zoals auval ze toont: "    ID:   0    Name: Helder"
            if grep -E "^ *ID: +[0-9]+ +Name: " auval.log | sed -E 's/^ *ID: +[0-9]+ +Name: //' | grep -F -x -q -- "$naam"; then
              echo "auval toont preset \"$naam\" ($f)"
            else
              echo "FOUT: preset \"$naam\" ($f) staat niet in de presetlijst van auval"; exit 1
            fi
          done
          # de naam van een preset moet in ClassInfo blijven (patches/clap-wrapper-auv2-eigen-presetnaam-in-classinfo.patch)
          if grep -q "Preset name is not retained" auval.log; then echo "FOUT: auval: Preset name is not retained in retrieved class data"; exit 1; fi
          # fase 5: welke kanaalindelingen auval zag (pb-aurender eist mono en stereo verderop)
          grep -n -i -E "channel|bypass" auval.log || true
      - name: Presets door de AU (pb-aupresets)
        run: |
          sh gereedschap/presets-verwacht.sh presets > presets-verwacht.tsv
          build/pb-aupresets presets-verwacht.tsv
      - name: Paneel (pb-paneel; schermafbeeldingen, knoppen via de host, CLAP en AU)
        run: build/pb-paneel "$HOME/Library/Audio/Plug-Ins/CLAP/PB Toetsenpad.clap" "$PWD/schermafbeelding"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-paneel-schermafbeelding
          path: schermafbeelding/
          if-no-files-found: warn  # pb-paneel zelf eist elke schermafbeelding
      - name: pluginval ${{ env.PLUGINVAL_VERSIE }}
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_macOS.zip"
          mkdir -p "$HOME/pv" && ditto -x -k pluginval.zip "$HOME/pv"
          ls "$HOME/pv"
          echo "PV=$HOME/pv/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"
      - name: pluginval strictness 10, --rtcheck enabled (AU, --repeat 3)
        run: |
          status=0
          "$PV" validate --strictness-level 10 --rtcheck enabled --repeat 3 "$HOME/Library/Audio/Plug-Ins/Components/PB Toetsenpad.component" --sample-rates "$PV_SR" --block-sizes "$PV_BLOK" > pv-au.log 2>&1 || status=$?
          cat pv-au.log
          echo "pluginval AU exitcode: $status"
          [ "$status" = 0 ] && grep -q "^SUCCESS" pv-au.log || exit 1
          # fase 3: zonder --skip-gui-tests, en de editor moet er echt zijn (pluginval slaat de editortoetsen anders stil over)
          grep -q "Testing opening Editor with released processing" pv-au.log || { echo "FOUT: pluginval opende geen editor (AU)"; exit 1; }
          echo "pluginval AU: editor geopend ($(grep -c "Testing opening Editor" pv-au.log)×)"
          # fase 5: de AU biedt mono én stereo aan (patch, valkuil 17), op alle samplerates en blokgroottes getoetst
          grep -E "Named layouts: .*Mono.*Stereo|Named layouts: .*Stereo.*Mono" pv-au.log || { echo "FOUT: de AU biedt geen mono en stereo aan"; exit 1; }
          for sr in $(echo "$PV_SR" | tr , ' '); do grep -q "Testing with sample rate \[$sr\] and block size \[1\]" pv-au.log || { echo "FOUT: niet getoetst op $sr Hz, blok 1"; exit 1; }; done
          echo "pluginval AU: $(grep -c "Testing with sample rate" pv-au.log)× een samplerate/blokgrootte getoetst"
      - name: pluginval strictness 10, rtcheck (VST3 van een instrument, valkuil 22)
        run: |
          sh gereedschap/pluginval-rt.sh "$PV" "$HOME/Library/Audio/Plug-Ins/VST3/PB Toetsenpad.vst3" --sample-rates "$PV_SR" --block-sizes "$PV_BLOK" | tee pv-vst3.log
          grep -q "Testing opening Editor with released processing" pv-vst3.log || { echo "FOUT: pluginval opende geen editor (VST3)"; exit 1; }
          echo "pluginval VST3: editor geopend ($(grep -c "Testing opening Editor" pv-vst3.log)×)"
          grep -E "Named layouts: .*Mono.*Stereo|Named layouts: .*Stereo.*Mono" pv-vst3.log || { echo "FOUT: de VST3 biedt geen mono en stereo aan"; exit 1; }
          for sr in $(echo "$PV_SR" | tr , ' '); do grep -q "Testing with sample rate \[$sr\] and block size \[1\]" pv-vst3.log || { echo "FOUT: niet getoetst op $sr Hz, blok 1"; exit 1; }; done
      - name: State-, tekst- en presettoets (pb-statetoets door het .clap, arm64)
        run: |
          sh gereedschap/presets-verwacht.sh presets > presets-verwacht.tsv
          build/pb-statetoets "build/plugins/PB Toetsenpad.clap" --presets presets-verwacht.tsv
      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje, automatisering, noten CLAP en MIDI)
        run: sh gereedschap/ci-null.sh clap build
      - name: Null-test VST3 (pluginval test)
        run: sh gereedschap/ci-null.sh pluginval "$HOME/Library/Audio/Plug-Ins/VST3/PB Toetsenpad.vst3" "$PV" vst3-macos
      - name: Null-test AU (pluginval test)
        run: sh gereedschap/ci-null.sh pluginval "$HOME/Library/Audio/Plug-Ins/Components/PB Toetsenpad.component" "$PV" au-macos
      - name: Verwachte uitvoer bij andere samplerates en in mono (wasm/graaf.wasm; eerst testsignalen/ bit voor bit na)
        run: node gereedschap/maak-sr.mjs uit/sr
      - name: Null-test CLAP samplerates (44,1–192 kHz, stereo en mono, blok 1..4096, noten CLAP en MIDI, bypass)
        run: sh gereedschap/ci-null.sh sr build
      - name: Null-test VST3 samplerates (pluginval test met MIDI)
        run: sh gereedschap/ci-null.sh pluginval-sr "$HOME/Library/Audio/Plug-Ins/VST3/PB Toetsenpad.vst3" "$PV" vst3-macos
      - name: Null-test AU samplerates (pluginval test met MIDI)
        run: sh gereedschap/ci-null.sh pluginval-sr "$HOME/Library/Audio/Plug-Ins/Components/PB Toetsenpad.component" "$PV" au-macos
      - name: Null-test AU stereo en mono (pb-aurender; valkuil 17; noten als MIDI, knoppen, bypass)
        run: sh gereedschap/ci-null.sh au-sr build/pb-aurender
      - name: Artefact klaarzetten (zelf gezipt, want een artefact bewaart geen rechten of symlinks)
        run: |
          mkdir -p artefact
          for b in clap vst3 component; do
            ditto -c -k --keepParent "build/plugins/PB Toetsenpad.$b" "artefact/PB Toetsenpad.$b.zip"
          done
          ls -la artefact
      - uses: actions/upload-artifact@v4
        with:
          name: macos-keten_toetsenpad
          path: artefact/
      - name: Installatiepakket (pkgbuild; ad-hoc gesigneerde AU, VST3 en CLAP; BundleIsRelocatable false)
        run: |
          versie=$(sed -n 's/^project(toetsenpad VERSION \([0-9.]*\).*/\1/p' plugin/CMakeLists.txt)
          sh gereedschap/maak-pkg.sh build/plugins "pkg/PB Toetsenpad $versie.pkg" "$versie"
          ls -la pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: pkg/
          if-no-files-found: error

  # fase 6: een verse runner die niets bouwt en niets uitcheckt; alleen het .pkg uit de macos-job
  installeer:
    name: macOS installatiepakket (verse runner; twee keer installeren, plek, handtekening, auval -strict)
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: pkg
      - name: Niets geïnstalleerd vooraf
        run: |
          ls -la pkg
          for d in /Library/Audio/Plug-Ins "$HOME/Library/Audio/Plug-Ins"; do
            for p in "Components/PB Toetsenpad.component" "VST3/PB Toetsenpad.vst3" "CLAP/PB Toetsenpad.clap"; do
              if [ -e "$d/$p" ]; then echo "FOUT: $d/$p bestaat al op een verse runner"; exit 1; fi
            done
          done
          if pkgutil --pkgs | grep -q toetsenpad; then echo "FOUT: er is al een receipt"; exit 1; fi
          echo "verse runner: geen PB Toetsenpad, geen receipt"
      - name: Installeren (eerste keer; "Installing")
        run: |
          pkg=$(ls pkg/*.pkg)
          pkgutil --check-signature "$pkg" || echo "pakket is ongesigneerd (zoals bedoeld; geen Developer ID)"
          set -o pipefail  # de exitcode van installer telt, niet die van tee
          sudo installer -pkg "$pkg" -target / -verbose 2>&1 | tee installeer-1.log
          grep -q "The install was successful" installeer-1.log || { echo "FOUT: eerste installatie niet geslaagd"; exit 1; }
          grep -q "Installing at base path /" installeer-1.log || { echo "FOUT: eerste installatie meldt geen \"Installing\""; exit 1; }
          if grep -q -i "upgrad" installeer-1.log; then echo "FOUT: eerste installatie meldt al een upgrade"; exit 1; fi
          pkgutil --pkg-info nl.varve.pluginbouwer.toetsenpad.pkg
      - name: Installeren (tweede keer; "Upgrading")
        run: |
          pkg=$(ls pkg/*.pkg)
          set -o pipefail  # de exitcode van installer telt, niet die van tee
          sudo installer -pkg "$pkg" -target / -verbose 2>&1 | tee installeer-2.log
          grep -q "The upgrade was successful" installeer-2.log || { echo "FOUT: tweede installatie meldt geen geslaagde upgrade"; exit 1; }
          grep -q "Upgrading at base path /" installeer-2.log || { echo "FOUT: tweede installatie meldt geen \"Upgrading\""; exit 1; }
          pkgutil --files nl.varve.pluginbouwer.toetsenpad.pkg | grep -E "\.(component|vst3|clap)$"
      - name: Plek en handtekening van alle drie
        run: |
          D=/Library/Audio/Plug-Ins
          for p in "Components/PB Toetsenpad.component" "VST3/PB Toetsenpad.vst3" "CLAP/PB Toetsenpad.clap"; do
            b="$D/$p"
            [ -d "$b" ] || { echo "FOUT: $b ontbreekt"; exit 1; }
            [ -e "$HOME/Library/Audio/Plug-Ins/$p" ] && { echo "FOUT: ook in ~/Library: $p"; exit 1; }
            ls -la "$b/Contents" "$b/Contents/MacOS"
            [ "$(stat -f %Su "$b")" = root ] || { echo "FOUT: $b is niet van root"; exit 1; }
            codesign --verify --strict --deep --verbose=2 "$b"
            codesign -dv "$b" 2>&1 | tee sig.log
            grep -q "^Signature=adhoc" sig.log || { echo "FOUT: $b is niet ad-hoc gesigneerd"; exit 1; }
            echo "OK: $b staat op zijn plek en is ad-hoc gesigneerd"
          done
          # nergens anders neergezet (BundleIsRelocatable false)
          pkgutil --pkg-info nl.varve.pluginbouwer.toetsenpad.pkg | grep -E "^(volume|location):"
      - name: auval -strict (de AU uit /Library, na de postinstall)
        run: |
          sleep 2
          auval -a | grep -i "Vrve" || { echo "FOUT: auval ziet de AU niet"; exit 1; }
          status=0
          auval -strict -v aumu PTgg Vrve > auval.log 2>&1 || status=$?
          cat auval.log
          echo "auval exitcode: $status"
          [ "$status" = 0 ] && grep -q "AU VALIDATION SUCCEEDED" auval.log || exit 1
          grep -q "/Library/Audio/Plug-Ins/Components/PB Toetsenpad.component" auval.log && echo "auval laadde de AU uit /Library" || true
