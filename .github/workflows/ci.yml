# CI voor de plugin "Dub-echo". Het log is het bewijs (SPEC.md "Validators", PROMPTS.md poorten).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSIE: v2.0.0-beta3
  CLAP_VALIDATOR_VERSIE: 0.4.1

jobs:
  linux:
    name: Linux (clang, clap-validator, pluginval VST3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Pakketten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Bouwen (clang)
        env: { CC: clang, CXX: clang++ }
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ls -la build/plugins

      - name: Tweede configure (patches mogen er al op zitten)
        run: cmake -S plugin -B build

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh clap build 2>&1 | tee null-clap.log

      - name: Fase 2 — tekst, state-toets (build zonder parameter N), automatisering
        run: |
          set -o pipefail
          # een locale met een decimale komma, zodat de teksttoets ook die host-situatie doorloopt
          sudo localedef -i nl_NL -f UTF-8 nl_NL.UTF-8
          PB_EIS_KOMMA=1 sh plugin/toets/toets-fase2.sh build 2>&1 | tee toets-fase2.log

      - name: Fase 3 — frontpaneel (pb-paneel in een X11-venster onder xvfb; slepen, Shift, dubbelklik, host-waarden)
        run: |
          set -o pipefail
          PB_VOOR="xvfb-run -a" sh plugin/toets/toets-fase3.sh build uit/paneel 2>&1 | tee toets-fase3.log

      - name: Fase 4 — fabriekspresets (CLAP preset-discovery en preset-load, ook onder een komma-locale)
        run: |
          set -o pipefail
          PB_EIS_KOMMA=1 sh plugin/toets/toets-fase4.sh build 2>&1 | tee toets-fase4.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-paneel-schermafbeelding
          path: uit/paneel/

      - name: Cache clap-validator
        uses: actions/cache@v4
        with:
          path: ~/clap-validator
          key: clap-validator-${{ env.CLAP_VALIDATOR_VERSIE }}-${{ runner.os }}

      - name: clap-validator ${{ env.CLAP_VALIDATOR_VERSIE }} uit de bron
        run: |
          if [ ! -x ~/clap-validator/bin/clap-validator ]; then
            cargo install --locked --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSIE" \
              --root ~/clap-validator clap-validator
          fi
          ~/clap-validator/bin/clap-validator --version

      - name: clap-validator
        run: |
          set -o pipefail
          ~/clap-validator/bin/clap-validator validate "build/plugins/PB Dub-echo.clap" 2>&1 | tee clap-validator.log
          # valkuil 8: de uitvoer is altijd gekleurd; ANSI-codes weg vóór het greppen
          sed 's/\x1b\[[0-9;]*m//g' clap-validator.log | grep -E '[0-9]+ tests run, [0-9]+ passed, 0 failed'
          # fase 4: de preset-toetsen moeten echt draaien (PASSED, niet SKIPPED omdat er geen factory is)
          for t in preset-discovery-crawl preset-discovery-descriptor-consistency preset-discovery-load; do
            uitslag="$(sed 's/\x1b\[[0-9;]*m//g' clap-validator.log | awk -v t="─ $t" '$0 ~ t"$" {z=1} z && !k && /└──/ {print; k=1}')"
            echo "$t: $uitslag"
            echo "$uitslag" | grep -q PASSED || { echo "FOUT: $t is niet PASSED"; exit 1; }
          done

      - name: pluginval ${{ env.PLUGINVAL_VERSIE }}
        run: |
          curl -sSLo pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_Linux.zip"
          unzip -o pluginval.zip -d pluginval
          chmod +x pluginval/pluginval

      - name: pluginval strictness 10 (VST3, xvfb)
        run: |
          set -o pipefail
          xvfb-run -a ./pluginval/pluginval validate --strictness-level 10 --verbose "build/plugins/PB Dub-echo.vst3" 2>&1 | tee pluginval-vst3.log

      - name: Null-test VST3 (pluginval test, xvfb)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh pluginval "build/plugins/PB Dub-echo.vst3" "xvfb-run -a ./pluginval/pluginval" vst3-linux 2>&1 | tee null-vst3.log

      - name: Bewijs (kernregels uit de logs hierboven)
        run: |
          echo "clap-validator: $(sed 's/\x1b\[[0-9;]*m//g' clap-validator.log | grep -E 'tests run, .* failed')"
          echo "pluginval VST3 Linux: $(grep -E 'Strictness level|^SUCCESS|FAILED' pluginval-vst3.log | tr '\n' ' ')"
          echo "null-test CLAP Linux:"; grep -E '^###|^\| (echo|zelf|sweep)' null-clap.log
          echo "null-test VST3 Linux:"; grep -E '^###|^\| (echo|zelf|sweep)|max abs diff' null-vst3.log
          echo "clap-validator fase 2:"; sed 's/\x1b\[[0-9;]*m//g' clap-validator.log | grep -A12 -E '─ (param-conversions|param-fuzz-|state-reproducibility-|param-set-)' | grep -E '─ |PASSED|FAILED|SKIPPED'
          echo "eigen toetsen fase 2 Linux:"; grep -E '^(state-toets|tekst|automatisering):|^###|^\| (echo|zelf|sweep)|FOUT' toets-fase2.log
          echo "pluginval VST3 Linux, editor-toetsen (geen --skip-gui-tests):"; grep -E 'Starting tests in: pluginval / .*Editor|open editor|Opening editor|Editor stress' pluginval-vst3.log
          echo "eigen toets fase 3 Linux:"; grep -E '^pb-paneel:|^  ok:|^paneel:|FOUT' toets-fase3.log
          echo "clap-validator fase 4 (presets):"; sed 's/\x1b\[[0-9;]*m//g' clap-validator.log | grep -A8 -E '─ preset-' | grep -E '─ |PASSED|FAILED|SKIPPED'
          echo "eigen toets fase 4 Linux:"; grep -E '^presets:|FOUT|\.json: één preset|komma|nl_NL' toets-fase4.log

  rtsan:
    name: RTSan (clang 20, pb-render, kanarie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: clang 20 via apt.llvm.org
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget software-properties-common gnupg libx11-dev xvfb
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          clang-20 --version

      - name: Bouwen (CLAP + pb-render met -fsanitize=realtime)
        env: { CC: clang-20, CXX: clang++-20 }
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPB_FORMATS=CLAP -DPB_RTSAN=ON
          cmake --build build --target keten_dub_echo_clap pb-render pb-toetsen

      - name: RTSan schoon (alle testsignalen, blok 512 en wisselend)
        run: |
          mkdir -p uit/rtsan
          for f in testsignalen/*.in.wav; do
            n=$(basename "$f" .in.wav)
            ./build/pb-render "build/plugins/PB Dub-echo.clap" "$f" "uit/rtsan/$n.wav" --blok 512
            ./build/pb-render "build/plugins/PB Dub-echo.clap" "$f" "uit/rtsan/$n-w.wav" --blok 3,128,1,4096,77 --state-rondje
            echo "RTSan schoon: $n"
          done
          ls -la uit/rtsan

      - name: Null-test CLAP met de RTSan-bouw (parameters, wisselende blokken, state-rondje)
        run: sh gereedschap/ci-null.sh clap build

      - name: Fase 2-toetsen met de RTSan-bouw (events midden in blokken, state-load terwijl actief)
        run: sh plugin/toets/toets-fase2.sh build

      - name: Fase 3 met de RTSan-bouw (paneel bedienen terwijl process op een audiothread loopt)
        run: |
          set -o pipefail
          mkdir -p uit/paneel-rtsan
          xvfb-run -a ./build/pb-paneel "build/plugins/PB Dub-echo.clap" uit/paneel-rtsan --audio 2>&1 | tee paneel-rtsan.log
          if grep -q RealtimeSanitizer paneel-rtsan.log; then echo "FOUT: RTSan meldt iets"; exit 1; fi
          grep "paneel: geslaagd" paneel-rtsan.log

      - name: Fase 4 met de RTSan-bouw (presets laden, ook terwijl actief, dan process)
        run: sh plugin/toets/toets-fase4.sh build

      - name: Kanarie bouwen (malloc in process)
        env: { CC: clang-20, CXX: clang++-20 }
        run: |
          cmake -S plugin -B build-kanarie -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPB_FORMATS=CLAP -DPB_RTSAN=ON -DPB_KANARIE=ON
          cmake --build build-kanarie --target keten_dub_echo_clap pb-render

      - name: Kanarie MOET falen
        run: |
          mkdir -p uit/kanarie
          if ./build-kanarie/pb-render "build-kanarie/plugins/PB Dub-echo.clap" testsignalen/echo-standaard.in.wav \
               uit/kanarie/uit.wav > kanarie.log 2>&1; then
            cat kanarie.log; echo "FOUT: de kanarie is niet gevangen; RTSan bewaakt process niet"; exit 1
          fi
          cat kanarie.log
          grep -q "RealtimeSanitizer" kanarie.log
          grep -q "malloc" kanarie.log
          echo "Kanarie gevangen door RTSan, zoals bedoeld."
          echo "Bewijs: $(grep 'SUMMARY: RealtimeSanitizer' kanarie.log)"

  macos:
    name: macOS arm64 (auval, pluginval --rtcheck AU en VST3)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Bouwen
        run: |
          uname -m
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --parallel 4
          ls -la build/plugins

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh clap build 2>&1 | tee null-clap.log

      - name: Fase 2 — tekst, state-toets (build zonder parameter N), automatisering
        run: |
          set -o pipefail
          PB_EIS_KOMMA=1 sh plugin/toets/toets-fase2.sh build 2>&1 | tee toets-fase2.log

      - name: Fase 3 — frontpaneel (pb-paneel in een NSWindow; slepen, Shift, dubbelklik, host-waarden, schermafbeelding)
        run: |
          set -o pipefail
          sh plugin/toets/toets-fase3.sh build uit/paneel 2>&1 | tee toets-fase3.log

      - name: Fase 4 — fabriekspresets (CLAP preset-discovery en preset-load, ook onder een komma-locale)
        run: |
          set -o pipefail
          PB_EIS_KOMMA=1 sh plugin/toets/toets-fase4.sh build 2>&1 | tee toets-fase4.log

      - name: Ad-hoc signeren
        run: |
          for b in "build/plugins/PB Dub-echo.clap" "build/plugins/PB Dub-echo.vst3" "build/plugins/PB Dub-echo.component"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done

      - name: Installeren in ~/Library/Audio/Plug-Ins
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/CLAP
          rm -rf ~/Library/Audio/Plug-Ins/*/"PB Dub-echo".*
          cp -R "build/plugins/PB Dub-echo.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/plugins/PB Dub-echo.vst3" ~/Library/Audio/Plug-Ins/VST3/
          cp -R "build/plugins/PB Dub-echo.clap" ~/Library/Audio/Plug-Ins/CLAP/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i "Vrve" || true
          ls -la ~/Library/Audio/Plug-Ins/Components/"PB Dub-echo.component"/Contents/Resources/presets

      - name: auval -strict
        run: |
          set -o pipefail
          auval -strict -v aufx PDca Vrve 2>&1 | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: auval toont de fabriekspresets (elke naam uit presets/*.json)
        run: |
          node -e 'const fs = require("fs"); for (const f of fs.readdirSync("presets").filter((f) => f.endsWith(".json")).sort()) console.log(JSON.parse(fs.readFileSync("presets/" + f, "utf8")).naam)' > presetnamen.txt
          grep -n -i -E "preset" auval.log || true
          ontbreekt=0
          while IFS= read -r naam; do
            if grep -F -- "$naam" auval.log > /dev/null; then echo "auval toont: $(grep -F -- "$naam" auval.log | head -1)"
            else echo "FOUT: auval toont de preset '$naam' niet"; ontbreekt=1; fi
          done < presetnamen.txt
          [ "$ontbreekt" = 0 ]

      - name: pluginval ${{ env.PLUGINVAL_VERSIE }}
        run: |
          curl -sSLo pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_macOS.zip"
          unzip -o pluginval.zip -d pluginval
          ls pluginval

      - name: pluginval strictness 10 --rtcheck (AU)
        run: |
          set -o pipefail
          ./pluginval/pluginval.app/Contents/MacOS/pluginval validate --strictness-level 10 --rtcheck enabled --verbose \
            ~/Library/Audio/Plug-Ins/Components/"PB Dub-echo.component" 2>&1 | tee pluginval-au.log

      - name: pluginval strictness 10 --rtcheck (VST3)
        run: |
          set -o pipefail
          ./pluginval/pluginval.app/Contents/MacOS/pluginval validate --strictness-level 10 --rtcheck enabled --verbose \
            ~/Library/Audio/Plug-Ins/VST3/"PB Dub-echo.vst3" 2>&1 | tee pluginval-vst3.log

      - name: Null-test AU (pluginval test)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh pluginval ~/Library/Audio/Plug-Ins/Components/"PB Dub-echo.component" \
            "./pluginval/pluginval.app/Contents/MacOS/pluginval" au-macos 2>&1 | tee null-au.log

      - name: Null-test VST3 (pluginval test)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh pluginval ~/Library/Audio/Plug-Ins/VST3/"PB Dub-echo.vst3" \
            "./pluginval/pluginval.app/Contents/MacOS/pluginval" vst3-macos 2>&1 | tee null-vst3.log

      - name: Bewijs (kernregels uit de logs hierboven)
        run: |
          echo "auval: $(grep 'AU VALIDATION SUCCEEDED' auval.log)"
          echo "pluginval AU: $(grep -E 'Strictness level|rtcheck|^SUCCESS|FAILED' pluginval-au.log | head -5 | tr '\n' ' ')"
          echo "pluginval VST3: $(grep -E 'Strictness level|rtcheck|^SUCCESS|FAILED' pluginval-vst3.log | head -5 | tr '\n' ' ')"
          echo "null-test CLAP macOS:"; grep -E '^###|^\| (echo|zelf|sweep)' null-clap.log
          echo "null-test AU macOS:"; grep -E '^###|^\| (echo|zelf|sweep)|max abs diff' null-au.log
          echo "null-test VST3 macOS:"; grep -E '^###|^\| (echo|zelf|sweep)|max abs diff' null-vst3.log
          echo "eigen toetsen fase 2 macOS:"; grep -E '^(state-toets|tekst|automatisering):|^###|^\| (echo|zelf|sweep)|FOUT|komma' toets-fase2.log
          echo "pluginval AU, editor-toetsen (geen --skip-gui-tests):"; grep -E 'Starting tests in: pluginval / .*Editor|open editor|Opening editor|Editor stress' pluginval-au.log
          echo "pluginval VST3 macOS, editor-toetsen (geen --skip-gui-tests):"; grep -E 'Starting tests in: pluginval / .*Editor|open editor|Opening editor|Editor stress' pluginval-vst3.log
          echo "eigen toets fase 3 macOS:"; grep -E '^pb-paneel:|^  ok:|^  schermafbeelding|^paneel:|FOUT' toets-fase3.log
          echo "eigen toets fase 4 macOS:"; grep -E '^presets:|FOUT|\.json: één preset|komma|nl_NL' toets-fase4.log
          echo "auval, fabriekspresets:"; grep -i -E "preset" auval.log

      - name: Artefact klaarzetten
        if: always()
        run: |
          mkdir -p artefact
          cp -R build/plugins/"PB Dub-echo".* artefact/ || true
          # een zip met ditto houdt de bundels intact (rechten, symlinks); het artefact zelf bewaart geen rechten
          (cd build/plugins && ditto -c -k --keepParent "PB Dub-echo.component" ../../artefact/PB-Dub-echo-component.zip) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-keten_dub_echo
          path: artefact/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-paneel-schermafbeelding
          path: uit/paneel/
