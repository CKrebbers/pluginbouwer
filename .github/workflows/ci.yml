# CI van het bouwpakket Dub-echo (fase 0–6): bouwen, alle validators en de null-test door het gebouwde binary. Het log is het bewijs; elke job eindigt met een
# stap "Bewijs" die de uitslagen samenvat (de GitHub-tools geven alleen de laatste 5000 regels van een job: valkuil 18).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CLAP_VALIDATOR_VERSIE: "0.4.1"
  PLUGINVAL_VERSIE: "v2.0.0-beta3"

jobs:
  linux:
    name: Linux (clang, clap-validator, pluginval VST3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Gereedschap installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang xvfb libasound2t64 libfontconfig1 libfreetype6

      - name: clap-validator uit de cache
        id: cv-cache
        uses: actions/cache@v4
        with:
          path: ~/clap-validator
          key: clap-validator-${{ env.CLAP_VALIDATOR_VERSIE }}-${{ runner.os }}-${{ runner.arch }}

      - name: clap-validator bouwen uit de bron (cargo)
        if: steps.cv-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSIE" \
            --root ~/clap-validator clap-validator

      - name: Bouwen (clang)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ls -la build/plugins

      - name: clap-validator
        run: |
          ~/clap-validator/bin/clap-validator --version
          status=0
          ~/clap-validator/bin/clap-validator validate "build/plugins/PB Dub-echo.clap" > cv.log 2>&1 || status=$?
          # valkuil 8: clap-validator kleurt altijd; eerst de ANSI-codes weg
          sed 's/\x1b\[[0-9;]*m//g' cv.log > clap-validator.log
          cat clap-validator.log
          echo "exitcode: $status"
          test "$status" -eq 0
          grep -E "tests run, .* 0 failed" clap-validator.log

      - name: clap-validator state- en parametertoetsen PASSED (SKIPPED telt niet)
        run: |
          sh gereedschap/cv-eis.sh clap-validator.log state-invalid-empty state-invalid-random \
            state-reproducibility-basic state-reproducibility-binary state-reproducibility-buffered \
            param-conversions param-default-values param-set-events param-set-no-cookies param-set-wrong-namespace \
            param-fuzz-basic param-fuzz-bounds param-fuzz-sample-accurate param-fuzz-modulation | tee cv-eis.log
          test "$(grep -c ': PASSED$' cv-eis.log)" -eq 14

      - name: clap-validator preset-toetsen PASSED (SKIPPED telt niet)
        run: |
          sh gereedschap/cv-eis.sh clap-validator.log preset-discovery-crawl preset-discovery-descriptor-consistency \
            preset-discovery-load | tee cv-presets.log
          test "$(grep -c ': PASSED$' cv-presets.log)" -eq 3

      - name: clap-validator indelingen, samplerates, blokgroottes en in-place PASSED (fase 5)
        run: |
          sh gereedschap/cv-eis.sh clap-validator.log layout-audio-ports-config layout-configurable-audio-ports \
            process-audio-basic-out-of-place process-audio-basic-in-place process-varying-sample-rates \
            process-varying-block-sizes process-random-block-sizes | tee cv-indelingen.log
          test "$(grep -c ': PASSED$' cv-indelingen.log)" -eq 7

      - name: Preset-toets (alle fabriekspresets via preset-discovery vinden en via preset-load laden; door het .clap)
        run: |
          set -o pipefail
          build/pb-presettoets "build/plugins/PB Dub-echo.clap" 2>&1 | tee preset-toets.log

      - name: State-toets (blobs met de hand, tekst <-> waarde; door het .clap)
        run: |
          set -o pipefail
          build/pb-statetoets "build/plugins/PB Dub-echo.clap" 2>&1 | tee state-toets.log

      - name: Paneel-toets (model tegen de mockup, muis, brievenbus met twee draden)
        run: |
          set -o pipefail
          build/pb-paneeltoets 2>&1 | tee paneel-toets.log

      - name: pluginval ophalen
        run: |
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_Linux.zip"
          unzip -o pv.zip -d pv
          chmod +x pv/pluginval

      - name: pluginval VST3 (strictness 10, xvfb)
        run: |
          status=0
          xvfb-run -a pv/pluginval validate --strictness-level 10 "$PWD/build/plugins/PB Dub-echo.vst3" > pluginval-vst3.log 2>&1 || status=$?
          cat pluginval-vst3.log
          echo "exitcode: $status"
          test "$status" -eq 0
          grep -q "^SUCCESS" pluginval-vst3.log

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje, automatisering)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh clap build 2>&1 | tee null-clap.log

      - name: Null-test VST3 (pluginval test, xvfb)
        run: |
          set -o pipefail
          xvfb-run -a sh gereedschap/ci-null.sh pluginval "$PWD/build/plugins/PB Dub-echo.vst3" "$PWD/pv/pluginval" vst3-linux 2>&1 | tee null-vst3.log

      - name: Matrix - verwachte uitvoer uit graaf.wasm (eerst testsignalen bit voor bit; 44,1-192 kHz, drie indelingen, bypass)
        run: |
          set -o pipefail
          node gereedschap/matrix.mjs maak "$PWD/uit/matrix" 2>&1 | tee matrix-maak.log

      - name: Null-test CLAP matrix (pb-render; elke samplerate en indeling, blok 512 en 1,4096,77,3 in-place, bypass)
        run: |
          set -o pipefail
          node gereedschap/matrix.mjs clap "$PWD/uit/matrix" build/pb-render "build/plugins/PB Dub-echo.clap" 2>&1 | tee null-matrix-clap.log

      - name: Null-test VST3 matrix (pluginval test per samplerate, blok 1..4096, xvfb)
        run: |
          set -o pipefail
          xvfb-run -a node gereedschap/matrix.mjs pluginval "$PWD/uit/matrix" "$PWD/pv/pluginval" "$PWD/build/plugins/PB Dub-echo.vst3" vst3-linux 2>&1 | tee null-matrix-vst3.log

      - name: Bewijs
        if: always()
        run: |
          echo "== clap-validator =="; grep -E "tests run" clap-validator.log || echo "(geen uitslag)"
          grep -E "FAILED" clap-validator.log || echo "geen FAILED"
          echo "== clap-validator state/param =="; cat cv-eis.log || echo "(geen uitslag)"
          echo "== clap-validator presets =="; cat cv-presets.log || echo "(geen uitslag)"
          echo "== clap-validator indelingen (fase 5) =="; cat cv-indelingen.log || echo "(geen uitslag)"
          echo "== preset-toets Linux =="; grep -E "^FOUT|^presets:|^preset-toets:" preset-toets.log || echo "(geen uitslag)"
          echo "== state-toets Linux =="; grep -E "^FOUT|^state-toets:" state-toets.log || echo "(geen uitslag)"
          echo "== paneel-toets Linux =="; grep -E "^FOUT|^paneel-toets:" paneel-toets.log || echo "(geen uitslag)"
          echo "== pluginval VST3 Linux =="; grep -E "^SUCCESS|^FAILURE|FAILED|!!!" pluginval-vst3.log || echo "(geen uitslag)"
          echo "== null-test CLAP Linux =="; grep -aE "^###|^\| [a-z]" null-clap.log || echo "(geen uitslag)"
          echo "== null-test VST3 Linux =="; grep -aE "^###|^\| [a-z]|^PASSED|^FAILED" null-vst3.log || echo "(geen uitslag)"
          echo "== matrix: graaf.wasm tegen testsignalen =="; grep -aE "^\| graaf.wasm|^matrix:" matrix-maak.log || echo "(geen uitslag)"
          for m in clap vst3; do
            echo "== null-test $m matrix Linux =="
            grep -aE "^### " null-matrix-$m.log || echo "(geen uitslag)"
            echo "   bit voor bit: $(grep -acE '^\| .*\| ja \|' null-matrix-$m.log) renders; niet bit voor bit of erger:"
            grep -aE "^\| " null-matrix-$m.log | grep -avE "\| ja \||^\| render|^\|---" || echo "   (geen)"
            grep -aE "^matrix " null-matrix-$m.log || echo "(geen eindregel)"
          done

  rtsan:
    name: RTSan (clang 20, pb-render, kanarie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: clang 20 via apt.llvm.org
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget software-properties-common gnupg
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          clang++-20 --version

      - name: Bouwen met -fsanitize=realtime (pb-render)
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -S plugin -B build-rtsan -G Ninja -DCMAKE_BUILD_TYPE=Release -DPB_RTSAN=ON "-DPB_FORMATEN=CLAP"
          cmake --build build-rtsan

      - name: RTSan schoon (alle testsignalen, blok 512 en wisselend, automatisering)
        run: |
          set -eo pipefail
          CLAP="build-rtsan/plugins/PB Dub-echo.clap"
          mkdir -p uit/rtsan
          : > rtsan.log
          for f in testsignalen/*.in.wav; do
            for blok in 512 3,128,1,4096,77; do
              echo "pb-render $(basename "$f") --blok $blok" | tee -a rtsan.log
              build-rtsan/pb-render "$CLAP" "$f" uit/rtsan/x.wav --blok "$blok" 2>&1 | tee -a rtsan.log
            done
          done
          # fase 5: elke indeling in-place met bypass-events (overvloei), op 44,1 en 192 kHz, blok 1..4096
          printf '24000 10 1\n48000 10 0\n48192 10 1\n96000 10 0\n' > bypass.txt
          for ind in stereo mono mono-stereo; do
            for sr in 44100 192000; do
              echo "pb-render echo-standaard --indeling $ind --sr $sr --in-place, bypass" | tee -a rtsan.log
              build-rtsan/pb-render "$CLAP" testsignalen/echo-standaard.in.wav uit/rtsan/b.wav --sr "$sr" --indeling "$ind" \
                --in-place --blok 1,4096,77,3 --automatie bypass.txt 2>&1 | tee -a rtsan.log
            done
          done
          echo "pb-render automatie (720 events)" | tee -a rtsan.log
          build-rtsan/pb-render "$CLAP" testsignalen/automatie/in.wav uit/rtsan/a.wav --blok 3,128,1,4096,77 \
            --automatie testsignalen/automatie/events.txt --state-rondje 2>&1 | tee -a rtsan.log
          if grep -q "RealtimeSanitizer" rtsan.log; then echo "RTSan vond iets"; exit 1; fi
          echo "RTSan: schoon" | tee -a rtsan.log

      - name: Paneel-toets onder ThreadSanitizer (brievenbus, paneel en audiothread tegelijk)
        run: |
          set -o pipefail
          CLAPINC=$(dirname "$(dirname "$(find build-rtsan/_deps -path '*include/clap/clap.h' | head -1)")")
          clang++-20 -std=c++17 -O1 -g -fsanitize=thread -Iplugin/src -Idsp -I"$CLAPINC" \
            plugin/toets/paneel_toets.cpp plugin/src/paneel_model.cpp -o paneel-tsan -lpthread
          TSAN_OPTIONS=halt_on_error=1 ./paneel-tsan 2>&1 | tee tsan.log
          if grep -q "ThreadSanitizer" tsan.log; then echo "TSan vond iets"; exit 1; fi
          echo "TSan: schoon" | tee -a tsan.log

      - name: Kanarie bouwen (malloc in process)
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -S plugin -B build-kanarie -G Ninja -DCMAKE_BUILD_TYPE=Release -DPB_RTSAN=ON -DPB_KANARIE=ON "-DPB_FORMATEN=CLAP"
          cmake --build build-kanarie

      - name: Kanarie MOET falen
        run: |
          status=0
          build-kanarie/pb-render "build-kanarie/plugins/PB Dub-echo.clap" testsignalen/echo-standaard.in.wav k.wav \
            > kanarie.log 2>&1 || status=$?
          cat kanarie.log
          echo "exitcode: $status"
          if [ "$status" -eq 0 ]; then echo "FOUT: de kanarie werd niet gevangen; RTSan bewaakt niets"; exit 1; fi
          grep -q "RealtimeSanitizer" kanarie.log
          grep -qi "malloc" kanarie.log
          echo "kanarie gevangen zoals bedoeld"

      - name: Bewijs
        if: always()
        run: |
          echo "== RTSan =="; tail -1 rtsan.log || true
          echo "== TSan paneel-toets =="; grep -E "^FOUT|^paneel-toets:|TSan" tsan.log || echo "(geen uitslag)"
          echo "== kanarie =="; grep -E "RealtimeSanitizer|malloc" kanarie.log | head -5 || echo "(geen uitvoer)"

  macos:
    name: macOS arm64 (auval, pluginval AU en VST3)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Gereedschap
        run: brew install ninja || true

      - name: Bouwen
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build
          ls -la build/plugins

      - name: Ad-hoc signeren
        run: |
          for b in build/plugins/*.clap build/plugins/*.vst3 build/plugins/*.component; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Installatiepakket maken (pkgbuild, BundleIsRelocatable false, postinstall; fase 6)
        run: |
          set -o pipefail
          mkdir -p pakket
          sh gereedschap/maak-pkg.sh build/plugins "$PWD/pakket/PB-Dub-echo.pkg" "$(sed -n 's/^project(dub_echo VERSION \([0-9.]*\).*/\1/p' plugin/CMakeLists.txt)" 2>&1 | tee maak-pkg.log

      - name: Installatiepakket (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: macos-installatiepakket
          path: pakket/PB-Dub-echo.pkg
          if-no-files-found: error

      - name: Installeren in ~/Library/Audio/Plug-Ins
        run: |
          P=~/Library/Audio/Plug-Ins
          mkdir -p "$P/Components" "$P/VST3" "$P/CLAP"
          rm -rf "$P/Components/PB Dub-echo.component" "$P/VST3/PB Dub-echo.vst3" "$P/CLAP/PB Dub-echo.clap"
          cp -R "build/plugins/PB Dub-echo.component" "$P/Components/"
          cp -R "build/plugins/PB Dub-echo.vst3" "$P/VST3/"
          cp -R "build/plugins/PB Dub-echo.clap" "$P/CLAP/"
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i "Vrve" || true

      - name: Paneel-toets (model tegen de mockup, muis, brievenbus met twee draden)
        run: |
          set -o pipefail
          build/pb-paneeltoets 2>&1 | tee paneel-toets.log

      - name: Gui-toets (paneel door het .clap in een venster, schermafbeeldingen, muis via de host)
        if: success() || failure()
        run: |
          set -o pipefail
          mkdir -p schermafbeelding
          build/pb-guitoets "$HOME/Library/Audio/Plug-Ins/CLAP/PB Dub-echo.clap" "$PWD/schermafbeelding" 2>&1 | tee gui-toets.log
          ls -la schermafbeelding

      - name: Schermafbeelding (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-schermafbeelding
          path: schermafbeelding/

      - name: auval -strict
        run: |
          status=0
          auval -strict -v aufx PDca Vrve > auval.log 2>&1 || status=$?
          cat auval.log
          echo "exitcode: $status"
          test "$status" -eq 0
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: auval toont elke fabriekspreset (namen uit presets/*.json)
        run: |
          python3 -I -c 'import json,sys; [print(json.load(open(f, encoding="utf-8"))["naam"]) for f in sorted(sys.argv[1:])]' \
            presets/*.json > presetnamen.txt
          while IFS= read -r naam; do
            if grep -F -- "$naam" auval.log > /dev/null; then echo "auval toont preset: $naam"; else echo "auval mist preset: $naam"; fi
          done < presetnamen.txt | tee auval-presets.log
          if grep -q "^auval mist" auval-presets.log; then exit 1; fi
          # een eigen presetnaam van de host moet in ClassInfo blijven (NewCustomPresetSet in clap-wrapper-auv2-presets.patch)
          if grep -q "Preset name is not retained" auval.log; then echo "auval: presetnaam niet bewaard in ClassInfo"; exit 1; fi
          test "$(grep -c '^auval toont preset' auval-presets.log)" -eq "$(wc -l < presetnamen.txt)"

      - name: AU-preset-toets (factory presets van de .component laden, voor en na Initialize)
        if: success() || failure()
        run: |
          set -o pipefail
          build/pb-aupresettoets 2>&1 | tee au-preset-toets.log

      - name: Preset-toets CLAP macOS (door het geïnstalleerde .clap)
        if: success() || failure()
        run: |
          set -o pipefail
          build/pb-presettoets "$HOME/Library/Audio/Plug-Ins/CLAP/PB Dub-echo.clap" 2>&1 | tee preset-toets.log

      - name: pluginval ophalen
        run: |
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSIE/pluginval_macOS.zip"
          unzip -oq pv.zip -d pv
          ls pv
          echo "PV=$PWD/pv/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"

      - name: pluginval AU (strictness 10, --rtcheck enabled, --repeat 3)
        run: |
          status=0
          "$PV" validate --strictness-level 10 --rtcheck enabled --repeat 3 \
            "$HOME/Library/Audio/Plug-Ins/Components/PB Dub-echo.component" > pluginval-au.log 2>&1 || status=$?
          cat pluginval-au.log
          echo "exitcode: $status"
          test "$status" -eq 0
          grep -q "^SUCCESS" pluginval-au.log

      - name: pluginval VST3 (strictness 10, --rtcheck enabled)
        run: |
          status=0
          "$PV" validate --strictness-level 10 --rtcheck enabled \
            "$HOME/Library/Audio/Plug-Ins/VST3/PB Dub-echo.vst3" > pluginval-vst3.log 2>&1 || status=$?
          cat pluginval-vst3.log
          echo "exitcode: $status"
          test "$status" -eq 0
          grep -q "^SUCCESS" pluginval-vst3.log

      - name: Null-test CLAP (pb-render; blok 512, wisselend, state-rondje, automatisering)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh clap build 2>&1 | tee null-clap.log

      - name: State-toets (blobs met de hand, tekst <-> waarde; door het .clap)
        run: |
          set -o pipefail
          build/pb-statetoets "$HOME/Library/Audio/Plug-Ins/CLAP/PB Dub-echo.clap" 2>&1 | tee state-toets.log

      - name: Null-test VST3 (pluginval test)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh pluginval "$HOME/Library/Audio/Plug-Ins/VST3/PB Dub-echo.vst3" "$PV" vst3-macos 2>&1 | tee null-vst3.log

      - name: Null-test AU (pluginval test)
        run: |
          set -o pipefail
          sh gereedschap/ci-null.sh pluginval "$HOME/Library/Audio/Plug-Ins/Components/PB Dub-echo.component" "$PV" au-macos 2>&1 | tee null-au.log

      - name: Matrix - verwachte uitvoer uit graaf.wasm (eerst testsignalen bit voor bit; 44,1-192 kHz, drie indelingen, bypass)
        run: |
          set -o pipefail
          node gereedschap/matrix.mjs maak "$PWD/uit/matrix" 2>&1 | tee matrix-maak.log

      - name: Null-test CLAP matrix (pb-render; elke samplerate en indeling, blok 512 en 1,4096,77,3 in-place, bypass)
        if: success() || failure()
        run: |
          set -o pipefail
          node gereedschap/matrix.mjs clap "$PWD/uit/matrix" build/pb-render "$HOME/Library/Audio/Plug-Ins/CLAP/PB Dub-echo.clap" 2>&1 | tee null-matrix-clap.log

      - name: Null-test AU matrix (pb-aurender; 2 naar 2, 1 naar 1, 1 naar 2, elke samplerate, bypass via kAudioUnitProperty_BypassEffect)
        if: success() || failure()
        run: |
          set -o pipefail
          mkdir -p uit/au
          build/pb-aurender "$PWD/uit/matrix/au-lijst.txt" "$PWD/uit/au" 2>&1 | tee au-render.log
          node gereedschap/matrix.mjs vergelijk "$PWD/uit/matrix" "$PWD/uit/au" "AU pb-aurender" 2>&1 | tee null-matrix-au.log

      - name: Null-test AU matrix (pluginval test per samplerate, blok 1..4096)
        if: success() || failure()
        run: |
          set -o pipefail
          node gereedschap/matrix.mjs pluginval "$PWD/uit/matrix" "$PV" "$HOME/Library/Audio/Plug-Ins/Components/PB Dub-echo.component" au-macos 2>&1 | tee null-matrix-aupv.log

      - name: Null-test VST3 matrix (pluginval test per samplerate, blok 1..4096)
        if: success() || failure()
        run: |
          set -o pipefail
          node gereedschap/matrix.mjs pluginval "$PWD/uit/matrix" "$PV" "$HOME/Library/Audio/Plug-Ins/VST3/PB Dub-echo.vst3" vst3-macos 2>&1 | tee null-matrix-vst3.log

      - name: Bundels zippen (GitHub-artefacten bewaren geen rechten of symlinks)
        if: always()
        run: |
          mkdir -p artefact
          cd build/plugins
          for b in *.clap *.vst3 *.component; do [ -e "$b" ] && ditto -c -k --keepParent "$b" "../../artefact/$b.zip"; done
          ls -la ../../artefact

      - name: Artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-keten_dub_echo
          path: artefact/

      - name: Bewijs
        if: always()
        run: |
          echo "== installatiepakket =="; grep -aE "bundels|BundleIsRelocatable|^maak-pkg|^FOUT|pkgbuild: (Wrote|error)" maak-pkg.log || echo "(geen uitslag)"
          echo "== auval =="; grep -E "AU VALIDATION|Tail Time|FAIL|WARNING" auval.log || echo "(geen uitslag)"
          echo "   presets in auval:"; cat auval-presets.log || echo "(geen uitslag)"
          echo "   regels van auval met een presetnaam:"; grep -F -f presetnamen.txt auval.log || echo "(geen)"
          echo "== AU-preset-toets =="; grep -E "^FOUT|^ok  .*factory preset|^au-preset-toets:" au-preset-toets.log || echo "(geen uitslag)"
          echo "== preset-toets CLAP macOS =="; grep -E "^FOUT|^presets:|^preset-toets:" preset-toets.log || echo "(geen uitslag)"
          echo "== pluginval AU =="; grep -E "^SUCCESS|^FAILURE|FAILED|!!!|Real-time violation" pluginval-au.log || echo "(geen uitslag)"
          echo "   editor-toetsen AU (niet overgeslagen):"; grep -E "Starting test.*(Editor|editor)|Open editor|Skipping editor|skip-gui" pluginval-au.log | sort | uniq -c || echo "(geen editor-toetsen gevonden)"
          echo "== pluginval VST3 macOS =="; grep -E "^SUCCESS|^FAILURE|FAILED|!!!|Real-time violation" pluginval-vst3.log || echo "(geen uitslag)"
          echo "   editor-toetsen VST3 (niet overgeslagen):"; grep -E "Starting test.*(Editor|editor)|Open editor|Skipping editor|skip-gui" pluginval-vst3.log | sort | uniq -c || echo "(geen editor-toetsen gevonden)"
          echo "== paneel-toets macOS =="; grep -E "^FOUT|^paneel-toets:" paneel-toets.log || echo "(geen uitslag)"
          echo "== gui-toets macOS =="; grep -aE "^FOUT|^gui-toets:|schermafbeelding|^kaart|^  \|" gui-toets.log || echo "(geen uitslag)"
          echo "== state-toets macOS =="; grep -E "^FOUT|^state-toets:" state-toets.log || echo "(geen uitslag)"
          echo "== null-test CLAP macOS =="; grep -aE "^###|^\| [a-z]" null-clap.log || echo "(geen uitslag)"
          echo "== null-test VST3 macOS =="; grep -aE "^###|^\| [a-z]|^PASSED|^FAILED" null-vst3.log || echo "(geen uitslag)"
          echo "== null-test AU macOS =="; grep -aE "^###|^\| [a-z]|^PASSED|^FAILED" null-au.log || echo "(geen uitslag)"
          echo "== auval: kanaalindelingen =="; grep -aiE -A3 "channel (handling|capabilities)" auval.log || echo "(geen)"
          echo "== matrix: graaf.wasm tegen testsignalen =="; grep -aE "^\| graaf.wasm|^matrix:" matrix-maak.log || echo "(geen uitslag)"
          echo "== pb-aurender =="; grep -aE "^pb-aurender: [0-9]+ renders|pb-aurender: .*(status|niet)" au-render.log || echo "(geen uitslag)"
          for m in clap au aupv vst3; do
            echo "== null-test $m matrix macOS =="
            grep -aE "^### " null-matrix-$m.log || echo "(geen uitslag)"
            echo "   bit voor bit: $(grep -acE '^\| .*\| ja \|' null-matrix-$m.log) renders; niet bit voor bit of erger:"
            grep -aE "^\| " null-matrix-$m.log | grep -avE "\| ja \||^\| render|^\|---" || echo "   (geen)"
            grep -aE "^matrix " null-matrix-$m.log || echo "(geen eindregel)"
          done

  installeren:
    name: macOS installatiepakket op een verse runner (installer twee keer, plek, handtekening, auval)
    needs: macos
    runs-on: macos-15
    steps:
      # niets bouwen en niets uitchecken: alleen het .pkg uit de macos-job
      - name: Installatiepakket ophalen
        uses: actions/download-artifact@v4
        with:
          name: macos-installatiepakket
          path: pakket

      - name: Pakket bekijken (ongesigneerd, geen bundel in relocate)
        run: |
          ls -la pakket
          pkgutil --check-signature pakket/PB-Dub-echo.pkg | tee pakket.log || true
          pkgutil --expand pakket/PB-Dub-echo.pkg uitgepakt
          cat uitgepakt/PackageInfo | tee -a pakket.log
          echo "bundels in relocate: $(xmllint --xpath 'count(//relocate/bundle)' uitgepakt/PackageInfo)" | tee -a pakket.log
          test "$(xmllint --xpath 'count(//relocate/bundle)' uitgepakt/PackageInfo)" = 0
          # schone runner: nog niets van ons op de schijf
          for d in /Library/Audio/Plug-Ins ~/Library/Audio/Plug-Ins; do
            if ls "$d"/*/"PB Dub-echo".* > /dev/null 2>&1; then echo "FOUT: runner is niet schoon ($d)"; exit 1; fi
          done
          echo "runner schoon" | tee -a pakket.log

      - name: Lokbundel elders op de schijf (Installer mag hem niet verplaatsen of overschrijven)
        run: |
          pkgutil --expand-full pakket/PB-Dub-echo.pkg vol
          mkdir -p /Users/Shared/elders
          ditto "vol/Payload/Components/PB Dub-echo.component" "/Users/Shared/elders/PB Dub-echo.component"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "/Users/Shared/elders/PB Dub-echo.component" || true
          echo lok > "/Users/Shared/elders/PB Dub-echo.component/Contents/lok.txt"
          shasum -a 256 "/Users/Shared/elders/PB Dub-echo.component/Contents/MacOS/PB Dub-echo" | tee lok-voor.txt

      - name: Installeren, eerste keer (install)
        run: |
          set -o pipefail
          sudo installer -pkg pakket/PB-Dub-echo.pkg -target / 2>&1 | tee installeer-1.log
          grep -q "The install was successful" installeer-1.log
          if grep -qi "upgrad" installeer-1.log; then echo "FOUT: eerste installatie meldt upgrade"; exit 1; fi

      - name: Installeren, tweede keer (upgrade)
        run: |
          set -o pipefail
          sudo installer -pkg pakket/PB-Dub-echo.pkg -target / 2>&1 | tee installeer-2.log
          grep -q "The upgrade was successful" installeer-2.log

      - name: Plek en handtekening van alle drie
        run: |
          set -eo pipefail
          P=/Library/Audio/Plug-Ins
          : > plek.log
          for b in "$P/Components/PB Dub-echo.component" "$P/VST3/PB Dub-echo.vst3" "$P/CLAP/PB Dub-echo.clap"; do
            test -d "$b" || { echo "FOUT: ontbreekt: $b" | tee -a plek.log; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$b" 2>&1 | tee -a plek.log
            codesign -dv "$b" 2>&1 | grep -E "^(Identifier|Signature)=" | tee -a plek.log
            codesign -dv "$b" 2>&1 | grep -q "^Signature=adhoc"
            echo "eigenaar: $(stat -f '%Su:%Sg %Sp' "$b")" | tee -a plek.log
            echo "ok: $b (ad-hoc gesigneerd)" | tee -a plek.log
          done
          # de lokbundel elders is niet aangeraakt en er staat niets in ~/Library
          test -f "/Users/Shared/elders/PB Dub-echo.component/Contents/lok.txt"
          shasum -a 256 -c lok-voor.txt
          if ls ~/Library/Audio/Plug-Ins/*/"PB Dub-echo".* > /dev/null 2>&1; then echo "FOUT: iets in ~/Library"; exit 1; fi
          echo "lokbundel elders onaangeroerd" | tee -a plek.log
          pkgutil --pkg-info nl.varve.pluginbouwer.dub-echo.pkg | tee -a plek.log
          pkgutil --files nl.varve.pluginbouwer.dub-echo.pkg | grep -E '\.(component|vst3|clap)$' | tee -a plek.log
          grep -i "relocat" /var/log/install.log | tail -5 || echo "install.log: niets over relocatie"

      - name: postinstall draaide (AudioComponentRegistrar)
        run: |
          grep -E "postinstall|AudioComponentRegistrar" /var/log/install.log | tail -10 | tee postinstall.log || true
          auval -a | grep -i "Vrve" | tee -a postinstall.log

      - name: auval -strict
        run: |
          status=0
          auval -strict -v aufx PDca Vrve > auval.log 2>&1 || status=$?
          cat auval.log
          echo "exitcode: $status"
          test "$status" -eq 0
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          # de AU die auval laadt, komt uit /Library (de lokbundel is van dezelfde AU)
          grep -iE "Plug-Ins/Components|elders" auval.log || true

      - name: Bewijs
        if: always()
        run: |
          echo "== pakket =="; grep -E "Status|bundels in relocate|runner schoon|FOUT" pakket.log || echo "(geen uitslag)"
          echo "== installatie 1 =="; grep -E "installer: (Installing|Upgrading)|The (install|upgrade) was|FOUT" installeer-1.log || echo "(geen uitslag)"
          echo "== installatie 2 =="; grep -E "installer: (Installing|Upgrading)|The (install|upgrade) was|FOUT" installeer-2.log || echo "(geen uitslag)"
          echo "== plek en handtekening =="; cat plek.log || echo "(geen uitslag)"
          echo "== postinstall =="; cat postinstall.log || echo "(geen uitslag)"
          echo "== auval =="; grep -E "AU VALIDATION|FAIL|WARNING|Tail Time" auval.log || echo "(geen uitslag)"
